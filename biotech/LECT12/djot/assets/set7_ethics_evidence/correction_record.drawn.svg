<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">Follow the evidence before assigning blame</title><desc id="desc">Topic 3. Teaching schematic based on COPE retraction guidance and the NSF definition.</desc><text x="500" y="45" font-size="35" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">A concern about a figure starts with the record</text><rect x="45" y="108" width="270" height="128" rx="20" fill="#C3E0F1" stroke="#344651" stroke-width="3"/><text x="180.0" y="161" font-size="31" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Raw files</text><text x="180.0" y="207" font-size="23" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">original images and dates</text><g fill="none" stroke="#344651" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="320,170 360,170"/><polyline points="345.0,177.5 360,170 345.0,162.5"/></g><rect x="365" y="108" width="270" height="128" rx="20" fill="#FFD47C" stroke="#344651" stroke-width="3"/><text x="500.0" y="161" font-size="31" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Compare</text><text x="500.0" y="207" font-size="23" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">does the panel match?</text><g fill="none" stroke="#344651" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="640,170 680,170"/><polyline points="665.0,177.5 680,170 665.0,162.5"/></g><rect x="685" y="108" width="270" height="128" rx="20" fill="#D6EBDD" stroke="#344651" stroke-width="3"/><text x="820.0" y="161" font-size="31" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Correct or retract</text><text x="820.0" y="207" font-size="23" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">tell readers what changed</text><text x="500" y="304" font-size="29" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">The record can show an honest mistake or support an investigation.</text><text x="500" y="359" font-size="27" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">A retraction changes the literature. It does not, by itself, name misconduct.</text></svg>
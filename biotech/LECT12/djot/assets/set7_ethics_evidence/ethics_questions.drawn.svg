<svg xmlns="http://www.w3.org/2000/svg" width="943" height="404" viewBox="28 12 943 404" role="img" aria-labelledby="title desc"><title id="title">Three questions in an ethics decision</title><desc id="desc">Topic 1. Evidence, consent, and justice are distinct questions.</desc><text x="500" y="48" font-size="35" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">A biotech decision has more than one kind of question</text><rect x="45" y="108" width="270" height="124" rx="20" fill="#C3E0F1" stroke="#344651" stroke-width="3"/><text x="180.0" y="161" font-size="31" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Evidence</text><text x="180.0" y="207" font-size="23" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">What did it measure?</text><rect x="365" y="108" width="270" height="124" rx="20" fill="#FFD47C" stroke="#344651" stroke-width="3"/><text x="500.0" y="161" font-size="31" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Consent</text><text x="500.0" y="207" font-size="23" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Did they agree?</text><rect x="685" y="108" width="270" height="124" rx="20" fill="#D6EBDD" stroke="#344651" stroke-width="3"/><text x="820.0" y="161" font-size="31" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Justice</text><text x="820.0" y="207" font-size="23" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Who bears the risk?</text><line x1="500" y1="264" x2="500" y2="312" stroke="#275A88" stroke-width="4" stroke-linecap="round"/><g fill="none" stroke="#344651" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="500,312 500,354"/><polyline points="492.5,339.0 500,354 507.5,339.0"/></g><text x="500" y="400" font-size="29" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">A committee can review the plan. People still disagree about the answer.</text></svg>
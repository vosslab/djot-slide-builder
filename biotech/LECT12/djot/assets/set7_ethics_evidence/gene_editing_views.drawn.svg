<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc"><title id="title">Public views depend on purpose</title><desc id="desc">Topic 2. Pew survey of U.S. adults, November 2021. Percentages are favor responses.</desc><text x="500" y="45" font-size="33" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">U.S. adults favored some uses of gene editing more than others</text><text x="30" y="131" font-size="25" fill="#344651" text-anchor="start" font-family="Atkinson Hyperlegible Next">Treat a serious condition</text><text x="30" y="163" font-size="25" fill="#344651" text-anchor="start" font-family="Atkinson Hyperlegible Next">a person has now</text><rect x="560" y="110" width="350" height="54" fill="#E7EAEB"/><rect x="560" y="110" width="248.5" height="54" fill="#247257"/><text x="828.5" y="160" font-size="29" fill="#344651" text-anchor="start" font-family="Atkinson Hyperlegible Next">71% favor</text><text x="30" y="259" font-size="25" fill="#344651" text-anchor="start" font-family="Atkinson Hyperlegible Next">Make a baby more</text><text x="30" y="291" font-size="25" fill="#344651" text-anchor="start" font-family="Atkinson Hyperlegible Next">physically attractive</text><rect x="560" y="238" width="350" height="54" fill="#E7EAEB"/><rect x="560" y="238" width="17.5" height="54" fill="#AF3C42"/><text x="597.5" y="288" font-size="29" fill="#344651" text-anchor="start" font-family="Atkinson Hyperlegible Next">5% favor</text><line x1="560" y1="358" x2="910" y2="358" stroke="#344651" stroke-width="2" stroke-linecap="round"/><text x="560" y="396" font-size="24" fill="#344651" text-anchor="start" font-family="Atkinson Hyperlegible Next">0%</text><text x="910" y="396" font-size="24" fill="#344651" text-anchor="end" font-family="Atkinson Hyperlegible Next">100%</text><text x="500" y="429" font-size="25" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Pew surveyed U.S. adults on Nov. 1-7, 2021. The report appeared in 2022.</text></svg>
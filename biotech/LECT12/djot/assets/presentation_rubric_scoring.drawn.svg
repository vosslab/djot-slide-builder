<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">Presentation rubric: scoring levels</title>
  <desc id="desc">Six scoring levels each for slide quality, content depth, and presentation delivery.</desc>
  <g font-family="IBM Plex Sans Condensed">
    <rect x="0" y="0" width="1280" height="650" rx="6" fill="#FFFDFD"/>
    <g id="slide-quality">
      <rect x="0" y="0" width="1280" height="34" rx="6" fill="#F6DDDE"/>
      <text x="14" y="25" font-size="27" fill="#7B1E2B" font-weight="700" text-anchor="start">Slide Quality: Simplicity, Readability, and Visual Design (5 points)</text>
      <text x="14" y="54" font-size="17" fill="#172033" font-weight="400" text-anchor="start">This section assesses the effectiveness of the slides in supporting the presentation. It evaluates how well the layout, text, and visuals enhance readability and audience</text>
      <text x="14" y="70" font-size="17" fill="#172033" font-weight="400" text-anchor="start">engagement without overwhelming or distracting from the content.</text>
      <rect x="0" y="75" width="1280" height="23" rx="0" fill="#FAF6F6"/>
      <text x="14" y="92" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">4.9</text>
      <text x="77" y="92" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Excellent (A)</text>
      <text x="210" y="92" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Visually appealing, balanced layout, minimal text, strong, relevant visuals, clear flow between slides.</text>
      <text x="14" y="115" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">4.6</text>
      <text x="77" y="115" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Great (A-)</text>
      <text x="210" y="115" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Mostly clear, some minor text or design issues, visuals support the content well, good overall flow.</text>
      <rect x="0" y="121" width="1280" height="23" rx="0" fill="#FAF6F6"/>
      <text x="14" y="138" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">4.4</text>
      <text x="77" y="138" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Good (B+)</text>
      <text x="210" y="138" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Functional slides, some text-heavy sections, minor clutter, visuals present but less effective.</text>
      <text x="14" y="161" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">4.2</text>
      <text x="77" y="161" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Decent (B-)</text>
      <text x="210" y="161" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Readable but cluttered, heavy text, inconsistent or confusing visuals, some design issues.</text>
      <rect x="0" y="167" width="1280" height="23" rx="0" fill="#FAF6F6"/>
      <text x="14" y="184" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">3.4</text>
      <text x="77" y="184" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Weak (D+)</text>
      <text x="210" y="184" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Poor readability, excessive text, unclear or irrelevant visuals, disorganized layout.</text>
      <text x="14" y="207" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">3.0</text>
      <text x="77" y="207" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Poor (D-)</text>
      <text x="210" y="207" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Disorganized, hard to read, little to no visuals, distracting design choices.</text>
    </g>
    <g id="content-depth">
      <rect x="0" y="218" width="1280" height="34" rx="6" fill="#F6DDDE"/>
      <text x="14" y="243" font-size="27" fill="#7B1E2B" font-weight="700" text-anchor="start">Content Depth: Critical Thought, Factual Details, and Organization (5 points)</text>
      <text x="14" y="272" font-size="17" fill="#172033" font-weight="400" text-anchor="start">This section evaluates the quality and depth of the content presented. It assesses the research, the level of critical thinking, the inclusion of factual details, and how</text>
      <text x="14" y="288" font-size="17" fill="#172033" font-weight="400" text-anchor="start">well-organized the information is.</text>
      <rect x="0" y="293" width="1280" height="23" rx="0" fill="#FAF6F6"/>
      <text x="14" y="310" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">4.9</text>
      <text x="77" y="310" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Excellent (A)</text>
      <text x="210" y="310" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Insightful, well-researched, critical thinking, detailed and clear, organized intro, body, conclusion.</text>
      <text x="14" y="333" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">4.6</text>
      <text x="77" y="333" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Great (A-)</text>
      <text x="210" y="333" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Clear and accurate, well-organized, minor gaps in depth or analysis, good research.</text>
      <rect x="0" y="339" width="1280" height="23" rx="0" fill="#FAF6F6"/>
      <text x="14" y="356" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">4.4</text>
      <text x="77" y="356" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Good (B+)</text>
      <text x="210" y="356" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Solid content, some missing detail or depth, adequate organization, factual but not in-depth.</text>
      <text x="14" y="379" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">4.2</text>
      <text x="77" y="379" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Decent (B-)</text>
      <text x="210" y="379" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Vague or lacking critical detail, basic organization, minimal research or analysis.</text>
      <rect x="0" y="385" width="1280" height="23" rx="0" fill="#FAF6F6"/>
      <text x="14" y="402" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">3.4</text>
      <text x="77" y="402" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Weak (D+)</text>
      <text x="210" y="402" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Superficial, lacks research or depth, disorganized or missing structure.</text>
      <text x="14" y="425" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">3.0</text>
      <text x="77" y="425" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Poor (D-)</text>
      <text x="210" y="425" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Disorganized, unclear content, minimal research, no critical analysis.</text>
    </g>
    <g id="delivery">
      <rect x="0" y="436" width="1280" height="34" rx="6" fill="#F6DDDE"/>
      <text x="14" y="461" font-size="27" fill="#7B1E2B" font-weight="700" text-anchor="start">Presentation Delivery: Enthusiasm, Clarity, Interactivity, and Pace (7 points)</text>
      <text x="14" y="490" font-size="17" fill="#172033" font-weight="400" text-anchor="start">This section measures how effectively the student delivers the presentation. It evaluates enthusiasm, clarity, audience engagement, and the pacing of the presentation to</text>
      <text x="14" y="506" font-size="17" fill="#172033" font-weight="400" text-anchor="start">maintain interest.</text>
      <rect x="0" y="511" width="1280" height="23" rx="0" fill="#FAF6F6"/>
      <text x="14" y="528" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">6.8</text>
      <text x="77" y="528" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Excellent (A)</text>
      <text x="210" y="528" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Engaging, confident, clear, well-paced, interactive, maintains audience attention throughout.</text>
      <text x="14" y="551" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">6.4</text>
      <text x="77" y="551" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Great (A-)</text>
      <text x="210" y="551" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Clear and engaging, minor pacing issues or gaps in audience interaction, mostly confident delivery.</text>
      <rect x="0" y="557" width="1280" height="23" rx="0" fill="#FAF6F6"/>
      <text x="14" y="574" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">6.0</text>
      <text x="77" y="574" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Good (B+)</text>
      <text x="210" y="574" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Understandable but lacks energy, slight monotone or rushed delivery, minimal audience engagement.</text>
      <text x="14" y="597" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">5.8</text>
      <text x="77" y="597" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Decent (B-)</text>
      <text x="210" y="597" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Somewhat clear, lacks enthusiasm, pacing issues, minimal interaction with audience.</text>
      <rect x="0" y="603" width="1280" height="23" rx="0" fill="#FAF6F6"/>
      <text x="14" y="620" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">4.8</text>
      <text x="77" y="620" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Weak (D+)</text>
      <text x="210" y="620" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Hard to follow, disengaged delivery, poor pacing, limited interaction.</text>
      <text x="14" y="643" font-size="23" fill="#7B1E2B" font-weight="700" text-anchor="start">4.2</text>
      <text x="77" y="643" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Poor (D-)</text>
      <text x="210" y="643" font-size="23" fill="#172033" font-weight="400" text-anchor="start">Confusing, monotone, rushed or too slow, no audience engagement.</text>
    </g>
  </g>
</svg>
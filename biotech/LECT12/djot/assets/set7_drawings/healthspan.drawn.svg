<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="393" viewBox="0 0 1000 393" role="img" aria-labelledby="title desc"><title id="title">Equal lifespans with different periods of mobility</title><desc id="desc">Topic 32. The two groups live 30 months. Mobility persists to 26 and 20 months in this example.</desc><text x="35" y="53" font-size="30" fill="#344651" text-anchor="start" font-family="Atkinson Hyperlegible Next">Mobility in an invented mouse cohort</text><text x="35" y="132" font-size="29" fill="#344651" text-anchor="start" font-family="Atkinson Hyperlegible Next">Group A</text><rect x="223" y="102" width="572" height="36" fill="#275A88"/><rect x="795" y="102" width="88" height="36" fill="#C9CBCD"/><text x="795" y="178" font-size="26" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">26 mo.</text><text x="35" y="239" font-size="29" fill="#344651" text-anchor="start" font-family="Atkinson Hyperlegible Next">Group B</text><rect x="223" y="209" width="440" height="36" fill="#275A88"/><rect x="663" y="209" width="220" height="36" fill="#C9CBCD"/><text x="663" y="285" font-size="26" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">20 mo.</text><text x="220" y="314" font-size="26" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Birth</text><text x="885" y="314" font-size="26" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">30 months</text><rect x="245" y="349" width="29" height="20" fill="#275A88"/><text x="288" y="367" font-size="25" fill="#344651" text-anchor="start" font-family="Atkinson Hyperlegible Next">Mobile</text><rect x="541" y="349" width="29" height="20" fill="#C9CBCD"/><text x="584" y="367" font-size="25" fill="#344651" text-anchor="start" font-family="Atkinson Hyperlegible Next">Limited mobility</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="327" viewBox="0 0 1000 327" role="img" aria-labelledby="title desc"><title id="title">Where fertilization can occur in IUI and IVF</title><desc id="desc">Topic 21. Sperm placement precedes possible fertilization in IUI. Fertilization precedes possible transfer in IVF.</desc><text x="80" y="112" font-size="40" fill="#275A88" text-anchor="middle" font-family="Atkinson Hyperlegible Next">IUI</text><text x="365" y="112" font-size="30" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Sperm placed in uterus</text><g fill="none" stroke="#344651" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="548,100 626,100"/><polyline points="611.0,107.5 626,100 611.0,92.5"/></g><text x="810" y="112" font-size="29" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Fertilization in the body</text><text x="80" y="270" font-size="40" fill="#275A88" text-anchor="middle" font-family="Atkinson Hyperlegible Next">IVF</text><text x="365" y="270" font-size="30" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Fertilization in the lab</text><g fill="none" stroke="#344651" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="548,258 626,258"/><polyline points="611.0,265.5 626,258 611.0,250.5"/></g><text x="810" y="270" font-size="29" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Embryo transfer to uterus</text><line x1="55" y1="179" x2="940" y2="179" stroke="#A4ACB0" stroke-width="2" stroke-linecap="round"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="379" viewBox="0 0 1000 379" role="img" aria-labelledby="title desc"><title id="title">Two half-lives in the moa bone model</title><desc id="desc">Topic 16. Applying the reported half-life twice leaves one quarter of the starting fragments.</desc><line x1="130" y1="260" x2="895" y2="260" stroke="#344651" stroke-width="4" stroke-linecap="round"/><line x1="130" y1="46" x2="130" y2="260" stroke="#344651" stroke-width="4" stroke-linecap="round"/><rect x="175" y="80.0" width="90" height="180.0" fill="#275A88"/><text x="220" y="66.0" font-size="31" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">100%</text><text x="220" y="305" font-size="28" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Start</text><rect x="505" y="170.0" width="90" height="90.0" fill="#275A88"/><text x="550" y="156.0" font-size="31" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">50%</text><text x="550" y="305" font-size="28" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">521 years</text><rect x="835" y="215.0" width="90" height="45.0" fill="#275A88"/><text x="880" y="201.0" font-size="31" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">25%</text><text x="880" y="305" font-size="28" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">1,042 years</text><text x="510" y="352" font-size="28" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Fraction of intact 242-base-pair fragments in the model</text></svg>
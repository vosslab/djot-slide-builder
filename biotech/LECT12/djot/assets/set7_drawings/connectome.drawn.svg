<svg xmlns="http://www.w3.org/2000/svg" width="892" height="335" viewBox="54 11 892 335" role="img" aria-labelledby="title desc"><title id="title">Connectivity and activity answer different questions</title><desc id="desc">Topic 36. Invented four-neuron network. On the right only neurons A and C are active.</desc><text x="250" y="44" font-size="31" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Wiring map</text><line x1="95" y1="180" x2="235" y2="104" stroke="#344651" stroke-width="5" stroke-linecap="round"/><line x1="95" y1="180" x2="240" y2="245" stroke="#344651" stroke-width="5" stroke-linecap="round"/><line x1="235" y1="104" x2="385" y2="178" stroke="#344651" stroke-width="5" stroke-linecap="round"/><line x1="240" y1="245" x2="385" y2="178" stroke="#344651" stroke-width="5" stroke-linecap="round"/><circle cx="95" cy="180" r="29" fill="#C3E0F1" stroke="#344651" stroke-width="3"/><text x="95" y="189" font-size="26" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">A</text><circle cx="235" cy="104" r="29" fill="#C3E0F1" stroke="#344651" stroke-width="3"/><text x="235" y="113" font-size="26" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">B</text><circle cx="240" cy="245" r="29" fill="#C3E0F1" stroke="#344651" stroke-width="3"/><text x="240" y="254" font-size="26" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">C</text><circle cx="385" cy="178" r="29" fill="#C3E0F1" stroke="#344651" stroke-width="3"/><text x="385" y="187" font-size="26" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">D</text><text x="750" y="44" font-size="31" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Activity at one moment</text><line x1="595" y1="180" x2="735" y2="104" stroke="#344651" stroke-width="5" stroke-linecap="round"/><line x1="595" y1="180" x2="740" y2="245" stroke="#344651" stroke-width="5" stroke-linecap="round"/><line x1="735" y1="104" x2="885" y2="178" stroke="#344651" stroke-width="5" stroke-linecap="round"/><line x1="740" y1="245" x2="885" y2="178" stroke="#344651" stroke-width="5" stroke-linecap="round"/><circle cx="595" cy="180" r="29" fill="#FFD47C" stroke="#344651" stroke-width="3"/><text x="595" y="189" font-size="26" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">A</text><circle cx="735" cy="104" r="29" fill="#C3E0F1" stroke="#344651" stroke-width="3"/><text x="735" y="113" font-size="26" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">B</text><circle cx="740" cy="245" r="29" fill="#FFD47C" stroke="#344651" stroke-width="3"/><text x="740" y="254" font-size="26" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">C</text><circle cx="885" cy="178" r="29" fill="#C3E0F1" stroke="#344651" stroke-width="3"/><text x="885" y="187" font-size="26" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">D</text><text x="500" y="331" font-size="26" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Same connections in both views. Gold marks active neurons in this example.</text></svg>
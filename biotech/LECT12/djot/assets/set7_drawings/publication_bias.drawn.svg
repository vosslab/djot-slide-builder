<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" role="img" aria-labelledby="title desc"><title id="title">The same research program seen through two records</title><desc id="desc">Topic 41. Turner et al. reported 94 percent appearing positive in publication versus 51 percent according to FDA.</desc><text x="215" y="107" font-size="30" fill="#344651" text-anchor="end" font-family="Atkinson Hyperlegible Next">Journal articles</text><rect x="251" y="73" width="564" height="48" fill="#275A88"/><text x="831" y="108" font-size="30" fill="#344651" text-anchor="start" font-family="Atkinson Hyperlegible Next">94%</text><text x="215" y="218" font-size="30" fill="#344651" text-anchor="end" font-family="Atkinson Hyperlegible Next">FDA records</text><rect x="251" y="184" width="306" height="48" fill="#275A88"/><text x="573" y="219" font-size="30" fill="#344651" text-anchor="start" font-family="Atkinson Hyperlegible Next">51%</text><line x1="251" y1="272" x2="851" y2="272" stroke="#344651" stroke-width="3" stroke-linecap="round"/><line x1="251" y1="269" x2="251" y2="282" stroke="#344651" stroke-width="2" stroke-linecap="round"/><text x="251" y="314" font-size="24" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">0%</text><line x1="551" y1="269" x2="551" y2="282" stroke="#344651" stroke-width="2" stroke-linecap="round"/><text x="551" y="314" font-size="24" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">50%</text><line x1="851" y1="269" x2="851" y2="282" stroke="#344651" stroke-width="2" stroke-linecap="round"/><text x="851" y="314" font-size="24" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">100%</text><text x="545" y="368" font-size="28" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Share of trials that appeared positive in each record</text></svg>
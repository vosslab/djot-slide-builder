<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="393" viewBox="0 0 1000 393" role="img" aria-labelledby="title desc"><title id="title">Two routes to genetically different cell groups</title><desc id="desc">Topic 17. Schematic embryonic chimera has two origins. In the mosaic, B arises within one lineage.</desc><text x="250" y="42" font-size="32" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Chimera</text><rect x="100" y="191" width="300" height="83" rx="35" fill="#F3F5F2" stroke="#71828C" stroke-width="2"/><circle cx="165" cy="105" r="27" fill="#C3E0F1" stroke="#344651" stroke-width="3"/><text x="165" y="114" font-size="26" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">A</text><circle cx="335" cy="105" r="27" fill="#FFD47C" stroke="#344651" stroke-width="3"/><text x="335" y="114" font-size="26" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">B</text><g fill="none" stroke="#344651" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="165,140 165,184"/><polyline points="157.5,169.0 165,184 172.5,169.0"/></g><circle cx="165" cy="232" r="32" fill="#C3E0F1" stroke="#344651" stroke-width="3"/><text x="165" y="242" font-size="28" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">A</text><g fill="none" stroke="#344651" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="335,140 335,184"/><polyline points="327.5,169.0 335,184 342.5,169.0"/></g><circle cx="335" cy="232" r="32" fill="#FFD47C" stroke="#344651" stroke-width="3"/><text x="335" y="242" font-size="28" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">B</text><text x="250" y="314" font-size="27" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Two starting embryos</text><text x="750" y="42" font-size="32" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Mosaic</text><rect x="600" y="191" width="300" height="83" rx="35" fill="#F3F5F2" stroke="#71828C" stroke-width="2"/><circle cx="750" cy="105" r="27" fill="#C3E0F1" stroke="#344651" stroke-width="3"/><text x="750" y="114" font-size="26" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">A</text><g fill="none" stroke="#344651" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="750,140 665,184"/><polyline points="674.8732552979211,170.4438637576162 665,184 681.7688621726597,183.76492249290663"/></g><circle cx="665" cy="232" r="32" fill="#C3E0F1" stroke="#344651" stroke-width="3"/><text x="665" y="242" font-size="28" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">A</text><g fill="none" stroke="#344651" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="750,140 835,184"/><polyline points="818.2311378273403,183.76492249290663 835,184 825.1267447020789,170.4438637576162"/></g><circle cx="835" cy="232" r="32" fill="#FFD47C" stroke="#344651" stroke-width="3"/><text x="835" y="242" font-size="28" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">B</text><text x="750" y="314" font-size="27" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">One starting embryo</text><line x1="500" y1="60" x2="500" y2="270" stroke="#A4ACB0" stroke-width="2" stroke-linecap="round"/><text x="500" y="370" font-size="27" fill="#344651" text-anchor="middle" font-family="Atkinson Hyperlegible Next">Each enclosure represents one individual.</text></svg>
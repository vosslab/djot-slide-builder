<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">Levels of biological recovery</title><desc id="desc">Four labeled levels distinguish cellular activity, tissue integrity, organ function, and recovery of a conscious organism.</desc><rect width="1100" height="500" fill="#f8fbfd"/><text x="60" y="68" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="34" fill="#263b4a">A recovered cell is not the same result as a recovered organism</text><rect x="90" y="130" width="220" height="250" rx="18" fill="#b9d7bb"/><text x="200" y="220" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="30" fill="#214d31">Cellular</text><text x="200" y="258" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="23" fill="#214d31">activity</text><rect x="330" y="130" width="220" height="250" rx="18" fill="#82b88c"/><text x="440" y="220" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="30" fill="#173c26">Tissue</text><text x="440" y="258" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="23" fill="#173c26">integrity</text><rect x="570" y="130" width="220" height="250" rx="18" fill="#4c9360"/><text x="680" y="220" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="30" fill="white">Organ</text><text x="680" y="258" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="23" fill="white">function</text><rect x="810" y="130" width="220" height="250" rx="18" fill="#27633d"/><text x="920" y="210" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="30" fill="white">Conscious</text><text x="920" y="248" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="30" fill="white">organism</text><text x="920" y="285" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="18" fill="white">a separate endpoint</text><text x="550" y="445" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="26" fill="#263b4a">Each level needs its own measurement. Do not slide from one level to the next.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">OrganEx experimental timeline</title><desc id="desc">The timeline shows cardiac arrest at zero hours, OrganEx perfusion beginning one hour later, and six hours of perfusion complete at seven hours after arrest.</desc><rect width="1100" height="500" fill="#f8fbfd"/><text x="60" y="66" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="33" fill="#263b4a">OrganEx pig study. Read the time point with the result.</text><line x1="150" y1="270" x2="980" y2="270" stroke="#263b4a" stroke-width="7"/><circle cx="180" cy="270" r="21" fill="#b34d4d"/><circle cx="410" cy="270" r="21" fill="#e39d3d"/><circle cx="910" cy="270" r="21" fill="#4c9360"/><text x="180" y="205" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="28" fill="#263b4a">0 h</text><text x="180" y="345" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="25" fill="#263b4a">Arrest</text><text x="410" y="205" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="28" fill="#263b4a">1 h</text><text x="410" y="345" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="25" fill="#263b4a">Perfusion starts</text><text x="910" y="205" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="28" fill="#263b4a">7 h</text><text x="910" y="345" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="25" fill="#263b4a">6 h perfused</text><text x="550" y="445" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="21" fill="#263b4a">Measured cell and tissue outcomes, not recovery of a conscious animal.</text></svg>

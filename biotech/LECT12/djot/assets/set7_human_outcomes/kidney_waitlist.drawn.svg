<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">U.S. transplant wait-list counts by organ in 2024</title><desc id="desc">A horizontal bar chart shows 147091 kidney candidates, 25538 liver candidates, 9444 heart candidates and 4775 lung candidates.</desc><rect width="1100" height="500" fill="#f8fbfd"/><text x="55" y="62" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="32" fill="#263b4a">U.S. waiting-list counts by organ in 2024</text><text x="55" y="97" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="21" fill="#263b4a">Includes active and inactive patients listed during 2024.</text><text x="55" y="124" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="21" fill="#263b4a">Multiple-center listings can count more than once.</text><text x="80" y="190" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="27" fill="#263b4a">Kidney</text><rect x="230" y="160" width="720" height="42" fill="#275a88"/><text x="965" y="191" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="25" fill="#263b4a">147,091</text><text x="80" y="263" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="27" fill="#263b4a">Liver</text><rect x="230" y="233" width="125" height="42" fill="#4c83ae"/><text x="370" y="264" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="25" fill="#263b4a">25,538</text><text x="80" y="336" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="27" fill="#263b4a">Heart</text><rect x="230" y="306" width="46" height="42" fill="#79a6c9"/><text x="291" y="337" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="25" fill="#263b4a">9,444</text><text x="80" y="409" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="27" fill="#263b4a">Lung</text><rect x="230" y="379" width="23" height="42" fill="#b4cadb"/><text x="268" y="410" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="25" fill="#263b4a">4,775</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">Handwriting BCI speed compared with smartphone typing</title><desc id="desc">A bar chart compares 90 characters per minute for the one-participant handwriting brain computer interface with 115 characters per minute for typical smartphone typing in the participant's age group, as cited in the paper.</desc><rect width="1100" height="500" fill="#f8fbfd"/><text x="60" y="65" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="33" fill="#263b4a">Attempted handwriting BCI, one participant</text><text x="60" y="105" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="23" fill="#263b4a">Typing speed in characters per minute</text><line x1="410" y1="395" x2="1015" y2="395" stroke="#263b4a" stroke-width="3"/><text x="60" y="205" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="25" fill="#263b4a">Handwriting BCI</text><rect x="410" y="170" width="470" height="58" fill="#275a88"/><text x="895" y="211" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="29" fill="#263b4a">90</text><text x="60" y="304" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="25" fill="#263b4a">Smartphone typing</text><text x="60" y="331" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="18" fill="#263b4a">same age group</text><rect x="410" y="269" width="600" height="58" fill="#79a6c9"/><text x="1025" y="310" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="29" fill="#263b4a">115</text><text x="550" y="455" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="22" fill="#263b4a">94.1% raw online accuracy. One study participant.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">A ladder from a device signal to a claim about thought</title><desc id="desc">The diagram distinguishes detecting a neural signal, decoding a specific intended movement, and knowing all private thought.</desc><rect width="1100" height="500" fill="#f8fbfd"/><text x="60" y="68" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="34" fill="#263b4a">What does a brain-computer-interface result establish?</text><rect x="90" y="320" width="290" height="92" rx="15" fill="#79a6c9"/><text x="235" y="360" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="28" fill="#102b3d">Neural signal</text><text x="235" y="393" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="20" fill="#102b3d">recorded</text><rect x="410" y="220" width="290" height="92" rx="15" fill="#4c83ae"/><text x="555" y="260" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="28" fill="white">Specific task</text><text x="555" y="293" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="20" fill="white">decoded and tested</text><rect x="730" y="120" width="290" height="92" rx="15" fill="#275a88"/><text x="875" y="160" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="28" fill="white">All thought</text><text x="875" y="193" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="20" fill="white">not established</text><path d="M380 330 L410 285 M700 230 L730 185" stroke="#263b4a" stroke-width="8" fill="none"/><text x="550" y="462" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="26" fill="#263b4a">A successful task is evidence for that task. Read the endpoint before enlarging the claim.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Somatic and heritable changes follow different lineages</title><desc id="desc">A somatic change is limited to cells of one patient. A heritable change can be present in descendants.</desc><rect width="1000" height="470" fill="#f8fafb"/>
<g font-family="Atkinson Hyperlegible Next, sans-serif" fill="#344651" text-anchor="middle">
<text x="500" y="43" font-size="31">A change can stay in one body or enter a lineage</text><text x="245" y="94" font-size="28">somatic cells</text><text x="754" y="94" font-size="28">heritable cells</text>
<path d="M245 132 V185 M245 185 H105 M245 185 H385 M105 185 V246 M385 185 V246 M245 185 V246" fill="none" stroke="#71828C" stroke-width="5"/>
<circle cx="105" cy="276" r="38" fill="#C3E0F1" stroke="#344651" stroke-width="3"/><circle cx="245" cy="276" r="38" fill="#694079" stroke="#344651" stroke-width="3"/><circle cx="385" cy="276" r="38" fill="#C3E0F1" stroke="#344651" stroke-width="3"/><text x="245" y="283" fill="white" font-size="23">change</text>
<path d="M105 316 V349 M245 316 V349 M385 316 V349" stroke="#71828C" stroke-width="4"/><text x="105" y="385" font-size="21">one tissue</text><text x="245" y="385" font-size="21">one tissue</text><text x="385" y="385" font-size="21">one tissue</text><text x="245" y="432" font-size="24">follow-up centers on one patient</text>
<path d="M754 132 V176 M754 176 H640 M754 176 H868 M640 176 V236 M868 176 V236" fill="none" stroke="#71828C" stroke-width="5"/><circle cx="640" cy="266" r="42" fill="#FFD47C" stroke="#344651" stroke-width="3"/><circle cx="868" cy="266" r="42" fill="#FFD47C" stroke="#344651" stroke-width="3"/><text x="640" y="274" font-size="22">child</text><text x="868" y="274" font-size="22">child</text>
<path d="M640 308 V351 M868 308 V351" stroke="#71828C" stroke-width="5"/><circle cx="640" cy="383" r="30" fill="#FFD47C" stroke="#344651" stroke-width="3"/><circle cx="868" cy="383" r="30" fill="#FFD47C" stroke="#344651" stroke-width="3"/><text x="754" y="432" font-size="24">effects can reach descendants</text><path d="M705 119 H800" stroke="#694079" stroke-width="10" stroke-linecap="round"/><text x="753" y="150" font-size="19">lineage-wide change</text>
</g></svg>

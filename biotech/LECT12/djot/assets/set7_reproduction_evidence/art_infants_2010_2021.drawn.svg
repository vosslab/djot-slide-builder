<svg xmlns="http://www.w3.org/2000/svg" width="863" height="446" viewBox="84 9 863 446"><title>U.S. ART infants born from 2010 through 2021</title><desc>Line chart of CDC national ART counts, with a decline during 2020 and increase in 2021.</desc><g font-family="Arial" fill="#344651"><text x="500" y="42" text-anchor="middle" font-size="31">U.S. infants born after assisted reproductive technology</text><text x="92" y="85" font-size="19">100,000</text><text x="105" y="170" font-size="19">80,000</text><text x="105" y="255" font-size="19">60,000</text><line x1="165" y1="75" x2="920" y2="75" stroke="#bcc8cf"/><line x1="165" y1="160" x2="920" y2="160" stroke="#bcc8cf"/><line x1="165" y1="245" x2="920" y2="245" stroke="#bcc8cf"/><line x1="165" y1="330" x2="920" y2="330" stroke="#344651" stroke-width="3"/><polyline fill="none" stroke="#275a88" stroke-width="6" points="170,238 238,238 306,223 374,211 442,207 510,197 578,173 646,168 714,153 782,143 850,160 918,87"/><g fill="#275a88"><circle cx="170" cy="238" r="7"/><circle cx="238" cy="238" r="7"/><circle cx="306" cy="223" r="7"/><circle cx="374" cy="211" r="7"/><circle cx="442" cy="207" r="7"/><circle cx="510" cy="197" r="7"/><circle cx="578" cy="173" r="7"/><circle cx="646" cy="168" r="7"/><circle cx="714" cy="153" r="7"/><circle cx="782" cy="143" r="7"/><circle cx="850" cy="160" r="7"/><circle cx="918" cy="87" r="7"/></g><g font-size="20" text-anchor="middle"><text x="170" y="360">2010</text><text x="374" y="360">2013</text><text x="578" y="360">2016</text><text x="782" y="360">2019</text><text x="850" y="385">2020</text><text x="918" y="360">2021</text></g><text x="175" y="220" font-size="21">61,556</text><text x="918" y="70" font-size="21" text-anchor="end">97,128</text><text x="500" y="440" text-anchor="middle" font-size="20">Year the treatment cycle started</text></g></svg>

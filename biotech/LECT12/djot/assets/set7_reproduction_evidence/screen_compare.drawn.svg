<circle cx="271" cy="267" r="77" fill="#FFD47C" stroke="#344651" stroke-width="3"/><circle cx="271" cy="267" r="42" fill="#C3E0F1" stroke="#344651" stroke-width="3"/>
<path d="M234 216 Q272 177 309 216 M209 290 Q270 344 332 292" fill="none" stroke="#247257" stroke-width="12" stroke-linecap="round"/>
<path d="M347 174 C432 143 507 167 530 223 C548 268 532 322 493 349 C460 372 408 351 384 315 C361 279 370 223 402 196" fill="#C3E0F1" stroke="#344651" stroke-width="3"/><path d="M385 266 C421 231 472 227 506 255" fill="none" stroke="#694079" stroke-width="8"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Two prenatal samples answer different questions</title><desc id="desc">A pregnant person's blood contains mostly their own cell-free DNA and some placental fragments. An amniotic-fluid sample contains fetal cells.</desc>

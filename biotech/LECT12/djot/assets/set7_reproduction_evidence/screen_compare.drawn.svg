<path d="M90 100 C42 120 42 380 90 400" fill="none" stroke="#C74450" stroke-width="20" stroke-linecap="round"/><path d="M90 100 C139 130 129 191 161 201 M90 400 C135 369 131 324 164 318" fill="none" stroke="#C74450" stroke-width="8"/><text x="90" y="77" text-anchor="middle" font-size="23">blood</text>
<g fill="#694079"><path d="M106 150 l20 -8 l19 12 l-20 8z"/><path d="M116 245 l20 -8 l19 12 l-20 8z"/><path d="M101 330 l20 -8 l19 12 l-20 8z"/></g><g fill="#247257"><path d="M170 166 l20 -8 l19 12 l-20 8z"/><path d="M157 345 l20 -8 l19 12 l-20 8z"/></g>
<path d="M536 219 C653 195 680 163 788 159" fill="none" stroke="#247257" stroke-width="5" stroke-dasharray="10 9"/><path d="M483 337 C644 383 714 367 793 331" fill="none" stroke="#275A88" stroke-width="5" stroke-dasharray="10 9"/>

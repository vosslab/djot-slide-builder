<svg xmlns="http://www.w3.org/2000/svg" width="904" height="420" viewBox="48 10 904 420" role="img" aria-labelledby="title desc">
<title id="title">A personal report and a small hypothetical comparison</title><desc id="desc">One person reports feeling better. A fictional comparison has four people in each group and shows three of four versus one of four improved. The fictional counts illustrate why comparison matters.</desc><g font-family="Atkinson Hyperlegible Next, sans-serif" fill="#344651" text-anchor="middle"><text x="500" y="43" font-size="31">One report can begin a question</text>
<rect x="60" y="83" width="235" height="335" rx="20" fill="#FFF5D8" stroke="#344651" stroke-width="3"/><text x="177" y="125" font-size="28">one report</text><circle cx="177" cy="205" r="42" fill="#FFD47C" stroke="#344651" stroke-width="3"/><circle cx="163" cy="195" r="8"/><circle cx="191" cy="195" r="8"/><path d="M154 221 Q177 241 200 221" fill="none" stroke="#247257" stroke-width="6" stroke-linecap="round"/><text x="177" y="285" font-size="23">“I feel better.”</text><text x="177" y="330" font-size="21">one outcome</text><text x="177" y="360" font-size="21">no comparison</text>
<rect x="335" y="83" width="605" height="335" rx="20" fill="#E8F2F4" stroke="#344651" stroke-width="3"/><text x="637" y="125" font-size="28">fictional comparison</text><text x="520" y="168" font-size="22">comparison group</text><text x="776" y="168" font-size="22">new treatment group</text>
<g stroke="#344651" stroke-width="3"><circle cx="450" cy="215" r="24" fill="#C3E0F1"/><circle cx="500" cy="215" r="24" fill="#C3E0F1"/><circle cx="550" cy="215" r="24" fill="#C3E0F1"/><circle cx="600" cy="215" r="24" fill="#247257"/><circle cx="706" cy="215" r="24" fill="#247257"/><circle cx="756" cy="215" r="24" fill="#247257"/><circle cx="806" cy="215" r="24" fill="#247257"/><circle cx="856" cy="215" r="24" fill="#C3E0F1"/></g>
<text x="520" y="284" font-size="25">1 of 4 improved</text><text x="776" y="284" font-size="25">3 of 4 improved</text><circle cx="506" cy="326" r="11" fill="#247257"/><text x="528" y="334" text-anchor="start" font-size="20">improved</text><circle cx="656" cy="326" r="11" fill="#C3E0F1" stroke="#344651" stroke-width="2"/><text x="678" y="334" text-anchor="start" font-size="20">did not improve</text><text x="637" y="383" font-size="20">Fictional counts for practice, not a clinical result.</text>
</g></svg>

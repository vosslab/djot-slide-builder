<svg xmlns="http://www.w3.org/2000/svg" width="831" height="422" viewBox="158 20 831 422"><title>Two sources of pluripotent cells</title><desc>Comparison of embryonic stem cell and induced pluripotent stem cell sources.</desc><text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="34" fill="#344651">Two routes to pluripotent cells</text><g font-family="Arial" fill="#344651" text-anchor="middle"><circle cx="245" cy="180" r="75" fill="#ffd47c" stroke="#344651" stroke-width="3"/><text x="245" y="173" font-size="27">Early</text><text x="245" y="207" font-size="27">embryo</text><path d="M340 180h130" stroke="#344651" stroke-width="4"/><rect x="500" y="128" width="175" height="104" rx="18" fill="#c3e0f1" stroke="#344651" stroke-width="3"/><text x="587" y="175" font-size="25">embryonic stem</text><text x="587" y="207" font-size="25">cell line</text><circle cx="245" cy="355" r="75" fill="#d6ebdd" stroke="#344651" stroke-width="3"/><text x="245" y="348" font-size="27">Adult</text><text x="245" y="382" font-size="27">cell</text><path d="M340 355h130" stroke="#344651" stroke-width="4"/><rect x="500" y="303" width="175" height="104" rx="18" fill="#eadbef" stroke="#344651" stroke-width="3"/><text x="587" y="350" font-size="25">induced pluripotent</text><text x="587" y="382" font-size="25">stem cell line</text><path d="M695 180h105M695 355h105" stroke="#344651" stroke-width="4"/><text x="865" y="250" font-size="26">Cells tested for</text><text x="865" y="283" font-size="26">identity and function</text></g></svg>

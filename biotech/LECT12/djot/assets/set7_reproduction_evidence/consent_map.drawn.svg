<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><title>Questions before using a biological sample</title><desc>A visual checklist connects sample collection, consent, data access, and benefit sharing.</desc><rect width="1000" height="470" fill="#f8fafb"/><text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="34" fill="#344651">Before a biological sample becomes research data</text><g font-family="Arial" fill="#344651" text-anchor="middle"><rect x="60" y="160" width="185" height="130" rx="18" fill="#c3e0f1" stroke="#344651" stroke-width="3"/><text x="153" y="215" font-size="28">Sample</text><text x="153" y="250" font-size="24">collection</text><rect x="295" y="160" width="185" height="130" rx="18" fill="#ffd47c" stroke="#344651" stroke-width="3"/><text x="388" y="215" font-size="28">Permission</text><text x="388" y="250" font-size="24">and purpose</text><rect x="530" y="160" width="185" height="130" rx="18" fill="#d6ebdd" stroke="#344651" stroke-width="3"/><text x="623" y="215" font-size="28">Data</text><text x="623" y="250" font-size="24">access</text><rect x="765" y="160" width="185" height="130" rx="18" fill="#eadbef" stroke="#344651" stroke-width="3"/><text x="858" y="215" font-size="28">Benefits</text><text x="858" y="250" font-size="24">and credit</text></g><g stroke="#344651" stroke-width="4" fill="none"><path d="M245 225h40m195 0h40m195 0h40"/></g><text x="500" y="350" text-anchor="middle" font-family="Arial" font-size="27" fill="#344651">Who decides each step, and who bears its consequences?</text></svg>

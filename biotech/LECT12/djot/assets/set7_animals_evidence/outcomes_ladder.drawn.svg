<svg xmlns="http://www.w3.org/2000/svg" width="977" height="518" viewBox="16 20 977 518" role="img" aria-labelledby="title desc"><title id="title">Possible outcome measures for a Lyme disease project</title><desc id="desc">A tick icon, a walking person icon, and a clinic survey clipboard are labeled as distinct measurable outcomes: infected ticks, human exposure, and reported disease.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#344651"/></marker></defs><g font-family="Atkinson Hyperlegible Next, sans-serif" fill="#344651"><text x="500" y="58" font-size="38" text-anchor="middle">Which outcome would answer the community's question?</text><text x="500" y="96" font-size="25" text-anchor="middle">Each measurement asks about a different part of the problem.</text></g><g stroke="#344651" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M320 270h100"/><path d="M650 270h100"/></g><g stroke="#344651" stroke-width="4" fill="#C3E0F1"><ellipse cx="200" cy="264" rx="38" ry="52"/><circle cx="200" cy="200" r="18"/><path d="M168 237l-42-28m42 54l-49 10m113-36l42-28m-42 54l49 10" fill="none" stroke="#344651" stroke-linecap="round"/><circle cx="535" cy="190" r="28"/><path d="M535 220l-18 91m18-54l46 31m-46 10l-37 54m37-54l33 51" fill="none" stroke="#344651" stroke-linecap="round"/><rect x="805" y="175" width="100" height="150" rx="10"/><path d="M830 220h50m-50 37h50m-50 37h50"/></g><g font-family="Atkinson Hyperlegible Next, sans-serif" fill="#344651" text-anchor="middle"><text x="200" y="395" font-size="31">infected ticks</text><text x="535" y="395" font-size="31">human exposure</text><text x="855" y="395" font-size="31">reported cases</text><text x="200" y="430" font-size="22">sample and test ticks</text><text x="535" y="430" font-size="22">ask about bites or activity</text><text x="855" y="430" font-size="20">use defined surveillance data</text><text x="500" y="490" font-size="25">A change in one measure does not automatically</text><text x="500" y="523" font-size="25">establish a change in the next.</text></g></svg>

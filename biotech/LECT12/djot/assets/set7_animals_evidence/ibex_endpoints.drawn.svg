<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">What the Pyrenean ibex result established</title>
  <desc id="desc">An ibex silhouette represents one cloned animal born alive. Three distinct outlined endpoints—survival to maturity, reproduction across years, and a self-sustaining habitat population—are crossed out as outcomes not established by that birth.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#344651"/></marker></defs>
  <g font-family="Atkinson Hyperlegible Next, sans-serif" fill="#344651" text-anchor="middle"><text x="500" y="58" font-size="38">What did the Pyrenean ibex result establish?</text><text x="500" y="96" font-size="25">One cloned animal was born alive, then died soon after birth.</text></g>
  <g fill="#E7A20B" stroke="#344651" stroke-width="4"><path d="M94 326h39c14-58 53-71 91-37l55-32 25 24-52 46-9 100h-26l-11-58-21 58h-27l11-74c-25 20-50 21-75 13z"/><path d="M132 292c-32-27-23-75-1-91m22 80c-18-34-3-68 19-78" fill="none" stroke-linecap="round"/></g>
  <g font-family="Atkinson Hyperlegible Next, sans-serif" fill="#344651" text-anchor="middle"><text x="190" y="468" font-size="30">1 live birth</text><text x="190" y="501" font-size="24">not a breeding population</text></g>
  <g stroke="#344651" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M350 325h60"/><path d="M585 325h60"/></g>
  <g fill="white" stroke="#344651" stroke-width="3"><rect x="415" y="270" width="145" height="115" rx="18"/><rect x="650" y="270" width="145" height="115" rx="18"/><rect x="830" y="270" width="145" height="115" rx="18"/></g>
  <g font-family="Atkinson Hyperlegible Next, sans-serif" fill="#344651" text-anchor="middle"><text x="487" y="313" font-size="25">survive</text><text x="487" y="347" font-size="21">to maturity</text><text x="722" y="313" font-size="23">reproduce</text><text x="722" y="347" font-size="21">across years</text><text x="902" y="313" font-size="21">habitat</text><text x="902" y="347" font-size="19">can support them</text></g>
  <text x="660" y="465" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="28" fill="#344651" text-anchor="middle">These were not outcomes of the 2009 birth.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="889" height="504" viewBox="53 26 889 504" role="img" aria-labelledby="title desc">
  <title id="title">Dolly cloning study stages</title>
  <desc id="desc">Four equally sized panels show 277 reconstructed embryos, 29 embryos transferred, 13 surrogate ewes, and one live lamb. The panels intentionally use equal area because the numbers measure different units.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#344651"/></marker></defs>
  <g font-family="Atkinson Hyperlegible Next, sans-serif" fill="#344651" text-anchor="middle"><text x="500" y="64" font-size="39">Dolly study stages</text><text x="500" y="104" font-size="25">Each number describes a different stage of the experiment.</text></g>
  <g fill="white" stroke="#344651" stroke-width="3"><rect x="65" y="170" width="190" height="235" rx="24"/><rect x="290" y="170" width="190" height="235" rx="24"/><rect x="515" y="170" width="190" height="235" rx="24"/><rect x="740" y="170" width="190" height="235" rx="24"/></g>
  <g stroke="#344651" stroke-width="5" marker-end="url(#arrow)"><path d="M260 288h25"/><path d="M485 288h25"/><path d="M710 288h25"/></g>
  <g font-family="Atkinson Hyperlegible Next, sans-serif" fill="#344651" text-anchor="middle"><text x="160" y="220" font-size="32">277</text><text x="385" y="220" font-size="32">29</text><text x="610" y="220" font-size="32">13</text><text x="835" y="220" font-size="32">1</text><text x="160" y="365" font-size="26">reconstructed</text><text x="160" y="394" font-size="26">embryos</text><text x="385" y="365" font-size="26">embryos</text><text x="385" y="394" font-size="26">transferred</text><text x="610" y="365" font-size="26">surrogate ewes</text><text x="835" y="365" font-size="26">live lamb</text></g>
  <g fill="#C3E0F1" stroke="#275A88" stroke-width="4"><circle cx="145" cy="280" r="14"/><circle cx="175" cy="280" r="14"/><circle cx="160" cy="305" r="14"/><circle cx="385" cy="290" r="38"/><ellipse cx="600" cy="292" rx="42" ry="30"/><circle cx="646" cy="275" r="18"/><ellipse cx="825" cy="298" rx="30" ry="22"/><circle cx="858" cy="286" r="13"/></g>
  <g stroke="#275A88" stroke-width="4" fill="none" stroke-linecap="round"><path d="M620 315v25m12-25v25m-1-79 11-11m3 17 15-2"/><path d="M843 317v20m10-20v20m-1-61 8-8"/></g>
  <g font-family="Atkinson Hyperlegible Next, sans-serif" font-size="25" fill="#344651" text-anchor="middle"><text x="500" y="482">The unit changes: reconstructed embryos → transfers</text><text x="500" y="515">→ surrogate ewes → live births.</text></g>
</svg>

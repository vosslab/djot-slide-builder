<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Information transferred among DNA and synthetic XNA polymers</title>
  <desc id="desc">A schematic shows the same short base sequence on DNA, a synthetic XNA backbone, and DNA again. Arrows label tested information transfer from DNA to XNA and XNA to DNA. A dashed cell outline distinguishes the untested claim that the system was living.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#344651"/></marker></defs>
  <g font-family="Atkinson Hyperlegible Next, sans-serif" fill="#344651" text-anchor="middle">
    <text x="500" y="58" font-size="38">A message can move between different backbones</text>
    <text x="500" y="96" font-size="25">The experiment tested information transfer, not an independent living cell.</text>
  </g>
  <g fill="#C3E0F1" stroke="#344651" stroke-width="3"><rect x="45" y="180" width="250" height="150" rx="25"/><rect x="705" y="180" width="250" height="150" rx="25"/></g>
  <rect x="375" y="180" width="250" height="150" rx="25" fill="#F5EAF7" stroke="#344651" stroke-width="3"/>
  <g stroke="#344651" stroke-width="5" marker-end="url(#arrow)"><path d="M300 255h65"/><path d="M635 255h60"/></g>
  <g font-family="Atkinson Hyperlegible Next, sans-serif" fill="#344651" text-anchor="middle">
    <text x="170" y="218" font-size="30">DNA</text><text x="500" y="218" font-size="30">synthetic XNA</text><text x="830" y="218" font-size="30">DNA</text>
    <text x="335" y="365" font-size="21">copy to XNA</text><text x="665" y="365" font-size="21">copy to DNA</text>
  </g>
  <g font-family="Atkinson Hyperlegible Mono, monospace" font-size="32" text-anchor="middle" fill="#344651"><text x="170" y="290">A C T G A</text><text x="500" y="290">A C T G A</text><text x="830" y="290">A C T G A</text></g>
  <g font-family="Atkinson Hyperlegible Next, sans-serif" fill="#344651"><rect x="160" y="420" width="680" height="74" rx="37" fill="white" stroke="#694079" stroke-width="4" stroke-dasharray="12 8"/><text x="500" y="467" font-size="30" text-anchor="middle">A self-maintaining cell was not part of this result.</text></g>
</svg>

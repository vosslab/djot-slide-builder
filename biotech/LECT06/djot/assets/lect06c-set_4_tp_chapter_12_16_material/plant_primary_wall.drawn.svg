<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="wall-title wall-desc">
	<title id="wall-title">Plant primary cell wall cutaway</title>
	<desc id="wall-desc">Middle lamella above the primary cell wall and plasma membrane. Green cellulose microfibrils cross in several directions; red cross-linking glycans contact and bridge the rods; blue pectin strands interweave throughout the matrix and middle lamella. A source-retained 50 nm bar indicates molecular scale; the open layer spacing is schematic.</desc>
	<metadata id="provenance">Original vector reconstruction of the illustrative content in Figure 19-71. Molecular Biology of the Cell, 4th Edition. Course source: biotech/LECT06/djot/assets/lect06c-set_4_tp_chapter_12_16_material/image_022.jpg; SHA256 78e1088a662716d1a658e5b0807ac01ac872bac74cbe550babb8c1444a18e1c3. Exact original ODP media: slide 25, Pictures/10000000000002CC00000201BC584610.jpg. Molecular rods, networks and open layer separation are schematic. Scale bar length 238 drawing units; fibril diameters 22-26 units preserve the source's approximate bar-to-rod ratio. No wall-thickness dimension is implied.</metadata>

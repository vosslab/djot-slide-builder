<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-labelledby="wells-title wells-desc">
<title id="wells-title">Bioremediation wells and microbial uranium transformations</title>
<desc id="wells-desc">Schematic, not to scale. Injection flows down the right well; extraction rises in the left well and groundwater flows left. Two sampled subsurface locations connect to a bacterium reducing U(VI) to U(IV) while organic carbon becomes carbon dioxide, and an exposed versus coated U(IV) comparison. Oxygen, nitrate and iron relationships surround exposed U(IV). Low permeability coatings stop incoming arrows outside the protected U(IV) core. Particle counts are illustrative.</desc>

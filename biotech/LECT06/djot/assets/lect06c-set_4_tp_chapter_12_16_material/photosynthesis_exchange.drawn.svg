<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Light reactions and the Calvin cycle</title><desc id="desc">Chloroplast cutaway with one focal and three contextual thylakoid stacks. Light and water enter light reactions; oxygen exits. ATP and NADPH travel to the Calvin cycle; NADP+ and ADP plus inorganic phosphate return. Carbon dioxide enters the directed Calvin cycle and [CH2O] sugar exits. Schematic, not to scale.</desc><metadata>Original vector reconstruction of the schematic relationships in
Pearson Education 2008, Fig. 10-5-4 / Figure 10.5. Evidence: original ODP slide 44,
Pictures/100000000000057A00000433B6056CB0.jpg; original JPEG SHA256
5705b7e0c3682d1b9375c02eb5e5fbe6f41db2579e8822facb48ada5f12090c7.
Illustrative cutaway and disc counts, not measured anatomy.</metadata>

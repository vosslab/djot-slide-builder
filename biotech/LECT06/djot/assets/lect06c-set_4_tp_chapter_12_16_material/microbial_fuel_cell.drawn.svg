<title id="title">Microbial fuel cell</title><desc id="desc">Original cutaway schematic preserving source image_013.png and original ODP slide 13. Glucose enters microorganisms. Electrons move to the anode and through the external Load to the cathode; oxygen enters and water leaves the cathode. Microorganisms release carbon dioxide and protons, and the proton route crosses the membrane toward the cathode. Generic curved bacterial silhouettes are illustrative, not species identification or microscopy.</desc>
<metadata>Original editable illustration, 2026-11-10. Scientific topology and wording from the existing course raster, matched to biotech/LECT06/old/lect06c-set_4_TP-chapter_12-16_material.odp. Schematic, not measured apparatus or microscopy.</metadata>

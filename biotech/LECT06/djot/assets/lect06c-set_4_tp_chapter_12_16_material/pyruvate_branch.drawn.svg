<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Pyruvate as a branch point in catabolism</title>
  <desc id="figure-description">Glucose passes through glycolysis to pyruvate in the cytosol. The two source-conditioned branches are: no oxygen present, fermentation to ethanol or lactate outside the mitochondrion; oxygen present, aerobic cellular respiration to acetyl CoA inside the mitochondrion, then into the closed citric acid cycle. A schematic mitochondrial cutaway exposes the folded inner membrane. Membrane folds and proportions are illustrative, not measured.</desc>
  <metadata id="provenance">Original vector construction, 2026-11-10. Scientific wording retained from original ODP slide 21, biotech/LECT06/old/lect06c-set_4_TP-chapter_12-16_material.odp, Pictures/100000000000048500000438470B31DB.jpg. Fig. 9-19; Figure 9.19 Pyruvate as a key juncture in catabolism. Original media credit: Copyright &#169; 2008 Pearson Education, Inc., publishing as Pearson Benjamin Cummings. Original JPEG SHA256: 6023f46346ec584f6c69946a71a37107680a81cdb172a82978bee06b40ffb847. Current wrapper SHA256: 6a93f70a80f64392d56b945e21be006ed23b690ffbe5c6b767b80d8db6088f68. Source-conditioned oxygen simplification retained. No empirical image region. All original media retained separately.</metadata>

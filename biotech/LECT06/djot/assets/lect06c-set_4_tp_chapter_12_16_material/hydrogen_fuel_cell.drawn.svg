<title id="title">Hydrogen fuel cell</title><desc id="desc">Original cutaway schematic preserving source image_011.png and original ODP slide 12. Hydrogen enters the anode side; oxygen enters the cathode side; water exits the cathode side. The external electron path rises from the anode and descends to the cathode. Heat leaves both sides. Green hydrogen particles, teal oxygen particles and assembled water particles preserve the source convention; shapes are illustrative.</desc>
<metadata>Original editable illustration, 2026-11-10. Scientific topology and wording from the existing course raster, matched to biotech/LECT06/old/lect06c-set_4_TP-chapter_12-16_material.odp. Schematic, not measured apparatus or microscopy.</metadata>

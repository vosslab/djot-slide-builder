<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="978" viewBox="0 0 1400 978" role="img" aria-labelledby="title desc"><title id="title">Western blot: primary antibody, secondary antibody and detection</title><desc id="desc">Original schematic stages 3-5 from image_031.jpg, original ODP page 44. Red rabbit primary antibodies bind the central protein. Blue enzyme-linked goat anti-rabbit antibodies join them; the final membrane has one purple colorimetric signal. All bands are schematic.</desc><rect width="1400" height="978" fill="#FFFFFF" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 L3 5 Z" fill="#213547" /></marker></defs><text x="25" y="50.0" font-size="32" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">3. Incubate with rabbit</text><text x="25" y="89.68" font-size="32" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">antibody to the protein</text><text x="25" y="129.36" font-size="32" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">of interest</text><text x="525" y="50.0" font-size="32" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">4. Wash and incubate with</text><text x="525" y="89.68" font-size="32" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">an enzyme-linked goat</text><text x="525" y="129.36" font-size="32" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">anti-rabbit antibody</text><text x="1040" y="50.0" font-size="32" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">5. Assay the linked</text><text x="1040" y="89.68" font-size="32" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">enzyme with a</text><text x="1040" y="129.36" font-size="32" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">colorimetric reaction</text><text x="265" y="220.0" font-size="29" fill="#213547" text-a
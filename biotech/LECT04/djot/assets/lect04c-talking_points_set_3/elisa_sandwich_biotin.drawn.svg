/g><g id="colored-product" transform=""><ellipse cx="1290" cy="107" rx="7" ry="7" fill="#efd048" stroke="#8a9aa4" stroke-width="0.8" /><ellipse cx="1310" cy="109" rx="7" ry="7" fill="#efd048" stroke="#8a9aa4" stroke-width="0.8" /><ellipse cx="1294" cy="129" rx="7" ry="7" fill="#efd048" stroke="#8a9aa4" stroke-width="0.8" /><ellipse cx="1315" cy="130" rx="7" ry="7" fill="#efd048" stroke="#8a9aa4" stroke-width="0.8" /></g><g id="tmb-to-enzyme" transform=""><path d="M 1194 143 Q 1205 153 1217 153" fill="none" stroke="#cc4c44" stroke-width="4" marker-end="url(#reaction-arrow)" /></g><g id="enzyme-to-product" transform=""><path d="M 1253 146 Q 1271 141 1281 125" fill="none" stroke="#cc4c44" stroke-width="4" marker-end="url(#reaction-arrow)" /></g><g><text x="155" y="228" font-size="22" fill="#213547" text-anchor="middle" font-family="Arial, sans-serif">Capture Antibody</text></g><path d="M 155 235 L 155 266" fill="none" stroke="#526879" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><g><text x="155" y="385" font-size="22" fill="#213547" text-anchor="middle" font-family="Arial, sans-serif">Blocking Buffer</text></g><path d="M 155 363 L 155 341" fill="none" stroke="#526879" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><g><text x="425" y="190" font-size="22" fill="#213547" text-anchor="middle" font-family="Arial, sans-serif">Antigen</text></g><path d="M 425 198 L 425 225" fill="none" stroke="#526879" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><g><text x="695" y="124" font-size="21" fill="#213547" text-anchor="middle" font-family="Arial, sans-serif">Biotin Labeled</text></g><g><text x="695" y="149" font-size="21" fill="#213547" text-anchor="middle" font-family="Arial, sans-serif">Detection Antibody</text></g><g><text x="965" y="122" font-size="22" fill="#213547" text-anchor="middle" font-family="Arial, sans-serif">Avidin-HRPO</text></g><g><text x="1150" y="184" font-size="19" fill="#213547" text-anchor="middle" font-family="Arial, sans-serif">TMB Substrate</text></g><g><text x="1311" y="184" font-size="19" fill="#213547" text-anchor="middle" font-family="Arial, sans-serif">Colored Product</text></g><ellipse cx="41" cy="446" rx="17" ry="17" fill="#08699c" stroke="none" stroke-width="1.5" /><g font-weight="bold"><text x="41" y="453" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">1</text></g><g><text x="72" y="453" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">a.) Plate is coated with a suitable capture antibody. b.) Blocking buffer is added to block remaining</text></g><g><text x="72" y="485" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">protein-binding sites on plate.</text></g><ellipse cx="41" cy="543" rx="17" ry="17" fill="#08699c" stroke="none" stroke-width="1.5" /><g font-weight="bold"><text x="41" y="550" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">2</text></g><g><text x="72" y="550" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">Sample is added to plate and any antigen present is bound by the capture antibody.</text></g><ellipse cx="41" cy="613" rx="17" ry="17" fill="#08699c" stroke="none" stroke-width="1.5" /><g font-weight="bold"><text x="41" y="620" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">3</text></g><g><text x="72" y="620" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">A suitable biotin labeled detection antibody is added to the plate and also binds to any antigen present in</text></g><g><text x="72" y="652" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">well.</text></g><ellipse cx="41" cy="710" rx="17" ry="17" fill="#08699c" stroke="none" stroke-width="1.5" /><g font-weight="bold"><text x="41" y="717" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">4</text></g><g><text x="72" y="717" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">UltraAvidin&#8482;-HRPO <tspan font-style="italic">(Leinco Prod. No. A106)</tspan> is added and binds the biotin labeled detection antibody.</text></g><ellipse cx="41" cy="807" rx="17" ry="17" fill="#08699c" stroke="none" stroke-width="1.5" /><g font-weight="bold"><text x="41" y="814" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">5</text></g><g><text x="72" y="814" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">TMB substrate <tspan font-style="italic">(Leinco Prod. No. T118)</tspan> is added and converted by HRPO to a detectable form.</text></g><g><text x="35" y="884" font-size="21" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">Diagram 1: Illustration of Sandwich ELISA method.</text></g></svg>
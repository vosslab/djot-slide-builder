<title id="title">Recombinant insulin production: stage 1</title>
<desc id="desc">A human insulin gene is inserted into an open loop of bacterial DNA. Original schematic illustration, not to scale. Live labels retain the source wording. Cell parts and equipment construction are simplified; insulin shapes do not encode a measured molecular structure.</desc>

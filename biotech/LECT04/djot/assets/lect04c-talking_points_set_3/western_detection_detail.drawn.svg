<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="732.743363" viewBox="0 0 1200 732.743363" role="img" aria-labelledby="wd-title wd-desc">
  <title id="wd-title">Detection in Western Blots</title>
  <desc id="wd-desc">Original schematic reconstruction of Biotechnology LECT04 original page 45, image_032.png. A transferred green target protein rests on the membrane. A red primary antibody binds the target through a Fab tip. A blue secondary antibody binds the primary and carries an attached red enzyme. Two red arrows show gray enzyme substrate approaching the enzyme and yellow detection signal leaving it. Unmeasured symbolic molecular forms; no empirical data.</desc>

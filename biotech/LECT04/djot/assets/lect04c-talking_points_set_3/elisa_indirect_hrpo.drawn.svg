<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="775" viewBox="0 0 1200 775" role="img" aria-labelledby="title desc"><title id="title">Indirect ELISA</title><desc id="desc">Original editable schematic after the complete source illustration in Biotechnology LECT04. Molecule shapes, occupancy and depth are explanatory, not measured. Source wording and roles are preserved.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#213547" stroke-width="1.5" /></marker><marker id="reaction-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#cc4c44" /></marker></defs><rect width="1200" height="775" fill="white" /><g font-weight="bold"><text x="35" y="49" font-size="37" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">Indirect ELISA</text></g><ellipse cx="48" cy="129" rx="17" ry="17" fill="#08699c" stroke="none" stroke-width="1.5" /><g font-weight="bold"><text x="48" y="136" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">1</text></g><g><text x="78" y="136" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">Antigen/sample is added to plate.</text></g><ellipse cx="48" cy="213" rx="17" ry="17" fill="#08699c" stroke="none" stroke-width="1.5" /><g font-weight="bold"><text x="48" y="220" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">2</text></g><g><text x="78" y="220" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">Blocking buffer is added to block remaining</text></g><g><text x="78" y="252" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">protein-binding sites.</text></g><ellipse cx="48" cy="328" rx="17" ry="17" fill="#08699c" stroke="none" stroke-width="1.5" /><g font-weight="bold"><text x="48" y="335" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">3</text></g><g><text x="78" y="335" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">Next a suitable <tspan font-weight="bold" font-style="italic">primary antibody</tspan> is added.</text></g><ellipse cx="48" cy="413" rx="17" ry="17" fill="#08699c" stroke="none" stroke-width="1.5" /><g font-weight="bold"><text x="48" y="420" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">4</text></g><g><text x="78" y="420" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">A suitable <tspan font-weight="bold" font-style="italic">secondary antibody - HRPO</tspan></text></g><g><text x="78" y="452" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif"><tspan font-weight="bold" font-style="italic">conjugate</tspan> is then added which recognizes</text></g><g><text x="78" y="484" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">and binds to the <tspan font-weight="bold" font-style="italic">primary antibody</tspan>.</text></g><ellipse cx="48" cy="563" rx="17" ry="17" fill="#08699c" stroke="none" stroke-width="1.5" /><g font-weight="bold"><text x="48" y="570" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">5</text></g><g><text x="78" y="570" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">TMB substrate <tspan font-style="italic">(Leinco Prod. No. T118)</tspan> is</text></g><g><text x="78" y="602" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">added and is converted by HRPO to</text></g><g><text x="78" y="634" font-size="24" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">detectable form.</text></g><g id="indirect-cutaway" transform="translate(900 620)"><ellipse cx="0" cy="-150" rx="185.0" ry="23" fill="#eef7fb" stroke="#8baabd" stroke-width="1.5" /><path d="M -185.0 -150 L -176.0 -32 Q -169.0 12 0 14 Q 169.0 12 176.0 -32 L 185.0 -150 L 175.0 -150 L 166.0 -35 Q 158.0 -3 0 -1 Q -158.0 -3 -166.0 -35 L -175.0 -150 Z" fill="#b9d3e0" stroke="#526879" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M -174.0 -147 Q 0 -173 174.0 -147 L 165.0 -36 Q 159.0 -7 0 -8 Q -159.0 -7 -165.0 -36 Z" fill="#dff2fa" stroke="#8bb7c9" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" /><path d="M -162.0 -39 Q 0 -17 162.0 -39 L 158.0 -22 Q 0 9 -158.0 -22 Z" fill="#ecc3ce" stroke="#ce8299" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><path d="M -175.0 -149 L -166.0 -35 Q -158.0 -3 0 -1 Q 158.0 -3 166.0 -35 L 175.0 -149" fill="none" stroke="#213547" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /></g><g id="immobilized-antigen" transform="translate(877 580) scale(1.2)"><path d="M -28 0 C -36 -8 -22 -17 -16 -14 C -20 -28 -2 -29 4 -20 C 15 -29 27 -19 24 -9 C 40 -8 34 8 23 10 C 24 25 8 28 0 20 C -13 28 -26 16 -22 11 C -35 14 -39 3 -28 0 Z" fill="#6eaa62" stroke="#213547" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M -18 -8 Q -7 -19 2 -12 M 8 12 Q 20 15 22 3" fill="none" stroke="#d5eccf" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /></g><g id="primary-antibody" transform="translate(886 462) rotate(180) scale(1.4)"><path d="M -5 0 L -5 -30 L -29 -62 L -20 -69 L 0 -42 L 20 -69 L 29 -62 L 5 -30 L 5 0 Z" fill="#bf3455" stroke="#213547" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M 0 -3 L 0 -32 M -23 -64 L -2 -36 M 23 -64 L 2 -36" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /></g><g id="secondary-antibody" transform="translate(920 365) rotate(180) scale(1.4)"><path d="M -5 0 L -5 -30 L -29 -62 L -20 -69 L 0 -42 L 20 -69 L 29 -62 L 5 -30 L 5 0 Z" fill="#1683b4" stroke="#213547" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M 0 -3 L 0 -32 M -23 -64 L -2 -36 M 23 -64 L 2 -36" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /></g><g id="hrpo" transform=""><ellipse cx="920" cy="343" rx="23" ry="23" fill="#b81b65" stroke="#213547" stroke-width="1.5" /><path d="M 908.5 336.1 Q 916.55 324.6 926.9 331.5" fill="none" stroke="#f6c9df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /></g><g id="tmb" transform=""><ellipse cx="747" cy="238" rx="7" ry="7" fill="#d1d6d9" stroke="#8a9aa4" stroke-width="0.8" /><ellipse cx="767" cy="240" rx="7" ry="7" fill="#d1d6d9" stroke="#8a9aa4" stroke-width="0.8" /><ellipse cx="751" cy="260" rx="7" ry="7" fill="#d1d6d9" stroke="#8a9aa4" stroke-width="0.8" /><ellipse cx="772" cy="261" rx="7" ry="7" fill="#d1d6d9" stroke="#8a9aa4" stroke-width="0.8" /></g><g id="product" transform=""><ellipse cx="996" cy="186" rx="7" ry="7" fill="#efd048" stroke="#8a9aa4" stroke-width="0.8" /><ellipse cx="1016" cy="188" rx="7" ry="7" fill="#efd048" stroke="#8a9aa4" stroke-width="0.8" /><ellipse cx="1000" cy="208" rx="7" ry="7" fill="#efd048" stroke="#8a9aa4" stroke-width="0.8" /><ellipse cx="1021" cy="209" rx="7" ry="7" fill="#efd048" stroke="#8a9aa4" stroke-width="0.8" /></g><g id="substrate-to-hrpo" transform=""><path d="M 783 248 Q 853 249 898 323" fill="none" stroke="#cc4c44" stroke-width="4" marker-end="url(#reaction-arrow)" /></g><g id="hrpo-to-product" transform=""><path d="M 939 324 Q 968 275 990 218" fill="none" stroke="#cc4c44" stroke-width="4" marker-end="url(#reaction-arrow)" /></g><g><text x="719" y="584" font-size="22" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">Antigen</text></g><g><text x="1019" y="647" font-size="22" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">Well</text></g><g><text x="975" y="453" font-size="22" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">Primary Antibody</text></g><g><text x="953" y="350" font-size="22" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">Secondary Antibody</text></g><g><text x="968" y="312" font-size="22" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">HRPO</text></g><g><text x="676" y="206" font-size="22" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">TMB Substrate</text></g><g><text x="962" y="155" font-size="22" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">Colored Product</text></g><path d="M 784 577 L 849 580 M 1016 632 L 1020 613 M 968 443 L 902 466 M 948 344 L 924 388" fill="none" stroke="#526879" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="803" cy="539" rx="17" ry="17" fill="#08699c" stroke="none" stroke-width="1.5" /><g font-weight="bold"><text x="803" y="546" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">1</text></g><ellipse cx="1020" cy="594" rx="17" ry="17" fill="#08699c" stroke="none" stroke-width="1.5" /><g font-weight="bold"><text x="1020" y="601" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">2</text></g><ellipse cx="961" cy="482" rx="17" ry="17" fill="#08699c" stroke="none" stroke-width="1.5" /><g font-weight="bold"><text x="961" y="489" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">3</text></g><ellipse cx="973" cy="372" rx="17" ry="17" fill="#08699c" stroke="none" stroke-width="1.5" /><g font-weight="bold"><text x="973" y="379" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">4</text></g><ellipse cx="716" cy="245" rx="17" ry="17" fill="#08699c" stroke="none" stroke-width="1.5" /><g font-weight="bold"><text x="716" y="252" font-size="22" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">5</text></g><g><text x="35" y="742" font-size="21" fill="#213547" text-anchor="start" font-family="Arial, sans-serif">Diagram 1: Illustration of Indirect ELISA method.</text></g></svg>
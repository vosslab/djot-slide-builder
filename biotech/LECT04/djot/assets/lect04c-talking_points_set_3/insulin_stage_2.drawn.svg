<title id="title">Recombinant insulin production: stage 2</title>
<desc id="desc">The plasmid containing the highlighted human insulin gene enters a recombinant bacterium. Original schematic illustration, not to scale. Live labels retain the source wording. Cell parts and equipment construction are simplified; insulin shapes do not encode a measured molecular structure.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">Containment layers</title><desc id="desc">Nested facility, procedural, and biological controls. No single layer establishes safety. Original simplified teaching schematic; not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs><rect width="1100" height="570" fill="white"/><text x="550" y="45" font-family="Atkinson Hyperlegible Next" font-size="32" fill="#202124" text-anchor="middle">Containment is a set of nested controls</text><rect x="70" y="85" width="960" height="430" rx="24" fill="none" stroke="#164D78" stroke-width="5"/><rect x="170" y="145" width="760" height="310" rx="24" fill="none" stroke="#00775F" stroke-width="5"/><rect x="290" y="215" width="520" height="180" rx="24" fill="none" stroke="#A66000" stroke-width="5"/><text x="550" y="125" font-family="Atkinson Hyperlegible Next" font-size="28" fill="#164D78" text-anchor="middle">Facility: access, airflow, screens, waste route</text><text x="550" y="190" font-family="Atkinson Hyperlegible Next" font-size="25" fill="#00775F" text-anchor="middle">Procedure: training, aerosols, cleaning, incident response</text><text x="550" y="265" font-family="Atkinson Hyperlegible Next" font-size="28" fill="#A66000" text-anchor="middle">Organism + vector + inserted material</text><ellipse cx="550" cy="330" rx="115" ry="35" fill="#EBD9A2" stroke="#A66000" stroke-width="3"/><text x="550" y="340" font-family="Atkinson Hyperlegible Next" font-size="24" fill="#202124" text-anchor="middle">Biological limits</text></svg>
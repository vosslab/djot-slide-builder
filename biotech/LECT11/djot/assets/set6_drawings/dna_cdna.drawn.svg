<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">DNA and cDNA comparison</title><desc id="desc">Colored blocks denote the same exon sequences through a simplified transcription, splicing, and reverse-transcription sequence. Short natural sequences can lack introns; synthesis alone does not establish patentability. Original simplified teaching schematic; not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs><rect width="1100" height="570" fill="white"/><text x="550" y="45" font-family="Atkinson Hyperlegible Next" font-size="32" fill="#202124" text-anchor="middle">Genomic DNA, mature RNA, and cDNA</text><text x="210" y="153" font-family="Atkinson Hyperlegible Next" font-size="28" fill="#164D78" text-anchor="middle">Genomic DNA</text><path d="M410 150 L1010 150" stroke="#777" stroke-width="6"/><rect x="430" y="125" width="100" height="50" fill="#164D78"/><rect x="660" y="125" width="100" height="50" fill="#164D78"/><rect x="890" y="125" width="100" height="50" fill="#164D78"/><text x="600" y="110" font-family="Atkinson Hyperlegible Next" font-size="22" fill="#202124" text-anchor="middle">intron</text><text x="830" y="110" font-family="Atkinson Hyperlegible Next" font-size="22" fill="#202124" text-anchor="middle">intron</text><text x="210" y="313" font-family="Atkinson Hyperlegible Next" font-size="28" fill="#164D78" text-anchor="middle">Mature RNA</text><rect x="570" y="285" width="100" height="50" fill="#00775F" stroke="white" stroke-width="2"/><rect x="670" y="285" width="100" height="50" fill="#00775F" stroke="white" stroke-width="2"/><rect x="770" y="285" width="100" height="50" fill="#00775F" stroke="white" stroke-width="2"/><text x="210" y="473" font-family="Atkinson Hyperlegible Next" font-size="28" fill="#164D78" text-anchor="middle">cDNA</text><rect x="570" y="445" width="100" height="50" fill="#A66000" stroke="white" stroke-width="2"/><rect x="670" y="445" width="100" height="50" fill="#A66000" stroke="white" stroke-width="2"/><rect x="770" y="445" width="100" height="50" fill="#A66000" stroke="white" stroke-width="2"/><path d="M720 185 L720 265" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="925" y="240" font-family="Atkinson Hyperlegible Next" font-size="22" fill="#202124" text-anchor="middle">Transcription + splicing</text><path d="M720 345 L720 425" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="920" y="395" font-family="Atkinson Hyperlegible Next" font-size="22" fill="#202124" text-anchor="middle">Reverse transcription</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">Seed inheritance and legal rights</title><desc id="desc">F2 variation from segregation is contrasted with legal restrictions. The diagram does not claim that all hybrid seeds are sterile or that all seed saving is forbidden. Original simplified teaching schematic; not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs><rect width="1100" height="570" fill="white"/><text x="550" y="45" font-family="Atkinson Hyperlegible Next" font-size="32" fill="#202124" text-anchor="middle">Two causes of seed-saving difficulties</text><rect x="40" y="120" width="300" height="100" rx="14" fill="#F4F7FA" stroke="#164D78" stroke-width="3"/><text x="190" y="180" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#164D78" text-anchor="middle">F1 hybrid</text><path d="M350 170 L450 170" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="470" y="120" width="570" height="100" rx="14" fill="#F4F7FA" stroke="#164D78" stroke-width="3"/><text x="755" y="180" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#164D78" text-anchor="middle">F2 offspring: alleles segregate</text><ellipse cx="545" cy="270" rx="20" ry="29" fill="#164D78"/><ellipse cx="623" cy="270" rx="20" ry="29" fill="#00775F"/><ellipse cx="701" cy="270" rx="20" ry="29" fill="#A66000"/><ellipse cx="779" cy="270" rx="20" ry="29" fill="#A92320"/><ellipse cx="857" cy="270" rx="20" ry="29" fill="#164D78"/><ellipse cx="935" cy="270" rx="20" ry="29" fill="#A66000"/><rect x="40" y="370" width="300" height="100" rx="14" fill="#F4F7FA" stroke="#A92320" stroke-width="3"/><text x="190" y="430" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#A92320" text-anchor="middle">Legal restriction</text><path d="M350 420 L450 420" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="470" y="370" width="570" height="100" rx="14" fill="#F4F7FA" stroke="#A92320" stroke-width="3"/><text x="755" y="430" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#A92320" text-anchor="middle">Patent / variety right / contract</text><text x="550" y="540" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#202124" text-anchor="middle">Variable offspring, sterility, and legal restrictions are different</text></svg>
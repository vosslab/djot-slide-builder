<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">Biotechnology responsibilities</title><desc id="desc">Separate covered research oversight, plant-pest responsibilities, pesticides, and food/feed safety. The map is specific to the teaching example, not a universal approval checklist. Original simplified teaching schematic; not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs><rect width="1100" height="570" fill="white"/><text x="550" y="45" font-family="Atkinson Hyperlegible Next" font-size="30" fill="#202124" text-anchor="middle">Bt corn raises different questions for different authorities</text><rect x="25" y="100" width="225" height="95" rx="14" fill="#F4F7FA" stroke="#164D78" stroke-width="3"/><text x="137" y="157" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#164D78" text-anchor="middle">NIH / IBC</text><text x="137" y="240" font-family="Atkinson Hyperlegible Next" font-size="24" fill="#164D78" text-anchor="middle">Covered research</text><path d="M137 265 L137 350" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="300" y="100" width="225" height="95" rx="14" fill="#F4F7FA" stroke="#00775F" stroke-width="3"/><text x="412" y="157" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#00775F" text-anchor="middle">USDA-APHIS</text><text x="412" y="240" font-family="Atkinson Hyperlegible Next" font-size="24" fill="#00775F" text-anchor="middle">Plant-pest risks</text><path d="M412 265 L412 350" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="575" y="100" width="225" height="95" rx="14" fill="#F4F7FA" stroke="#A66000" stroke-width="3"/><text x="687" y="157" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#A66000" text-anchor="middle">EPA</text><text x="687" y="240" font-family="Atkinson Hyperlegible Next" font-size="24" fill="#A66000" text-anchor="middle">Pesticidal trait</text><path d="M687 265 L687 350" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="850" y="100" width="225" height="95" rx="14" fill="#F4F7FA" stroke="#A92320" stroke-width="3"/><text x="962" y="157" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#A92320" text-anchor="middle">FDA</text><text x="962" y="240" font-family="Atkinson Hyperlegible Next" font-size="24" fill="#A92320" text-anchor="middle">Food and feed</text><path d="M962 265 L962 350" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="55" y="370" width="990" height="100" rx="14" fill="#F4F7FA" stroke="#164D78" stroke-width="3"/><text x="550" y="430" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#164D78" text-anchor="middle">One product; several responsibilities and evidence questions</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">Biologic lot control</title><desc id="desc">Three linked stages and their distinct quality questions. Original simplified teaching schematic; not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs><rect width="1100" height="570" fill="white"/><text x="550" y="45" font-family="Atkinson Hyperlegible Next" font-size="32" fill="#202124" text-anchor="middle">A contaminated lot connects production to patients</text><rect x="30" y="130" width="300" height="90" rx="14" fill="#F4F7FA" stroke="#164D78" stroke-width="3"/><text x="180" y="185" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#164D78" text-anchor="middle">Source material</text><rect x="400" y="130" width="300" height="90" rx="14" fill="#F4F7FA" stroke="#164D78" stroke-width="3"/><text x="550" y="185" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#164D78" text-anchor="middle">Production lot</text><rect x="770" y="130" width="300" height="90" rx="14" fill="#F4F7FA" stroke="#164D78" stroke-width="3"/><text x="920" y="185" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#164D78" text-anchor="middle">Patients</text><path d="M335 175 L390 175" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M705 175 L760 175" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="180" y="295" font-family="Atkinson Hyperlegible Next" font-size="28" fill="#00775F" text-anchor="middle">Identity</text><path d="M180 320 L180 385" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="550" y="295" font-family="Atkinson Hyperlegible Next" font-size="28" fill="#00775F" text-anchor="middle">Purity + potency</text><path d="M550 320 L550 385" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="920" y="295" font-family="Atkinson Hyperlegible Next" font-size="28" fill="#00775F" text-anchor="middle">Traceability</text><path d="M920 320 L920 385" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="65" y="395" width="970" height="100" rx="14" fill="#F4F7FA" stroke="#00775F" stroke-width="3"/><text x="550" y="455" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#00775F" text-anchor="middle">Inspect the process + test the product + keep the records</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">Clinical development questions</title><desc id="desc">A simplified sequence of study purposes. The dashed boundary marks the transition to post-approval studies; individual programs can differ. Original simplified teaching schematic; not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs><rect width="1100" height="570" fill="white"/><text x="550" y="45" font-family="Atkinson Hyperlegible Next" font-size="32" fill="#202124" text-anchor="middle">Different questions before and after approval</text><rect x="20" y="150" width="190" height="100" rx="14" fill="#F4F7FA" stroke="#164D78" stroke-width="3"/><text x="115" y="210" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#164D78" text-anchor="middle">Nonclinical</text><text x="115" y="295" font-family="Atkinson Hyperlegible Next" font-size="21" fill="#202124" text-anchor="middle">Mechanism + hazards</text><path d="M215 200 L232 200" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="238" y="150" width="190" height="100" rx="14" fill="#F4F7FA" stroke="#164D78" stroke-width="3"/><text x="333" y="210" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#164D78" text-anchor="middle">I</text><text x="333" y="295" font-family="Atkinson Hyperlegible Next" font-size="21" fill="#202124" text-anchor="middle">Safety + dose</text><path d="M433 200 L450 200" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="456" y="150" width="190" height="100" rx="14" fill="#F4F7FA" stroke="#164D78" stroke-width="3"/><text x="551" y="210" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#164D78" text-anchor="middle">II</text><text x="551" y="295" font-family="Atkinson Hyperlegible Next" font-size="21" fill="#202124" text-anchor="middle">Activity + dose</text><path d="M651 200 L668 200" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="674" y="150" width="190" height="100" rx="14" fill="#F4F7FA" stroke="#164D78" stroke-width="3"/><text x="769" y="210" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#164D78" text-anchor="middle">III</text><text x="769" y="295" font-family="Atkinson Hyperlegible Next" font-size="21" fill="#202124" text-anchor="middle">Benefit + risk</text><path d="M869 200 L886 200" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="892" y="150" width="190" height="100" rx="14" fill="#F4F7FA" stroke="#00775F" stroke-width="3"/><text x="987" y="210" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#00775F" text-anchor="middle">IV</text><text x="987" y="295" font-family="Atkinson Hyperlegible Next" font-size="21" fill="#202124" text-anchor="middle">After approval</text><path d="M880 95 L880 385" stroke="#A92320" stroke-width="4" stroke-dasharray="10 7"/><text x="550" y="420" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#202124" text-anchor="middle">Optional exploratory studies and combined phases can occur</text><text x="550" y="470" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#A92320" text-anchor="middle">The sequence organizes evidence; it does not guarantee success</text></svg>
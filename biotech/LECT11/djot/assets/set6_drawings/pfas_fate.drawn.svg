<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">PFAS separation versus destruction</title><desc id="desc">Capture moves PFAS into another stream or medium. Destruction requires separate evidence about transformation and fluorine fate. Original simplified teaching schematic; not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs><rect width="1100" height="570" fill="white"/><text x="550" y="45" font-family="Atkinson Hyperlegible Next" font-size="32" fill="#202124" text-anchor="middle">Cleaning water is not the same as destroying PFAS</text><rect x="35" y="110" width="320" height="95" rx="14" fill="#F4F7FA" stroke="#164D78" stroke-width="3"/><text x="195" y="167" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#164D78" text-anchor="middle">Contaminated water</text><rect x="410" y="110" width="270" height="95" rx="14" fill="#F4F7FA" stroke="#164D78" stroke-width="3"/><text x="545" y="167" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#164D78" text-anchor="middle">Capture / separation</text><rect x="745" y="110" width="320" height="95" rx="14" fill="#F4F7FA" stroke="#00775F" stroke-width="3"/><text x="905" y="167" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#00775F" text-anchor="middle">Treated water</text><rect x="410" y="350" width="270" height="95" rx="14" fill="#F4F7FA" stroke="#A92320" stroke-width="3"/><text x="545" y="407" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#A92320" text-anchor="middle">Concentrated PFAS</text><path d="M360 157 L400 157" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M685 157 L735 157" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M545 215 L545 335" stroke="#555555" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="545" y="495" font-family="Atkinson Hyperlegible Next" font-size="27" fill="#A92320" text-anchor="middle">Further treatment / disposal; verify products and fluorine balance</text></svg>
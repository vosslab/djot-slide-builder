<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">Three distinct product questions</title><desc id="desc">Patent rights, freedom to operate, and regulatory authorization are separate questions; success in one does not establish the others. Original simplified teaching schematic; not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs><rect width="1100" height="570" fill="white"/><text x="550" y="45" font-family="Atkinson Hyperlegible Next" font-size="31" fill="#202124" text-anchor="middle">Separate the biological result from the patent question</text><circle cx="260" cy="270" r="150" fill="#EDF5FC" stroke="#164D78" stroke-width="5"/><circle cx="560" cy="270" r="150" fill="#FFF2DB" stroke="#A66000" stroke-width="5"/><circle cx="860" cy="270" r="150" fill="#E2F3ED" stroke="#00775F" stroke-width="5"/><text x="260" y="255" font-family="Atkinson Hyperlegible Next" font-size="28" fill="#164D78" text-anchor="middle">Patent eligibility</text><text x="260" y="295" font-family="Atkinson Hyperlegible Next" font-size="28" fill="#164D78" text-anchor="middle">and valid claims</text><text x="560" y="255" font-family="Atkinson Hyperlegible Next" font-size="28" fill="#A66000" text-anchor="middle">Freedom</text><text x="560" y="295" font-family="Atkinson Hyperlegible Next" font-size="28" fill="#A66000" text-anchor="middle">to operate</text><text x="860" y="255" font-family="Atkinson Hyperlegible Next" font-size="28" fill="#00775F" text-anchor="middle">Regulatory</text><text x="860" y="295" font-family="Atkinson Hyperlegible Next" font-size="28" fill="#00775F" text-anchor="middle">authorization</text><text x="550" y="490" font-family="Atkinson Hyperlegible Next" font-size="29" fill="#A92320" text-anchor="middle">Each circle needs its own evidence and decision</text></svg>
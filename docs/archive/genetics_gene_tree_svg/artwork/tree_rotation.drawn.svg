<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="415" viewBox="0 0 1200 415" role="img" aria-labelledby="tree_rotation-title tree_rotation-desc">
	<title id="tree_rotation-title">Same tree after rotating the X-Y-Z subtree</title>
	<desc id="tree_rotation-desc">W remains the outgroup; Y and Z remain sisters; X remains sister to the Y-Z clade. Left tip order W X Y Z; right W Z Y X. Orange identifies the branch around which the X-Y-Z subtree rotates. Branch lengths are schematic. Source sequence: LECT12B, Rotating Branches in Trees.</desc>
	<g font-family="Liberation Sans, sans-serif">
		<g id="before">
			<g id="before-branches" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
				<path id="before-Y" d="M315 85 V175 H377.5" stroke="#0067CC" />
				<path id="before-Z" d="M440 85 V175 H377.5" stroke="#0067CC" />
				<path id="before-X" d="M190 85 V265 H283.75" stroke="#253342" />
				<path id="before-YZ" d="M377.5 175 V265 H283.75" stroke="#253342" />
				<path id="before-W" d="M65 85 V355 H174.375" stroke="#253342" />
				<path id="before-XYZ" d="M283.75 265 V355 H174.375" stroke="#253342" />
				<path id="before-root" d="M174.375 355 V390" stroke="#253342" />
			</g>
			<text x="65" y="62" font-size="43" fill="#253342" text-anchor="middle" id="before-tip-W">W</text>
			<text x="190" y="62" font-size="43" fill="#253342" text-anchor="middle" id="before-tip-X">X</text>
			<text x="315" y="62" font-size="43" fill="#0067CC" text-anchor="middle" id="before-tip-Y">Y</text>
			<text x="440" y="62" font-size="43" fill="#0067CC" text-anchor="middle" id="before-tip-Z">Z</text>
			<circle cx="377.5" cy="175" r="7" fill="#0067CC" />
		</g>
		<g id="after">
			<g id="after-branches" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
				<path id="after-Y" d="M1000 85 V175 H937.5" stroke="#0067CC" />
				<path id="after-Z" d="M875 85 V175 H937.5" stroke="#0067CC" />
				<path id="after-X" d="M1125 85 V265 H1031.25" stroke="#253342" />
				<path id="after-YZ" d="M937.5 175 V265 H1031.25" stroke="#253342" />
				<path id="after-W" d="M750 85 V355 H890.625" stroke="#253342" />
				<path id="after-XYZ" d="M1031.25 265 V355 H890.625" stroke="#253342" />
				<path id="after-root" d="M890.625 355 V390" stroke="#253342" />
			</g>
			<text x="750" y="62" font-size="43" fill="#253342" text-anchor="middle" id="after-tip-W">W</text>
			<text x="875" y="62" font-size="43" fill="#0067CC" text-anchor="middle" id="after-tip-Z">Z</text>
			<text x="1000" y="62" font-size="43" fill="#0067CC" text-anchor="middle" id="after-tip-Y">Y</text>
			<text x="1125" y="62" font-size="43" fill="#253342" text-anchor="middle" id="after-tip-X">X</text>
			<circle cx="937.5" cy="175" r="7" fill="#0067CC" />
		</g>
		<path id="comparison-arrow" d="M525 205 H645" fill="none" stroke="#253342" stroke-width="4" />
		<polygon points="645,205 628,196 628,214" fill="#253342" />
		<text x="585" y="175" font-size="29" fill="#253342" text-anchor="middle">rotate</text>
		<path id="rotation-cue" d="M311.75 313 C353.75 286 213.75 286 255.75 313 C273.75 324 304.75 322 317.75 311" fill="none" stroke="#9C4510" stroke-width="5" stroke-linecap="round" />
		<polygon points="317.75,311 300.75,310 312.75,326" fill="#9C4510" />
	</g>
</svg>
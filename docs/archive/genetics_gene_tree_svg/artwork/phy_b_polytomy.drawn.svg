<svg xmlns="http://www.w3.org/2000/svg" width="810" height="550" viewBox="0 0 810 550" role="img" aria-labelledby="title desc"><title id="title">phy_b_polytomy</title><desc id="desc">Polytomy P Q R has three children, no binary resolution; sister clade ST and U outgroup. Lengths schematic.</desc><rect width="810" height="550" fill="white"/><g font-family="Arial, sans-serif" font-size="26" fill="#243746"><rect x="260" y="15" width="245" height="190" rx="20" fill="#FFF2C2"/><g data-edge="root_PQRST"><path d="M40 300 V220 H150" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="root_U"><path d="M40 300 V450 H440" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="PQRST_PQR"><path d="M150 220 V110 H280" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="PQRST_ST"><path d="M150 220 V330 H280" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="PQR_P"><path d="M280 110 V40 H440" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="PQR_Q"><path d="M280 110 V110 H440" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="PQR_R"><path d="M280 110 V180 H440" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="ST_S"><path d="M280 330 V290 H440" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="ST_T"><path d="M280 330 V370 H440" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><text x="465" y="48" font-size="30" fill="#243746">P</text><text x="465" y="118" font-size="30" fill="#243746">Q</text><text x="465" y="188" font-size="30" fill="#243746">R</text><text x="465" y="298" font-size="30" fill="#243746">S</text><text x="465" y="378" font-size="30" fill="#243746">T</text><text x="465" y="458" font-size="30" fill="#243746">U</text><text x="540" y="105" font-size="26" fill="#243746">Three branches</text><text x="540" y="140" font-size="26" fill="#243746">leave one node.</text><text x="25" y="520" font-size="25" fill="#243746">Unresolved branching order within P, Q, R.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="550" viewBox="0 0 720 550" role="img" aria-labelledby="title desc"><title id="title">phy_b_tree_terms</title><desc id="desc">Seven anonymous tips with branches, tips and ancestral nodes identified. Same topology as source terminology tree. Schematic lengths.</desc><rect width="720" height="550" fill="white"/><g font-family="Arial, sans-serif" font-size="26" fill="#243746"><g data-edge="root_upper"><path d="M40 230 V100 H150" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="root_lower"><path d="M40 230 V355 H150" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="upper_pair"><path d="M150 100 V55 H255" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="upper_t2"><path d="M150 100 V165 H370" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="pair_t0"><path d="M255 55 V25 H370" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="pair_t1"><path d="M255 55 V95 H370" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="lower_pair2"><path d="M150 355 V290 H255" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="lower_pair3"><path d="M150 355 V430 H255" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="pair2_t3"><path d="M255 290 V235 H370" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="pair2_t4"><path d="M255 290 V305 H370" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="pair3_t5"><path d="M255 430 V375 H370" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><g data-edge="pair3_t6"><path d="M255 430 V445 H370" fill="none" stroke="#243746" stroke-width="4" stroke-linejoin="round"/></g><circle cx="370" cy="95" r="8" fill="#17643A"/><circle cx="370" cy="165" r="8" fill="#17643A"/><circle cx="150" cy="355" r="10" fill="white" stroke="#0067CC" stroke-width="4"/><circle cx="255" cy="290" r="10" fill="white" stroke="#0067CC" stroke-width="4"/><circle cx="255" cy="430" r="10" fill="white" stroke="#0067CC" stroke-width="4"/><path d="M150 100 H255 V25 H370" fill="none" stroke="#713A9B" stroke-width="4" stroke-linejoin="round"/><text x="430" y="70" font-size="27" fill="#713A9B">Branches</text><text x="430" y="105" font-size="25" fill="#713A9B">(lineages)</text><text x="430" y="180" font-size="27" fill="#17643A">Tips (leaves)</text><text x="430" y="350" font-size="27" fill="#0067CC">Nodes</text><text x="430" y="385" font-size="25" fill="#0067CC">(ancestors)</text><text x="25" y="515" font-size="23" fill="#243746">Branch lengths are schematic.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530" role="img" aria-labelledby="title description"><title id="title">Sorting polymorphic alleles</title><desc id="description">Original conceptual reconstruction of LECT12E source page2 and C source page39. Two species splits; surviving A2 in species1 and2; A1 in species3. Branch lengths schematic.</desc><g font-family="Arial, sans-serif"><g id="species-scaffold"><path d="M70,210 H300 L550,350 H600 M300,210 L850,70 M600,350 L850,250 M600,350 L850,430" fill="none" stroke="#D9E4EC" stroke-width="42" stroke-linejoin="round" stroke-linecap="round"/></g><g id="allele-a1"><path d="M70,198 H300 L550,338 H600 L850,418" fill="none" stroke="#006CA8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M300,198 L590,124" fill="none" stroke="#006CA8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M600,338 L735,280" fill="none" stroke="#006CA8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M583,117 L597,131 M583,131 L597,117" fill="none" stroke="#006CA8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M728,273 L742,287 M728,287 L742,273" fill="none" stroke="#006CA8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g><g id="allele-a2"><path d="M205,222 H300 L850,82" fill="none" stroke="#B54400" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7"/><path d="M300,222 L550,362 H600 L850,262" fill="none" stroke="#B54400" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7"/><path d="M600,362 L725,402" fill="none" stroke="#B54400" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7"/><path d="M718,395 L732,409 M718,409 L732,395" fill="none" stroke="#B54400" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g><text x="65" y="168" font-size="26" fill="#006CA8" text-anchor="start">A1</text><text x="230" y="258" font-size="26" fill="#B54400" text-anchor="start">A2</text><text x="560" y="102" font-size="22" fill="#006CA8" text-anchor="start">A1 lost</text><text x="670" y="246" font-size="22" fill="#006CA8" text-anchor="start">A1 lost</text><text x="650" y="451" font-size="22" fill="#B54400" text-anchor="start">A2 lost</text><text x="880" y="82" font-size="25" fill="#222222" text-anchor="start">Species 1</text><text x="880" y="112" font-size="25" fill="#B54400" text-anchor="start">A2</text><text x="880" y="262" font-size="25" fill="#222222" text-anchor="start">Species 2</text><text x="880" y="292" font-size="25" fill="#B54400" text-anchor="start">A2</text><text x="880" y="430" font-size="25" fill="#222222" text-anchor="start">Species 3</text><text x="880" y="460" font-size="25" fill="#006CA8" text-anchor="start">A1</text><text x="65" y="36" font-size="26" fill="#222222" text-anchor="start">Ancestor: A1 fixed</text><text x="205" y="302" font-size="22" fill="#222222" text-anchor="start">Mutation</text><text x="205" y="328" font-size="22" fill="#222222" text-anchor="start">A1 + A2</text><path d="M207,282 L207,233" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="65" y="508" font-size="22" fill="#222222" text-anchor="start">Shading: species ancestry</text><text x="440" y="508" font-size="22" fill="#006CA8" text-anchor="start">Solid A1</text><text x="610" y="508" font-size="22" fill="#B54400" text-anchor="start">Dashed A2</text><text x="820" y="508" font-size="22" fill="#222222" text-anchor="start">&#215; = loss</text></g></svg>
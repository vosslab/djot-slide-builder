			<text x="640" y="72" font-size="48" fill="#0067CC" text-anchor="middle" id="form-2-tip-Y">Y</text>
			<text x="740" y="72" font-size="48" fill="#253342" text-anchor="middle" id="form-2-tip-X">X</text>
			<circle cx="590.0" cy="185" r="7" fill="#0067CC" />

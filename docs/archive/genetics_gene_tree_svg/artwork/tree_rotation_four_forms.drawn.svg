			<g id="form-2-branches" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
				<path id="form-2-Y" d="M640 95 V185 H590.0" stroke="#0067CC" />
				<path id="form-2-Z" d="M540 95 V185 H590.0" stroke="#0067CC" />
				<path id="form-2-X" d="M740 95 V280 H665.0" stroke="#253342" />
				<path id="form-2-YZ" d="M590.0 185 V280 H665.0" stroke="#253342" />

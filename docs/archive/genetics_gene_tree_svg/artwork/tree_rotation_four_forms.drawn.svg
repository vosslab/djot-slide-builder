<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="435" viewBox="0 0 1600 435" role="img" aria-labelledby="tree_rotation_four_forms-title tree_rotation_four_forms-desc">
	<title id="tree_rotation_four_forms-title">Four arrangements of the same rooted tree</title>
	<desc id="tree_rotation_four_forms-desc">Tip orders from left to right: W X Y Z; W Z Y X; W X Z Y; X Z Y W. Every form has W as outgroup, sister taxa Y and Z, and clade X Y Z. Equal signs mean equal topology. Branch lengths are schematic. Source sequence: LECT12B, Trees, trees, and trees, oh my.</desc>
	<g font-family="Liberation Sans, sans-serif">
		<g id="form-1">
			<g id="form-1-branches" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
				<path id="form-1-Y" d="M235 95 V185 H285.0" stroke="#0067CC" />
				<path id="form-1-Z" d="M335 95 V185 H285.0" stroke="#0067CC" />
				<path id="form-1-X" d="M135 95 V280 H210.0" stroke="#253342" />
				<path id="form-1-YZ" d="M285.0 185 V280 H210.0" stroke="#253342" />
				<path id="form-1-W" d="M35 95 V370 H122.5" stroke="#253342" />
				<path id="form-1-XYZ" d="M210.0 280 V370 H122.5" stroke="#253342" />
				<path id="form-1-root" d="M122.5 370 V410" stroke="#253342" />
			</g>
			<text x="35" y="72" font-size="48" fill="#253342" text-anchor="middle" id="form-1-tip-W">W</text>
			<text x="135" y="72" font-size="48" fill="#253342" text-anchor="middle" id="form-1-tip-X">X</text>
			<text x="235" y="72" font-size="48" fill="#0067CC" text-anchor="middle" id="form-1-tip-Y">Y</text>
			<text x="335" y="72" font-size="48" fill="#0067CC" text-anchor="middle" id="form-1-tip-Z">Z</text>
			<circle cx="285.0" cy="185" r="7" fill="#0067CC" />
		</g>

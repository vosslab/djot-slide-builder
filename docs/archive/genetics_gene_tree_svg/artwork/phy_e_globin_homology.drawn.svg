<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title description"><title id="title">Globin gene homology</title><desc id="description">Original reconstruction of LECT12E source figure9. Early globin duplicates to alpha and beta. Each lineage retains frog, chick, mouse; chick and mouse share their more recent branch. Orthology groups within each lineage; mousealpha and mousebeta exemplify paralogy. All six genes are homologs; lengths schematic.</desc><g font-family="Arial, sans-serif"><g id="gene-tree"><path d="M500,415 V365 M500,365 L245,280 M500,365 L755,280 M245,280 L70,150 M245,280 L325,215 M325,215 L250,150 M325,215 L420,150 M755,280 L930,150 M755,280 L675,215 M675,215 L580,150 M675,215 L750,150" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></g><text x="70" y="131" font-size="27" fill="#006CA8" text-anchor="middle">frog &#945;</text><text x="250" y="131" font-size="27" fill="#006CA8" text-anchor="middle">chick &#945;</text><text x="420" y="131" font-size="27" fill="#006CA8" text-anchor="middle">mouse &#945;</text><text x="580" y="131" font-size="27" fill="#B54400" text-anchor="middle">mouse &#946;</text><text x="750" y="131" font-size="27" fill="#B54400" text-anchor="middle">chick &#946;</text><text x="930" y="131" font-size="27" fill="#B54400" text-anchor="middle">frog &#946;</text><text x="500" y="455" font-size="26" fill="#222222" text-anchor="middle">Early globin gene</text><text x="245" y="321" font-size="25" fill="#006CA8" text-anchor="middle">&#945;-chain gene</text><text x="755" y="321" font-size="25" fill="#B54400" text-anchor="middle">&#946;-chain gene</text><circle cx="500" cy="365" r="8" fill="#007A52"/><text x="520" y="375" font-size="24" fill="#007A52" text-anchor="start">Duplication</text><path d="M60,91 V75 H430 V91" fill="none" stroke="#006CA8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="245" y="64" font-size="25" fill="#006CA8" text-anchor="middle">Orthologs</text><path d="M570,91 V75 H940 V91" fill="none" stroke="#B54400" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="755" y="64" font-size="25" fill="#B54400" text-anchor="middle">Orthologs</text><path d="M425,105 V91 H575 V105" fill="none" stroke="#007A52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="500" y="40" font-size="25" fill="#007A52" text-anchor="middle">Paralogs</text></g></svg>
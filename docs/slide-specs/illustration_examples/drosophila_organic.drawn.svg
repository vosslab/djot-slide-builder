<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="organic-title organic-desc">
<title id="organic-title">Drosophila &#8212; organic form study</title>
<desc id="organic-desc">Original lateral-oblique generalized adult fruit fly. Red compound eye, tan bristled head and thorax, dark transverse abdominal bands, six articulated legs and two translucent wings. One visible haltere. Selective anatomy, unmeasured proportions and simplified wing venation; not a sex or species identification plate.</desc>

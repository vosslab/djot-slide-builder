<?xml version='1.0' encoding='utf-8'?>
<svg width="1200" height="550" viewBox="0 0 1200 550" xmlns="http://www.w3.org/2000/svg">
<title>Trace a Double-Recombinant Chromatid</title>
<desc>Schematic of two participating nonsister chromatids. Original allele rows in D-C-H order are +c+ and d+h. The highlighted path starts on the first chromatid at D, switches to the second at C, and returns to the first at H. The product is +++, with parental outer +/+ alleles and the exchanged middle allele. The faint reciprocal path produces dch. Red identifies the CD interval and blue the CH interval.</desc>
<g font-family="Atkinson Hyperlegible Next, sans-serif">
<text x="180" y="48" font-size="48" fill="#182033" text-anchor="middle" font-weight="bold">D</text><text x="600" y="48" font-size="48" fill="#182033" text-anchor="middle" font-weight="bold">C</text><text x="1020" y="48" font-size="48" fill="#182033" text-anchor="middle" font-weight="bold">H</text><text x="395" y="101" font-size="32" fill="#D40000" text-anchor="middle" font-weight="normal">C-D interval</text><text x="805" y="101" font-size="32" fill="#003FFF" text-anchor="middle" font-weight="normal">C-H interval</text><g id="chromatid-0"><path d="M 100.0,200.0 L 1100.0,200.0" fill="none" stroke="#344651" stroke-width="4.14" stroke-linecap="butt" stroke-linejoin="round" /><path d="M 100.0,200.0 L 1100.0,200.0" fill="none" stroke="#CBD0D7" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" /><g id="chromatid-0-region-0" data-source-label=""><path d="M 100.0,200.0 L 1100.0,200.0" fill="none" stroke="#CBD0D7" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" /></g><rect x="99.05" y="197.93" width="1.9" height="4.14" rx="0.79" fill="#344651" transform="rotate(0.0 100.0 200.0)" /><rect x="99.12" y="198.0" width="1.76" height="4" rx="0.72" fill="#CBD0D7" transform="rotate(0.0 100.0 200.0)" /><rect x="1099.05" y="197.93" width="1.9" height="4.14" rx="0.79" fill="#344651" transform="rotate(0.0 1100.0 200.0)" /><rect x="1099.12" y="198.0" width="1.76" height="4" rx="0.72" fill="#CBD0D7" transform="rotate(0.0 1100.0 200.0)" /></g><g id="chromatid-1"><path d="M 100.0,360.0 L 1100.0,360.0" fill="none" stroke="#344651" stroke-width="4.14" stroke-linecap="butt" stroke-linejoin="round" /><path d="M 100.0,360.0 L 1100.0,360.0" fill="none" stroke="#CBD0D7" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" /><g id="chromatid-1-region-0" data-source-label=""><path d="M 100.0,360.0 L 1100.0,360.0" fill="none" stroke="#CBD0D7" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" /></g><rect x="99.05" y="357.93" width="1.9" height="4.14" rx="0.79" fill="#344651" transform="rotate(0.0 100.0 360.0)" /><rect x="99.12" y="358.0" width="1.76" height="4" rx="0.72" fill="#CBD0D7" transform="rotate(0.0 100.0 360.0)" /><rect x="1099.05" y="357.93" width="1.9" height="4.14" rx="0.79" fill="#344651" transform="rotate(0.0 1100.0 360.0)" /><rect x="1099.12" y="358.0" width="1.76" height="4" rx="0.72" fill="#CBD0D7" transform="rotate(0.0 1100.0 360.0)" /></g><path d="M 100,360 H 300 L 500,200 H 700 L 900,360 H 1100" fill="none" stroke="#CBD0D7" stroke-width="4" stroke-dasharray="10 8" /><g id="chromatid-2"><path d="M 100.0,200.0 L 300.0,200.0 L 500.0,360.0 L 600.0,360.0 L 700.0,360.0 L 900.0,200.0 L 1100.0,200.0" fill="none" stroke="#344651" stroke-width="8.28" stroke-linecap="butt" stroke-linejoin="round" /><path d="M 100.0,200.0 L 300.0,200.0 L 500.0,360.0 L 600.0,360.0 L 700.0,360.0 L 900.0,200.0 L 1100.0,200.0" fill="none" stroke="#D40000" stroke-width="8" stroke-linecap="butt" stroke-linejoin="round" /><g id="chromatid-2-region-0" data-source-label=""><path d="M 100.0,200.0 L 300.0,200.0 L 500.0,360.0 L 600.0,360.0" fill="none" stroke="#D40000" stroke-width="8" stroke-linecap="butt" stroke-linejoin="round" /></g><g id="chromatid-2-region-1" data-source-label=""><path d="M 600.0,360.0 L 700.0,360.0 L 900.0,200.0 L 1100.0,200.0" fill="none" stroke="#003FFF" stroke-width="8" stroke-linecap="butt" stroke-linejoin="round" /></g><rect x="98.1" y="195.86" width="3.8" height="8.28" rx="1.58" fill="#344651" transform="rotate(0.0 100.0 200.0)" /><rect x="98.24" y="196.0" width="3.52" height="8" rx="1.44" fill="#D40000" transform="rotate(0.0 100.0 200.0)" /><rect x="1098.1" y="195.86" width="3.8" height="8.28" rx="1.58" fill="#344651" transform="rotate(0.0 1100.0 200.0)" /><rect x="1098.24" y="196.0" width="3.52" height="8" rx="1.44" fill="#003FFF" transform="rotate(0.0 1100.0 200.0)" /></g><rect x="146" y="126" width="68" height="63" fill="#FFFFFF" stroke="#182033" stroke-width="3" /><text x="180" y="173" font-size="48" fill="#182033" text-anchor="middle" font-weight="bold">+</text><rect x="146" y="286" width="68" height="63" fill="#FFFFFF" stroke="none" stroke-width="3" /><text x="180" y="333" font-size="48" fill="#737C89" text-anchor="middle" font-weight="normal">d</text><rect x="566" y="126" width="68" height="63" fill="#FFFFFF" stroke="none" stroke-width="3" /><text x="600" y="173" font-size="48" fill="#737C89" text-anchor="middle" font-weight="normal">c</text><rect x="566" y="286" width="68" height="63" fill="#FFFFFF" stroke="#182033" stroke-width="3" /><text x="600" y="333" font-size="48" fill="#182033" text-anchor="middle" font-weight="bold">+</text><rect x="986" y="126" width="68" height="63" fill="#FFFFFF" stroke="#182033" stroke-width="3" /><text x="1020" y="173" font-size="48" fill="#182033" text-anchor="middle" font-weight="bold">+</text><rect x="986" y="286" width="68" height="63" fill="#FFFFFF" stroke="none" stroke-width="3" /><text x="1020" y="333" font-size="48" fill="#737C89" text-anchor="middle" font-weight="normal">h</text><text x="400" y="235" font-size="34" fill="#D40000" text-anchor="middle" font-weight="bold">1</text><text x="800" y="235" font-size="34" fill="#003FFF" text-anchor="middle" font-weight="bold">2</text><text x="600" y="458" font-size="40" fill="#182033" text-anchor="middle" font-weight="bold">Trace one chromatid:  +  +  +</text><text x="600" y="520" font-size="36" fill="#182033" text-anchor="middle" font-weight="normal">Two exchanges restore the parental D-H combination.</text>
</g>
</svg>
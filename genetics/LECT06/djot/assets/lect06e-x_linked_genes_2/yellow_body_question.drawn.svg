<svg xmlns="http://www.w3.org/2000/svg" width="839" height="195" viewBox="0 0 839 195" role="img" aria-labelledby="title desc"><title id="title">Yellow-body inheritance question 4.23</title><desc id="desc">Faithful editable source question without answers.</desc><rect x="1" y="1" width="837" height="193" rx="8" fill="#faf8fd" stroke="#e4dfed" /><text x="12" y="32" font-family="Atkinson Hyperlegible Next" font-size="25" font-weight="400" font-style="normal" fill="#24212b" id="number" xml:space="preserve"><tspan fill="#92251b" font-weight="700">4.23</tspan></text><text x="82" y="32" font-family="Atkinson Hyperlegible Next" font-size="27" font-weight="400" font-style="normal" fill="#24212b" id="stem-line-1" xml:space="preserve"><tspan>Yellow body color in </tspan><tspan font-style="italic">Drosophila</tspan><tspan> is determined by the</tspan></text><text x="82" y="66" font-family="Atkinson Hyperlegible Next" font-size="27" font-weight="400" font-style="normal" fill="#24212b" id="stem-line-2" xml:space="preserve"><tspan>recessive allele </tspan><tspan font-style="italic">y</tspan><tspan> of an X-linked gene, and the wild-type</tspan></text><text x="82" y="100" font-family="Atkinson Hyperlegible Next" font-size="27" font-weight="400" font-style="normal" fill="#24212b" id="stem-line-3" xml:space="preserve"><tspan>gray body color is determined by the </tspan><tspan font-style="italic">y</tspan><tspan dy="-9" font-size="19">+</tspan><tspan dy="9"> allele. What</tspan></text><text x="82" y="134" font-family="Atkinson Hyperlegible Next" font-size="27" font-weight="400" font-style="normal" fill="#24212b" id="stem-line-4" xml:space="preserve"><tspan>genotype and phenotype ratios would be expected</tspan></text><text x="82" y="168" font-family="Atkinson Hyperlegible Next" font-size="27" font-weight="400" font-style="normal" fill="#24212b" id="stem-line-5" xml:space="preserve"><tspan>from the following crosses?</tspan></text></svg>
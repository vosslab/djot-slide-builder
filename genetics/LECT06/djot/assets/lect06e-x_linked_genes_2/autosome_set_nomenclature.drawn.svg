<path d="M -1.7 5 C -2.0 22.05 -1.8 40 -1.5 44" fill="none" stroke="#F6B4AC" stroke-width="1.35" stroke-linecap="round"/>
<path d="M -1.4 55 C -1.8 62 -1.6 63 -1.5 71" fill="none" stroke="#F6B4AC" stroke-width="1.35" stroke-linecap="round"/>

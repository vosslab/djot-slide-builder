<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="354" height="368" viewBox="0 0 354 368" role="img" aria-labelledby="autosome-title autosome-description">
<title id="autosome-title">Autosome-set nomenclature</title>
<desc id="autosome-description">Four conditions in reading order: Haploid (N), A; Diploid (2N), AA; Triploid (3N), AAA; Tetraploid (4N), AAAA. Each has one, two, three, or four separate copies of a red medium-length chromosome with a low centromere, a purple long chromosome with a high centromere, and a yellow short chromosome with a middle centromere. Totals are 3, 6, 9, and 12 unreplicated chromosomes. This is a schematic comparison of generic autosome sets; proportions are illustrative.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="901" height="356" viewBox="0 0 901 356" role="img" aria-labelledby="title desc"><title id="title">X-linked signal and Sxl activity</title><desc id="desc">High, intermediate and low X-linked signal branches preserve the source ON/OFF, protein, transcript and sex-symbol states. Intermediate cells include both ON and OFF states.</desc><rect width="901" height="356" fill="white" /><g id="process-connections" fill="none" stroke="#29343a" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path id="shared-input-trunk" d="M126 178 H150 M150 83 V280" /><g id="high-input"><path id="high-input-shaft" d="M150 83 H291" /><path id="high-input-head" d="M281 78 L291 83 L281 88" /></g><g id="high-protein"><path id="high-protein-shaft" d="M390 83 H424" /><path id="high-protein-head" d="M414 78 L424 83 L414 88" /></g><g id="high-transcript"><path id="high-transcript-shaft" d="M567 83 H598" /><path id="high-transcript-head" d="M588 78 L598 83 L588 88" /></g><g id="high-symbol"><path id="high-symbol-shaft" d="M757 83 H787" /><path id="high-symbol-head" d="M777 78 L787 83 L777 88" /></g><g id="intermediate-input"><path id="intermediate-input-shaft" d="M150 178 H291" /><path id="intermediate-input-head" d="M281 173 L291 178 L281 183" /></g><g id="intermediate-protein"><path id="intermediate-protein-shaft" d="M390 178 H424" /><path id="intermediate-protein-head" d="M414 173 L424 178 L414 183" /></g><g id="intermediate-transcript"><path id="intermediate-transcript-shaft" d="M567 178 H598" /><path id="intermediate-transcript-head" d="M588 173 L598 178 L588 183" /></g><g id="intermediate-symbol"><path id="intermediate-symbol-shaft" d="M757 178 H787" /><path id="intermediate-symbol-head" d="M777 173 L787 178 L777 183" /></g><g id="low-input"><path id="low-input-shaft" d="M150 280 H291" /><path id="low-input-head" d="M281 275 L291 280 L281 285" /></g><g id="low-protein"><path id="low-protein-shaft" d="M390 280 H424" /><path id="low-protein-head" d="M414 275 L424 280 L414 285" /></g><g id="low-transcript"><path id="low-transcript-shaft" d="M567 280 H598" /><path id="low-transcript-head" d="M588 275 L598 280 L588 285" /></g><g id="low-symbol"><path id="low-symbol-shaft" d="M757 280 H787" /><path id="low-symbol-head" d="M777 275 L787 280 L777 285" /></g></g><text id="signal-input" x="7" y="148" font-family="Atkinson Hyperlegible Next" font-size="16.5" font-weight="400" font-style="normal" fill="#222c32" xml:space="preserve"><tspan x="7" y="148">Amount of </tspan><tspan x="7" y="168">protein from </tspan><tspan x="7" y="188">X-linked signal </tspan><tspan x="7" y="208">elements (XSE)</tspan></text><text id="high-level" x="159" y="18" font-family="Atkinson Hyperlegible Next" font-size="16.5" font-weight="400" font-style="normal" fill="#222c32" xml:space="preserve"><tspan x="159" y="18">High </tspan><tspan x="159" y="38">(equivalent to two </tspan><tspan x="159" y="58">X chromosomes)</tspan></text><text id="intermediate-level" x="159" y="165" font-family="Atkinson Hyperlegible Next" font-size="16.5" font-weight="400" font-style="normal" fill="#222c32" xml:space="preserve"><tspan x="159" y="165">Intermediate</tspan></text><text id="low-level" x="159" y="306" font-family="Atkinson Hyperlegible Next" font-size="16.5" font-weight="400" font-style="normal" fill="#222c32" xml:space="preserve"><tspan x="159" y="306">Low </tspan><tspan x="159" y="326">(equivalent to one </tspan><tspan x="159" y="346">X chromosome)</tspan></text><g id="status-boxes"><g id="high-on"><rect id="high-on-body" x="300" y="67" width="80" height="31" rx="2" fill="#ef9aa9" stroke="#ce7388" stroke-width="0.8" /><text id="high-on-text" x="310" y="89" font-family="Atkinson Hyperlegible Next" font-size="17" fill="#182e35" font-weight="400" xml:space="preserve"><tspan font-style="italic">Sxl</tspan><tspan font-style="normal"> ON</tspan></text></g><g id="intermediate-on"><rect id="intermediate-on-body" x="300" y="142" width="80" height="31" rx="2" fill="#ef9aa9" stroke="#ce7388" stroke-width="0.8" /><text id="intermediate-on-text" x="310" y="164" font-family="Atkinson Hyperlegible Next" font-size="17" fill="#182e35" font-weight="400" xml:space="preserve"><tspan font-style="italic">Sxl</tspan><tspan font-style="normal"> ON</tspan></text></g><g id="intermediate-off"><rect id="intermediate-off-body" x="300" y="181" width="80" height="31" rx="2" fill="#b9e1df" stroke="#83b9b6" stroke-width="0.8" /><text id="intermediate-off-text" x="310" y="203" font-family="Atkinson Hyperlegible Next" font-size="17" fill="#182e35" font-weight="400" xml:space="preserve"><tspan font-style="italic">Sxl</tspan><tspan font-style="normal"> OFF</tspan></text></g><g id="low-off"><rect id="low-off-body" x="300" y="264" width="80" height="31" rx="2" fill="#b9e1df" stroke="#83b9b6" stroke-width="0.8" /><text id="low-off-text" x="310" y="286" font-family="Atkinson Hyperlegible Next" font-size="17" fill="#182e35" font-weight="400" xml:space="preserve"><tspan font-style="italic">Sxl</tspan><tspan font-style="normal"> OFF</tspan></text></g></g><text id="some-cells" x="300" y="133" font-family="Atkinson Hyperlegible Next" font-size="16.5" font-weight="400" font-style="normal" fill="#222c32" xml:space="preserve"><tspan x="300" y="133">Some cells</tspan></text><text id="other-cells" x="300" y="232" font-family="Atkinson Hyperlegible Next" font-size="16.5" font-weight="400" font-style="normal" fill="#222c32" xml:space="preserve"><tspan x="300" y="232">Other cells</tspan></text><text id="high-protein-text" x="435" y="77" font-family="Atkinson Hyperlegible Next" font-size="16.5" font-weight="400" font-style="normal" fill="#222c32" xml:space="preserve"><tspan x="435" y="77">SXL protein </tspan><tspan x="435" y="97">produced</tspan></text><text id="intermediate-protein-text" x="435" y="147" font-family="Atkinson Hyperlegible Next" font-size="16.5" font-weight="400" font-style="normal" fill="#222c32" xml:space="preserve"><tspan x="435" y="147"
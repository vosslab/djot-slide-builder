<title id="plate-title">The life cycle of a diploid animal</title><desc id="plate-desc">Original human anatomical life-cycle schematic replacing lect06c-meiosis.odp page40 artwork. Adult ovary and testis lead separately through meiosis to egg and sperm, both haploid n equals23. Fertilization leads to a diploid zygote,2n equals46. Mitosis and development return to multicellular diploid adults. Gonads are magnified illustrative details.</desc>

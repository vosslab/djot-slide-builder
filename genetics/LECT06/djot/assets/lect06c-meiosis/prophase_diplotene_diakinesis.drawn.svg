<text x="300" y="48" font-size="36" text-anchor="middle">Chromosomes become</text><text x="300" y="91" font-size="36" text-anchor="middle">shorter and thicker;</text><text x="300" y="134" font-size="36" text-anchor="middle">chiasmata are prominent.</text>
<text x="1030" y="48" font-size="36" text-anchor="middle">Homologous chromosomes</text><text x="1030" y="91" font-size="36" text-anchor="middle">repel; they are held</text><text x="1030" y="134" font-size="36" text-anchor="middle">together by chiasmata.</text>

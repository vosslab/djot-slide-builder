<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="plate-title plate-desc">
<title id="plate-title">Life cycle of a diploid animal</title><desc id="plate-desc">Original schematic mouse life cycle, preserving the complete stages and labels of lect06c-meiosis.odp page 39. Two haploid first-division products precede one egg and three degenerating products. Egg and incoming sperm join, then the zygote develops into the adult and returns to the meiocyte. Proportions are illustrative.</desc>

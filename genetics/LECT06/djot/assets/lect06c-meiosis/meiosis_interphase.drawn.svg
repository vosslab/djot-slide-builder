<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title>Chromosome duplication before meiosis</title><desc>Original schematic after lecture 06C. Chromosome lengths distinguish source homolog pairs; crossing-over positions are schematic.</desc><rect width="100%" height="100%" fill="white"/><g id="before"><ellipse cx="270" cy="270" rx="175" ry="145" fill="#FFF5E4" stroke="#A79B85" stroke-width="2"/><g id="before0" data-chromosomes="1" data-chromatids="1"><path d="M253.0,220.0 Q253.0,270 253.0,320.0" fill="none" stroke="#087EA4" stroke-width="7" stroke-linecap="round"/></g><g id="before1" data-chromosomes="1" data-chromatids="1"><path d="M287.0,220.0 Q287.0,270 287.0,320.0" fill="none" stroke="#BB2637" stroke-width="7" stroke-linecap="round"/></g></g><g id="after"><ellipse cx="930" cy="270" rx="175" ry="145" fill="#FFF5E4" stroke="#A79B85" stroke-width="2"/><g id="after0" data-chromosomes="1" data-chromatids="2"><path d="M907.0,220.0 Q919.0,270 907.0,320.0" fill="none" stroke="#087EA4" stroke-width="7" stroke-linecap="round"/><path d="M919.0,220.0 Q907.0,270 919.0,320.0" fill="none" stroke="#087EA4" stroke-width="7" stroke-linecap="round"/><circle cx="913.0" cy="270" r="4" fill="white" stroke="#087EA4" stroke-width="2"/></g><g id="after1" data-chromosomes="1" data-chromatids="2"><path d="M941.0,220.0 Q953.0,270 941.0,320.0" fill="none" stroke="#BB2637" stroke-width="7" stroke-linecap="round"/><path d="M953.0,220.0 Q941.0,270 953.0,320.0" fill="none" stroke="#BB2637" stroke-width="7" stroke-linecap="round"/><circle cx="947.0" cy="270" r="4" fill="white" stroke="#BB2637" stroke-width="2"/></g></g><path d="M465,270 L730,270" stroke="#617789" stroke-width="3"/><circle cx="730" cy="270" r="4" fill="#617789"/><text x="270" y="55" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="34" fill="#192C3B">Diploid parent cell</text><text x="930" y="55" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="34" fill="#192C3B">Duplicated homologs</text><text x="600" y="220" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="29" fill="#192C3B">Replication</text><text x="270" y="490" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="28" fill="#192C3B">2 chromosomes; 2 chromatids</text><text x="930" y="490" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="28" fill="#192C3B">2 chromosomes; 4 chromatids</text><text x="930" y="535" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="25" fill="#192C3B">Sister chromatids remain joined</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="corn-title corn-desc">
<title id="corn-title">The life cycle of corn</title>
<desc id="corn-desc">A maize sporophyte has a tassel and an ear shoot. In two parallel tracks, diploid microsporocytes and megasporocytes undergo meiosis. Haploid microspores develop by mitosis into pollen with two sperm nuclei. One surviving megaspore develops by mitosis into an embryo sac with an egg and two polar nuclei. Double fertilization produces a diploid embryo and triploid endosperm in the mature kernel. Growth by mitosis returns to the mature sporophyte. Anatomical stages and nuclei are schematic and not to scale.</desc>
<metadata>Original editable vector construction. Source facts: genetics/LECT06/djot/assets/lect06c-meiosis/image_031.jpg; source consumer: lect06c-meiosis.djot, The life cycle of corn. Natural organ contours are newly constructed. Nuclear colors retain source fusion partners. Diagram schematic, not to scale.</metadata>

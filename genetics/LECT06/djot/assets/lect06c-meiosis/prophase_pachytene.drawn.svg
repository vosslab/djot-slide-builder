<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc"><title id="title">prophase pachytene</title><desc id="desc">Two successive prophase I substages. Early threads show schematic visibility rather than a countable chromatid inventory. Later nuclei show two homologous chromosome pairs, four chromatids per bivalent, two chiasmata in the long pair and one in the short pair. Small cells are magnified into the corresponding nuclei.</desc><rect width="1200" height="1080" fill="white"/><g font-family="Atkinson Hyperlegible Next, sans-serif" fill="#263844">

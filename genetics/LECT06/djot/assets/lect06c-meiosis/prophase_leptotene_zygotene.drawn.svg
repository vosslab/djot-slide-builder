<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc"><title id="title">prophase leptotene zygotene</title><desc id="desc">Two successive prophase I substages. Early threads show schematic visibility rather than a countable chromatid inventory. Later nuclei show two homologous chromosome pairs, four chromatids per bivalent, two chiasmata in the long pair and one in the short pair. Small cells are magnified into the corresponding nuclei.</desc><rect width="900" height="1200" fill="white"/><g font-family="Atkinson Hyperlegible Next, sans-serif" fill="#263844">

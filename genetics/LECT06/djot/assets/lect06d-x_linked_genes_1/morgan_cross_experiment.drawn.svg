<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Morgan eye-color cross: experiment and results</title><desc id="desc">Schematic original fly heads. P red-eyed female crossed with white-eyed male; all F1 offspring red-eyed. F2 classes are two red-eyed females, one red-eyed male and one white-eyed male. Progeny classes are illustrative, not measured individuals.</desc>

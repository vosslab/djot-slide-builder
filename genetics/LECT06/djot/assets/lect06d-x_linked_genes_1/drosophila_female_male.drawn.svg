<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title description">
<title id="title">Female and male Drosophila</title>
<desc id="description">Original schematic dorsal comparison, not measured. A larger female on the left has a pointed, banded abdomen; the smaller male on the right has a rounded abdomen with a dark posterior. Each normal fly has red compound eyes, antennae, six articulated legs and a pair of transparent wings.</desc>

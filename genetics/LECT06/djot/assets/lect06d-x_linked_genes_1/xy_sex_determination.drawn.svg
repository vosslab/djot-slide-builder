<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="485" viewBox="0 0 1160 485" role="img" aria-labelledby="xy-title xy-desc">
<title id="xy-title">X-Y sex determination</title>
<desc id="xy-desc">Two schematic parents produce X-bearing eggs and X- or Y-bearing sperm. One egg and one sperm contribute chromosomes to each XX or XY progeny. Two representative autosome pairs are shown; chromosome counts are schematic.</desc>
<defs>

<svg xmlns="http://www.w3.org/2000/svg" width="284" height="327" viewBox="0 0 284 327" role="img" aria-labelledby="title desc"><title id="title">X and Y gametes in a Punnett square</title><desc id="desc">X and Y sperm across the top combine with two X egg rows. The two XX female cells are peach and the two XY male cells are blue. The female to male ratio is one to one.</desc><rect width="284" height="327" fill="white" /><text id="heading-sperm" x="177" y="16" font-family="Atkinson Hyperlegible Next" font-size="17" font-style="normal" font-weight="400" text-anchor="middle" fill="#25343d">Sperm</text><text id="heading-eggs" x="23" y="155" font-family="Atkinson Hyperlegible Next" font-size="16" font-style="normal" font-weight="400" text-anchor="middle" fill="#25343d">Eggs</text><g id="incoming-arrow" fill="none" stroke="#33434b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path id="incoming-shaft" d="M0 29 H82" /><path id="incoming-head" d="M70 24 L82 29 L70 34" /></g><g id="gametes"><g id="sperm-X"><circle id="sperm-X-circle" cx="109" cy="32" r="14.5" fill="#ded9ee" stroke="#8b8991" stroke-width="0.8" /><text id="sperm-X-letter" x="109" y="37" font-family="Atkinson Hyperlegible Next" font-size="17" font-style="normal" font-weight="400" text-anchor="middle" fill="#25343d">X</text></g><g id="sperm-Y"><circle id="sperm-Y-circle" cx="217" cy="32" r="14.5" fill="#ded9ee" stroke="#8b8991" stroke-width="0.8" /><text id="sperm-Y-letter" x="217" y="37" font-family="Atkinson Hyperlegible Next" font-size="17" font-style="normal" font-weight="400" text-anchor="middle" fill="#25343d">Y</text></g><g id="egg-X-1"><circle id="egg-X-1-circle" cx="33" cy="103" r="14.5" fill="#ecddc8" stroke="#8b8991" stroke-width="0.8" /><text id="egg-X-1-letter" x="33" y="108" font-family="Atkinson Hyperlegible Next" font-size="17" font-style="normal" font-weight="400" text-anchor="middle" fill="#25343d">X</text></g><g id="egg-X-2"><circle id="egg-X-2-circle" cx="33" cy="208" r="14.5" fill="#ecddc8" stroke="#8b8991" stroke-width="0.8" /><text id="egg-X-2-letter" x="33" y="213" font-family="Atkinson Hyperlegible Next" font-size="17" font-style="normal" font-weight="400" text-anchor="middle" fill="#25343d">X</text></g></g><g id="offspring"><g id="cell-1-1"><rect id="cell-1-1-body" x="58" y="52" width="105" height="105" fill="#efbea9" stroke="white" stroke-width="1.5" /><g id="cell-1-1-symbol" fill="none" stroke="#293a43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle id="cell-1-1-symbol-ring" cx="109" cy="83" r="11.2" /><path id="cell-1-1-symbol-extension" d="M109 94.2 V114 M101 106 H117" /></g><text id="cell-1-1-genotype" x="109" y="139" font-family="Atkinson Hyperlegible Next" font-size="19" font-style="normal" font-weight="400" text-anchor="middle" fill="#25343d">XX</text></g><g id="cell-1-2"><rect id="cell-1-2-body" x="163" y="52" width="105" height="105" fill="#c8dfef" stroke="white" stroke-width="1.5" /><g id="cell-1-2-symbol" fill="none" stroke="#293a43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle id="cell-1-2-symbol-ring" cx="214" cy="83" r="11.2" /><path id="cell-1-2-symbol-extension" d="M222 75 L237 60 M226 61 L237 60 L236 71" /></g><text id="cell-1-2-genotype" x="214" y="139" font-family="Atkinson Hyperlegible Next" font-size="19" font-style="normal" font-weight="400" text-anchor="middle" fill="#25343d">XY</text></g><g id="cell-2-1"><rect id="cell-2-1-body" x="58" y="157" width="105" height="105" fill="#efbea9" stroke="white" stroke-width="1.5" /><g id="cell-2-1-symbol" fill="none" stroke="#293a43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle id="cell-2-1-symbol-ring" cx="109" cy="188" r="11.2" /><path id="cell-2-1-symbol-extension" d="M109 199.2 V219 M101 211 H117" /></g><text id="cell-2-1-genotype" x="109" y="244" font-family="Atkinson Hyperlegible Next" font-size="19" font-style="normal" font-weight="400" text-anchor="middle" fill="#25343d">XX</text></g><g id="cell-2-2"><rect id="cell-2-2-body" x="163" y="157" width="105" height="105" fill="#c8dfef" stroke="white" stroke-width="1.5" /><g id="cell-2-2-symbol" fill="none" stroke="#293a43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle id="cell-2-2-symbol-ring" cx="214" cy="188" r="11.2" /><path id="cell-2-2-symbol-extension" d="M222 180 L237 165 M226 166 L237 165 L236 176" /></g><text id="cell-2-2-genotype" x="214" y="244" font-family="Atkinson Hyperlegible Next" font-size="19" font-style="normal" font-weight="400" text-anchor="middle" fill="#25343d">XY</text></g></g><g id="footer"><rect id="footer-box" x="40" y="273" width="243" height="53" fill="#dcebf4" stroke="#6a9eb7" stroke-width="1" /><text id="footer-line-1" x="161.5" y="294" font-family="Atkinson Hyperlegible Next" font-size="16" font-style="normal" font-weight="400" text-anchor="middle" fill="#25343d">The female (&#9792;) to male (&#9794;)</text><text id="footer-line-2" x="161.5" y="316" font-family="Atkinson Hyperlegible Next" font-size="16" font-style="normal" font-weight="400" text-anchor="middle" fill="#25343d">ratio is 1:1.</text></g></svg>
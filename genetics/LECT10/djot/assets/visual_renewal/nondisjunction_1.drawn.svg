<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Nondisjunction in meiosis 1</title>
<desc id="desc">Simplified lineage follows one homologous chromosome pair; other chromosomes are omitted. Blue and orange identify the two homologs. All four gamete products are shown.</desc>
<rect width="1200" height="650" fill="white"/>
<text x="130" y="110" font-family="Arial" font-size="25" text-anchor="middle" fill="#222">Replicated pair</text>
<text x="130" y="295" font-family="Arial" font-size="25" text-anchor="middle" fill="#222">After meiosis I</text>
<text x="130" y="495" font-family="Arial" font-size="25" text-anchor="middle" fill="#222">After meiosis II</text>
<g id="starting-pair">
<ellipse cx="740" cy="105" rx="70" ry="54" fill="#F3F6F8" stroke="#647681" stroke-width="2"/>
<path d="M 714.5,78 Q 733.5,105 714.5,132 M 734.5,78 Q 715.5,105 734.5,132" fill="none" stroke="#076DAD" stroke-width="9" stroke-linecap="round"/>
<circle cx="724.5" cy="105" r="5" fill="#222"/>
<path d="M 745.5,78 Q 764.5,105 745.5,132 M 765.5,78 Q 746.5,105 765.5,132" fill="none" stroke="#B74300" stroke-width="9" stroke-linecap="round"/>
<circle cx="755.5" cy="105" r="5" fill="#222"/>
</g>
<path d="M700,165 L500,226 M495,218 L500,226 L505,218" fill="none" stroke="#647681" stroke-width="3"/>
<path d="M780,165 L980,226 M975,218 L980,226 L985,218" fill="none" stroke="#647681" stroke-width="3"/>

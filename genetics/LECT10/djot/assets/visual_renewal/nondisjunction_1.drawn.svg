<path d="M 505.5,263 Q 524.5,290 505.5,317 M 525.5,263 Q 506.5,290 525.5,317" fill="none" stroke="#B74300" stroke-width="9" stroke-linecap="round"/>
<circle cx="515.5" cy="290" r="5" fill="#222"/>
</g>

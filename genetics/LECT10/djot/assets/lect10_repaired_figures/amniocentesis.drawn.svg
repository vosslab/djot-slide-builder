<?xml version='1.0' encoding='us-ascii'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
 <title id="title">Amniocentesis</title>
 <desc id="description">A cutaway uterus with a curled fetus and placenta. A needle ends in amniotic fluid. Centrifugation separates fluid from fetal cells. Fluid leads to biochemical tests in Several hours. Cells enter a culture dish, then biochemical tests and schematic karyotyping in Several weeks. Anatomy, equipment and chromosome icon are schematic and not to scale. The chromosome icon is not a patient result.</desc>
 <metadata id="provenance">Original geometry drawn for this repository, 2026-11-09. Teaching labels and workflow preserved from genetics/LECT10/djot/assets/lect10_repaired_figures/amniocentesis.svg; reference artwork credit: Copyright 2006 Pearson Education, Inc., publishing as Pearson Benjamin Cummings. That source credit does not attribute this new geometry to Pearson. Source preserved unchanged. No clinical timing updates or diagnostic claims added. Landscape composition derived from accepted repository original-art parent under _temp/svg_prenatal_sampling_art; anatomy and equipment path geometry retained, labels and workflow repositioned. Parent hashes recorded in adjacent freeze.json.</metadata>

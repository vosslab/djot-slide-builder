<svg xmlns="http://www.w3.org/2000/svg" width="1158" height="614" viewBox="0 0 1158 614" role="img" aria-labelledby="title desc">
<title id="title">SKY probe mixture workflow</title>
<desc id="desc">Six representative flow-sorted chromosome tubes feed six labeled probe tubes, followed by a mixed probe tube and hybridization on a metaphase preparation slide. The mixed colors are schematic, not measured quantities.</desc>

<title id="title">Chromosome copy number across four ploidy levels</title>
<desc id="desc">Haploid, diploid, triploid and tetraploid groups contain one, two, three and four copies respectively of each of three chromosome types. Independent continuous rods retain their type-specific length and primary constriction.</desc>

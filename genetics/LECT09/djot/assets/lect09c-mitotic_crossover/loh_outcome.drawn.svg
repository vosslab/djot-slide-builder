<svg xmlns="http://www.w3.org/2000/svg" width="660" height="515" viewBox="0 0 660 515" role="img" aria-labelledby="loh_outcome-title loh_outcome-desc">
<title id="loh_outcome-title">Copy-neutral loss of heterozygosity after crossover</title>
<desc id="loh_outcome-desc">Starting diploid A/a cell before replication, then A/A and a/a daughter cells after replication, one crossover between the centromere and marker, and the LOH-producing segregation. The four-chromatid intermediate is omitted. Each daughter retains two centromeres; proximal origin colors differ while distal marker alleles match. Other segregation outcomes can retain heterozygosity.</desc>
<defs><marker id="loh_outcome-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#677585"/></marker></defs>
<g font-family="Liberation Sans, sans-serif"><ellipse cx="125" cy="260" rx="110" ry="118" fill="#F0F3F7" stroke="#A7B2BE" stroke-width="3"/><text x="125" y="185" font-size="40" fill="#202B38" text-anchor="middle">A/a</text><g id="loh-parent-A"><path d="M52 245 H197" stroke="#24578F" stroke-width="17" stroke-linecap="round"/><path d="M117 245 H197" stroke="#24578F" stroke-width="17" stroke-linecap="round"/><circle cx="74" cy="245" r="11" fill="#24578F" stroke="white" stroke-width="2"/><text x="177" y="226" font-size="32" fill="#202B38" text-anchor="middle">A</text></g><g id="loh-parent-a"><path d="M52 302 H197" stroke="#B74300" stroke-width="17" stroke-linecap="round"/><path d="M117 302 H197" stroke="#B74300" stroke-width="17" stroke-linecap="round"/><circle cx="74" cy="302" r="11" fill="#B74300" stroke="white" stroke-width="2"/><text x="177" y="283" font-size="32" fill="#202B38" text-anchor="middle">a</text></g><path d="M245 233 L390 137" fill="none" stroke="#677585" stroke-width="4" marker-end="url(#loh_outcome-arrow)"/><path d="M245 290 L390 375" fill="none" stroke="#677585" stroke-width="4" marker-end="url(#loh_outcome-arrow)"/><ellipse cx="520" cy="126" rx="125" ry="110" fill="#E9F0F8" stroke="#24578F" stroke-width="3"/><text x="520" y="57" font-size="40" fill="#202B38" text-anchor="middle">A/A</text><g id="loh-daughter-AA-1"><path d="M448 111 H593" stroke="#24578F" stroke-width="17" stroke-linecap="round"/><path d="M513 111 H593" stroke="#24578F" stroke-width="17" stroke-linecap="round"/><circle cx="470" cy="111" r="11" fill="#24578F" stroke="white" stroke-width="2"/><text x="573" y="92" font-size="32" fill="#202B38" text-anchor="middle">A</text></g><g id="loh-daughter-AA-2"><path d="M448 168 H593" stroke="#B74300" stroke-width="17" stroke-linecap="round"/><path d="M513 168 H593" stroke="#24578F" stroke-width="17" stroke-linecap="round"/><circle cx="470" cy="168" r="11" fill="#B74300" stroke="white" stroke-width="2"/><text x="573" y="149" font-size="32" fill="#202B38" text-anchor="middle">A</text></g><ellipse cx="520" cy="386" rx="125" ry="110" fill="#FFF0E7" stroke="#B74300" stroke-width="3"/><text x="520" y="317" font-size="40" fill="#202B38" text-anchor="middle">a/a</text><g id="loh-daughter-aa-1"><path d="M448 371 H593" stroke="#B74300" stroke-width="17" stroke-linecap="round"/><path d="M513 371 H593" stroke="#B74300" stroke-width="17" stroke-linecap="round"/><circle cx="470" cy="371" r="11" fill="#B74300" stroke="white" stroke-width="2"/><text x="573" y="352" font-size="32" fill="#202B38" text-anchor="middle">a</text></g><g id="loh-daughter-aa-2"><path d="M448 428 H593" stroke="#24578F" stroke-width="17" stroke-linecap="round"/><path d="M513 428 H593" stroke="#B74300" stroke-width="17" stroke-linecap="round"/><circle cx="470" cy="428" r="11" fill="#24578F" stroke="white" stroke-width="2"/><text x="573" y="409" font-size="32" fill="#202B38" text-anchor="middle">a</text></g></g></svg>

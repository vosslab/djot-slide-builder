<svg xmlns="http://www.w3.org/2000/svg" width="660" height="490" viewBox="0 0 660 490" role="img" aria-labelledby="repair_templates-title repair_templates-desc">
<title id="repair_templates-title">Two possible homologous repair templates</title>
<desc id="repair_templates-desc">Conceptual chromosome segments, not to scale. A damaged A chromatid has an A sister and an a homolog. The dashed arrow denotes using the sister as a template. Break repair and crossover intermediates are omitted.</desc>
<defs><marker id="repair_templates-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#677585"/></marker></defs>
<g font-family="Liberation Sans, sans-serif"><text x="30" y="48" font-size="30" fill="#202B38" text-anchor="start">Damaged chromatid</text><g id="repair-damaged"><path d="M385 85 H445 M467 85 H530" stroke="#24578F" stroke-width="17" stroke-linecap="round"/><path d="M451 63 l12 11 -12 11 12 11" fill="none" stroke="#B61F32" stroke-width="4"/><circle cx="407" cy="85" r="11" fill="#24578F" stroke="white" stroke-width="2"/><text x="510" y="66" font-size="32" fill="#202B38" text-anchor="middle">A</text></g><text x="30" y="205" font-size="30" fill="#202B38" text-anchor="start">Sister copy</text><g id="repair-sister"><path d="M385 240 H530" stroke="#24578F" stroke-width="17" stroke-linecap="round"/><path d="M450 240 H530" stroke="#24578F" stroke-width="17" stroke-linecap="round"/><circle cx="407" cy="240" r="11" fill="#24578F" stroke="white" stroke-width="2"/><text x="510" y="221" font-size="32" fill="#202B38" text-anchor="middle">A</text></g><path d="M455 202 L455 119" fill="none" stroke="#677585" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#repair_templates-arrow)"/><text x="30" y="356" font-size="30" fill="#202B38" text-anchor="start">Other homolog</text><g id="repair-homolog"><path d="M385 390 H530" stroke="#B74300" stroke-width="17" stroke-linecap="round"/><path d="M450 390 H530" stroke="#B74300" stroke-width="17" stroke-linecap="round"/><circle cx="407" cy="390" r="11" fill="#B74300" stroke="white" stroke-width="2"/><text x="510" y="371" font-size="32" fill="#202B38" text-anchor="middle">a</text></g><text x="330" y="468" font-size="27" fill="#202B38" text-anchor="middle">After DNA replication</text></g></svg>

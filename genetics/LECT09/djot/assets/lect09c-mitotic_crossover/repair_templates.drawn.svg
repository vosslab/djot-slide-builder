<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="490" viewBox="0 0 660 490" role="img" aria-labelledby="repair_templates-title repair_templates-desc">
<title id="repair_templates-title">Two possible homologous repair templates</title>
<desc id="repair_templates-desc">Conceptual chromosome segments, not to scale. A damaged A chromatid has an A sister and an a homolog. The dashed arrow denotes using the sister as a template. Break repair and crossover intermediates are omitted.</desc>
<defs><marker id="repair_templates-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#677585" /></marker></defs>
<g font-family="Atkinson Hyperlegible Next, sans-serif"><text x="30" y="48" font-size="30" fill="#202B38" text-anchor="start">Damaged chromatid</text><g id="repair-damaged"><g clip-path="url(#repair-break-clip)"><defs><clipPath id="repair-break-clip"><rect x="370" y="70" width="75" height="30" /><rect x="467" y="70" width="78" height="30" /></clipPath></defs><g id="shared-repair-damaged"><path d="M 385.0,85.0 L 530.0,85.0" fill="none" stroke="#344651" stroke-width="17.595" stroke-linecap="round" stroke-linejoin="round" /><path d="M 385.0,85.0 L 530.0,85.0" fill="none" stroke="#24578F" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" /><g id="shared-repair-damaged-region-0" data-source-label=""><path d="M 385.0,85.0 L 530.0,85.0" fill="none" stroke="#24578F" stroke-width="17" stroke-linecap="butt" stroke-linejoin="round" /></g><circle cx="385.0" cy="85.0" r="8.5" fill="#24578F" /><circle cx="530.0" cy="85.0" r="8.5" fill="#24578F" /></g></g><path d="M451 63 l12 11 -12 11 12 11" fill="none" stroke="#B61F32" stroke-width="4" /><g transform="translate(407 85)"><ellipse id="shared-marker-1-centromere" cx="0" cy="0" rx="7.524590163934426" ry="13.934426229508198" fill="none" stroke="#72508C" stroke-width="0.765" /></g><text x="510" y="66" font-size="32" fill="#202B38" text-anchor="middle">A</text></g><text x="30" y="205" font-size="30" fill="#202B38" text-anchor="start">Sister copy</text><g id="repair-sister"><g id="shared-repair-sister"><path d="M 385.0,240.0 L 530.0,240.0" fill="none" stroke="#344651" stroke-width="17.595" stroke-linecap="round" stroke-linejoin="round" /><path d="M 385.0,240.0 L 530.0,240.0" fill="none" stroke="#24578F" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" /><g id="shared-repair-sister-region-0" data-source-label=""><path d="M 385.0,240.0 L 530.0,240.0" fill="none" stroke="#24578F" stroke-width="17" stroke-linecap="butt" stroke-linejoin="round" /></g><circle cx="385.0" cy="240.0" r="8.5" fill="#24578F" /><circle cx="530.0" cy="240.0" r="8.5" fill="#24578F" /></g><g transform="translate(407 240)"><ellipse id="shared-marker-2-centromere" cx="0" cy="0" rx="7.524590163934426" ry="13.934426229508198" fill="none" stroke="#72508C" stroke-width="0.765" /></g><text x="510" y="221" font-size="32" fill="#202B38" text-anchor="middle">A</text></g><path d="M455 202 L455 119" fill="none" stroke="#677585" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#repair_templates-arrow)" /><text x="30" y="356" font-size="30" fill="#202B38" text-anchor="start">Other homolog</text><g id="repair-homolog"><g id="shared-repair-homolog"><path d="M 385.0,390.0 L 530.0,390.0" fill="none" stroke="#344651" stroke-width="17.595" stroke-linecap="round" stroke-linejoin="round" /><path d="M 385.0,390.0 L 530.0,390.0" fill="none" stroke="#B74300" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" /><g id="shared-repair-homolog-region-0" data-source-label=""><path d="M 385.0,390.0 L 530.0,390.0" fill="none" stroke="#B74300" stroke-width="17" stroke-linecap="butt" stroke-linejoin="round" /></g><circle cx="385.0" cy="390.0" r="8.5" fill="#B74300" /><circle cx="530.0" cy="390.0" r="8.5" fill="#B74300" /></g><g transform="translate(407 390)"><ellipse id="shared-marker-3-centromere" cx="0" cy="0" rx="7.524590163934426" ry="13.934426229508198" fill="none" stroke="#72508C" stroke-width="0.765" /></g><text x="510" y="371" font-size="32" fill="#202B38" text-anchor="middle">a</text></g><text x="330" y="468" font-size="27" fill="#202B38" text-anchor="middle">After DNA replication</text></g></svg>
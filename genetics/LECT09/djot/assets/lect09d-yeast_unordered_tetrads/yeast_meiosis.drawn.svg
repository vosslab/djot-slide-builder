<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1260" viewBox="0 0 700 1260" role="img" aria-labelledby="title desc">
<title id="title">One meiosis, one ascus</title>
<desc id="desc">Source image_009.jpg. A and a are alleles of one schematic homologous chromosome pair, not yeast mating types. Chromosome duplication precedes homolog segregation at meiosis I and sister segregation at meiosis II. Four chromatids enter four ascospores in one ascus. Schematic, not to scale. Original vector construction based on lecture source relationships.</desc>

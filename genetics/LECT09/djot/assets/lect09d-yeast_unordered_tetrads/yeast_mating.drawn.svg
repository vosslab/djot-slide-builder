<title id="title">Haploid yeast cells mate</title>
<desc id="desc">One connected cell envelope encloses two separate haploid nuclei, a and alpha, after cytoplasmic fusion and before nuclear fusion. Schematic, not to scale. Original vector construction based on lecture source relationships.</desc>

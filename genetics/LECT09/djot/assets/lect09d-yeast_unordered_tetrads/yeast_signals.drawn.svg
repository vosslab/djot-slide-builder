<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Exchange of mating factors</title>
<desc id="desc">An a cell sends a factor toward the alpha cell receptor; alpha factor travels back to the a cell. Triangular alpha factors and round a factors match their recipient receptors. Schematic, not to scale. Original vector construction based on lecture source relationships.</desc>
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0.8" y2="1" gradientUnits="objectBoundingBox">
<stop offset="0" stop-color="#FFF9E7"/><stop offset="0.55" stop-color="#F7E4B2"/>
<stop offset="1" stop-color="#DDB973"/></linearGradient>
<linearGradient id="sac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1F7EF"/>
<stop offset="1" stop-color="#C6DFD2"/></linearGradient>
<marker id="arrow" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto"
markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#526879"/></marker>
</defs>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">Yeast life cycle reference</title>
<desc id="desc">Compatible a and alpha haploids mate and undergo nuclear fusion. Both haploid types and the diploid zygote reproduce by budding. Diploid meiosis and sporulation produce four haploid ascospores in one ascus. Release and germination return to haploid growth. Cycle source: image_005.jpg. Schematic, not to scale. Original vector construction based on lecture source relationships.</desc>

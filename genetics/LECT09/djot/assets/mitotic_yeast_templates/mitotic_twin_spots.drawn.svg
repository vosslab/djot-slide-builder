    </svg:g>
    <svg:g id="input-green-recombinant" data-allele="aB" data-proximal="green" data-distal="blue">
      <svg:g data-body-slot="shared-input-green-recombinant"/>
    </svg:g>
    <svg:g id="input-blue-recombinant" data-allele="Ab" data-proximal="blue" data-distal="green">

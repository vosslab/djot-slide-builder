<?xml version="1.0" encoding="utf-8"?>
<svg:svg xmlns:svg="http://www.w3.org/2000/svg" width="660" height="515" viewBox="0 0 660 515" role="img" aria-labelledby="loh_outcome-title loh_outcome-desc">
  <svg:title id="loh_outcome-title">Copy-neutral loss of heterozygosity after crossover</svg:title>
  <svg:desc id="loh_outcome-desc">Starting diploid A/a cell before replication, then A/A and a/a daughter cells after replication, one crossover between the centromere and marker, and the LOH-producing segregation. The four-chromatid intermediate is omitted. Each daughter retains two centromeres; proximal origin colors differ while distal marker alleles match. Other segregation outcomes can retain heterozygosity.</svg:desc>
  <svg:defs>
    <svg:marker id="loh_outcome-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <svg:path d="M0 0 L10 5 L0 10 Z" fill="#677585"/>
    </svg:marker>
  </svg:defs>
  <svg:g font-family="Atkinson Hyperlegible Next, sans-serif">
    <svg:ellipse cx="125" cy="260" rx="110" ry="118" fill="#F0F3F7" stroke="#A7B2BE" stroke-width="3"/>
    <svg:text x="125" y="185" font-size="40" fill="#202B38" text-anchor="middle">A/a</svg:text>
    <svg:g id="loh-parent-A">
      <svg:g data-body-slot="shared-loh-parent-A"/>
      <svg:g transform="translate(74 245)">
        <svg:g data-marker-slot="shared-marker-1"/>
      </svg:g>
    </svg:g>
    <svg:g id="loh-parent-a">
      <svg:g data-body-slot="shared-loh-parent-a"/>
      <svg:g transform="translate(74 302)">
        <svg:g data-marker-slot="shared-marker-2"/>
      </svg:g>
    </svg:g>
    <svg:path d="M245 233 L390 137" fill="none" stroke="#677585" stroke-width="4" marker-end="url(#loh_outcome-arrow)"/>
    <svg:path d="M245 290 L390 375" fill="none" stroke="#677585" stroke-width="4" marker-end="url(#loh_outcome-arrow)"/>
    <svg:ellipse cx="520" cy="126" rx="125" ry="110" fill="#E9F0F8" stroke="#24578F" stroke-width="3"/>
    <svg:text x="520" y="57" font-size="40" fill="#202B38" text-anchor="middle">A/A</svg:text>
    <svg:g id="loh-daughter-AA-1">
      <svg:g data-body-slot="shared-loh-daughter-AA-1"/>
      <svg:g transform="translate(470 111)">
        <svg:g data-marker-slot="shared-marker-3"/>
      </svg:g>
    </svg:g>
    <svg:g id="loh-daughter-AA-2">
      <svg:g data-body-slot="shared-loh-daughter-AA-2"/>

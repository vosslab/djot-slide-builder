<?xml version='1.0' encoding='utf-8'?>
<svg:svg xmlns:svg="http://www.w3.org/2000/svg" width="660" height="490" viewBox="0 0 660 490" role="img" aria-labelledby="repair_templates-title repair_templates-desc">
<svg:title id="repair_templates-title">Two possible homologous repair templates</svg:title>
<svg:desc id="repair_templates-desc">Conceptual chromosome segments, not to scale. A damaged A chromatid has an A sister and an a homolog. The dashed arrow denotes using the sister as a template. Break repair and crossover intermediates are omitted.</svg:desc>
<svg:defs><svg:marker id="repair_templates-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><svg:path d="M0 0 L10 5 L0 10 Z" fill="#677585" /></svg:marker></svg:defs>
<svg:g font-family="Atkinson Hyperlegible Next, sans-serif"><svg:text x="30" y="48" font-size="30" fill="#202B38" text-anchor="start">Damaged chromatid</svg:text><svg:g id="repair-damaged"><svg:g clip-path="url(#repair-break-clip)"><svg:defs><svg:clipPath id="repair-break-clip"><svg:rect x="370" y="70" width="75" height="30" /><svg:rect x="467" y="70" width="78" height="30" /></svg:clipPath></svg:defs><svg:g data-body-slot="shared-repair-damaged" /></svg:g><svg:path d="M451 63 l12 11 -12 11 12 11" fill="none" stroke="#B61F32" stroke-width="4" /><svg:g transform="translate(407 85)"><svg:g data-marker-slot="shared-marker-1" /></svg:g><svg:text x="510" y="66" font-size="32" fill="#202B38" text-anchor="middle">A</svg:text></svg:g><svg:text x="30" y="205" font-size="30" fill="#202B38" text-anchor="start">Sister copy</svg:text><svg:g id="repair-sister"><svg:g data-body-slot="shared-repair-sister" /><svg:g transform="translate(407 240)"><svg:g data-marker-slot="shared-marker-2" /></svg:g><svg:text x="510" y="221" font-size="32" fill="#202B38" text-anchor="middle">A</svg:text></svg:g><svg:path d="M455 202 L455 119" fill="none" stroke="#677585" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#repair_templates-arrow)" /><svg:text x="30" y="356" font-size="30" fill="#202B38" text-anchor="start">Other homolog</svg:text><svg:g id="repair-homolog"><svg:g data-body-slot="shared-repair-homolog" /><svg:g transform="translate(407 390)"><svg:g data-marker-slot="shared-marker-3" /></svg:g><svg:text x="510" y="371" font-size="32" fill="#202B38" text-anchor="middle">a</svg:text></svg:g><svg:text x="330" y="468" font-size="27" fill="#202B38" text-anchor="middle">After DNA replication</svg:text></svg:g></svg:svg>
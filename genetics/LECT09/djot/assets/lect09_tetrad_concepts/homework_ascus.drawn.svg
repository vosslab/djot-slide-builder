<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="figure-title figure-description" width="520" height="460" viewBox="0 0 520 460" role="img"><title id="figure-title">One Ascus, Four Haploid Spores</title><desc id="figure-description">The generator's unordered ascus contains four spores, with genotypes ++c, +bc, a++, and ab+. Leaders label the surrounding sac and one ascospore. Colors represent alleles, not real pigmentation. Spore positions carry no meiotic-order information; the drawing is schematic and not to scale.</desc><svg width="440" height="339.0163934426229" viewBox="0 0 122 94" role="img" aria-label="Unordered ascus: ++c, a++, +bc, ab+" x="40" y="50" preserveAspectRatio="xMidYMid meet"><desc>Each recessive allele contributes its own color; plus alleles remain neutral. Slightly overlapping spores are schematic, not observed pigmentation or meiotic order.</desc><metadata>Packed-spore inspiration: https://commons.wikimedia.org/wiki/File:Ascus.gif , public domain micrograph uploaded by Rasbak, originally Pthorpe. New schematic geometry and gene colors.</metadata><path fill="#F8F5E9" stroke="#918775" stroke-width="2" d="M15 47 C10 19 27 9 56 9 C88 5 110 16 111 42 C118 72 99 88 72 88 C42 92 13 80 15 47Z" /><path fill="none" stroke="#D8D5C8" stroke-width="1.2" d="M19 48 C14 22 31 13 57 13 C86 10 105 19 107 43 C113 68 97 83 72 84 C43 87 17 77 19 48Z" /><g data-genotype="++c" transform="translate(42 31)"><ellipse fill="#ECEBE5" rx="20" ry="18" /><g data-gene="c" fill="#003FFF" stroke="#003FFF"><path fill-opacity=".6" stroke="none" d="M0 0 L-17.321 9.000 A20 18 0 0 1 -0.000 -18.000Z" /></g><path fill="#493215" opacity=".10" d="M-20 0 C-17 14 9 19 19 -4 A20 18 0 0 1 -20 0Z" /><ellipse fill="none" stroke="#71644F" stroke-width="1.2" rx="20" ry="18" /><path fill="none" stroke="#FFF" stroke-width="2.3" stroke-linecap="round" opacity=".85" d="M-14 -6 Q-10 -14 -2 -14" /><text text-anchor="middle" font-family="monospace" font-size="14.5" font-weight="bold" y="4" str
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">No crossover or one crossover before meiosis</title>
  <desc id="figure-description">Two replicated homologs carry two A and two a copies. The FDS model has no crossover between the gene and centromere. The SDS model has one crossover between two nonsister chromatids. The gene labels remain A A a a across the paired structure. Meiosis I follows.</desc>
  <metadata id="provenance">Original editable schematic after source slide 57. Source: genetics/LECT09/lect09b-tetrads_1_introduction.odp, source art in ordered_before_meiosis.svg, ordered_meiosis_ii.svg and ordered_mitosis.svg. Unmeasured. A is green, a is purple. Source and stage ledger: SOURCE_STATE.json. Reconstruction 2026-11-09.</metadata>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-labelledby="figure-title figure-description" width="650" height="295" viewBox="0 0 650 295" role="img"><title id="figure-title">Exchange of Mating Factors</title><desc id="figure-description">Original yeast artwork at its undistorted pixel proportions, with editable labels. The three-slide sequence shows compatible a and alpha haploids, mating, and a diploid a/alpha cell.</desc><defs><clipPath id="figure-viewport"><rect width="650" height="295" /></clipPath></defs><g clip-path="url(#figure-viewport)"><image x="55" y="40" width="563" height="647" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/webp;base64," /></g><circle cx="16" cy="98" r="13" fill="#24578F" /><text x="16" y="105" font-family="Atkinson Hyperlegible Next" font-size="19" font-weight="bold" text-anchor="middle" fill="white">1</text><text x="38" y="105" font-family="Atkinson Hyperlegible Next" font-size="20" font-weight="bold" text-anchor="start" fill="#1D2433">Exchange</text><text x="38" y="129" font-family="Atkinson Hyperlegible Next" font-size="20" font-weight="bold" text-anchor="start" fill="#1D2433">of Mating</text><text x="38" y="153" font-family="Atkinson Hyperlegible Next" font-size="20" font-weight="bold" text-anchor="start" fill="#1D2433">Factors</text><text x="290" y="28" font-family="Atkinson Hyperlegible Next" font-size="20" font-weight="bold" text-anchor="middle" fill="#1D2433">Receptor</text><line x1="330" y1="34" x2="355" y2="102" stroke="#1D2433" stroke-width="1.5" /><text x="459" y="28" font-family="Atkinson Hyperlegible Next" font-size="20" font-weight="bold" text-anchor="middle" fill="#1D2433">&#945; Factor</text><line x1="448" y1="34" x2="434" y2="70" stroke="#1D2433" stroke-width="1.5" /><text x="295" y="162" font-family="Atkinson Hyperlegible Next" font-size="27" font-weight="bold" text-anchor="middle" fill="#1D2433">a</text><text x="532" y="162" font-family="Atkinson Hyperlegible Next" font-size="27" font-weight="bold" text-anchor="middle" fill="#1D2433">&#945;</text><text x="295" y="250" font-family="Atkinson Hyperlegible Next" font-size="20" font-weight="bold" text-anchor="middle" fill="#1D2433">Yeast Cell,</text><text x="295" y="274" font-family="Atkinson Hyperlegible Next" font-size="20" font-weight="bold" text-anchor="middle" fill="#1D2433">Mating Type a</text><text x="532" y="250" font-family="Atkinson Hyperlegible Next" font-size="20" font-weight="bold" text-anchor="middle" fill="#1D2433">Yeast Cell,</text><text x="532" y="274" font-family="Atkinson Hyperlegible Next" font-size="20" font-weight="bold" text-anchor="middle" fill="#1D2433">Mating Type &#945;</text><text x="409" y="256" font-family="Atkinson Hyperlegible Next" font-size="19" font-weight="bold" text-anchor="middle" fill="#1D2433">a Factor</text><line x1="405" y1="235" x2="400" y2="215" stroke="#1D2433" stroke-width="1.5" /><metadata>Art: original embedded 563 x 647 bitmap from the lecture figure. Equal x/y pixel scale; each viewport focuses on its current stage. Original cells, factor arrows, and progression arrows retained; live labels repositioned. Drawing references: biological illustration handbook, Clarity; Mastering SVG, viewBox.</metadata></svg>
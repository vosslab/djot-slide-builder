<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Physical and genetic distances across a heterochromatic region</title>
<desc id="desc">Genetics LECT09B source slide 35. Physical chromosome is schematic; central heterochromatin occupies 25 percent of its length. Genetic positions are net 0, pr 54.5, cn 57.5 and sp 107 cM. Adjacent intervals are 54.5, 3.0 and 49.5 cM. No base-pair scale is implied.</desc>

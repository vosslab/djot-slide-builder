<svg xmlns="http://www.w3.org/2000/svg" width="620" height="520" viewBox="0 0 620 520" role="img" aria-labelledby="title desc">
<title id="title">Loose and dense chromatin packaging</title>
<desc id="desc">Genetics LECT09B source slide 34. Simplified nucleosomes connected by DNA, spaced apart in euchromatin and packed together in heterochromatin. Schematic packing, not a fixed higher-order chromatin structure or measured scale.</desc>
<rect width="620" height="520" fill="white"/>
<defs><g id="nucleosome"><ellipse rx="24" ry="31" fill="#B8DEEF" stroke="#076DAD" stroke-width="3"/><path d="M -22 -20 C -40 0 6 43 25 13 M -21 -30 C -42 -4 6 33 28 3" fill="none" stroke="#20252B" stroke-width="4"/></g></defs>
<g id="euchromatin"><text x="310" y="40" font-family="Arial" font-size="31" text-anchor="middle" fill="#076DAD" >Euchromatin</text><path d="M 40 150 C 75 55 130 195 170 138 S 255 75 295 140 S 380 195 420 140 S 500 85 555 140" fill="none" stroke="#20252B" stroke-width="4"/><use href="#nucleosome" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#nucleosome" transform="translate(85 122) rotate(-30)"/><use href="#nucleosome" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#nucleosome" transform="translate(200 121) rotate(-30)"/><use href="#nucleosome" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#nucleosome" transform="translate(315 155) rotate(-30)"/><use href="#nucleosome" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#nucleosome" transform="translate(440 125) rotate(-30)"/><use href="#nucleosome" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#nucleosome" transform="translate(550 136) rotate(-30)"/><text x="310" y="225" font-family="Arial" font-size="26" text-anchor="middle" fill="#20252B" >Loosely packed</text></g>
<g id="heterochromatin"><text x="310" y="300" font-family="Arial" font-size="31" text-anchor="middle" fill="#076DAD" >Heterochromatin</text><path d="M 145 370 L 420 370 Q 465 370 450 415 L 170 415" fill="none" stroke="#20252B" stroke-width="4"/><use href="#nucleosome" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#nucleosome" transform="translate(170 370) rotate(-30)"/><use href="#nucleosome" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#nucleosome" transform="translate(225 370) rotate(-30)"/><use href="#nucleosome" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#nucleosome" transform="translate(280 370) rotate(-30)"/><use href="#nucleosome" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#nucleosome" transform="translate(335 370) rotate(-30)"/><use href="#nucleosome" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#nucleosome" transform="translate(390 370) rotate(-30)"/><use href="#nucleosome" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#nucleosome" transform="translate(445 415) rotate(-30)"/><use href="#nucleosome" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#nucleosome" transform="translate(390 415) rotate(-30)"/><use href="#nucleosome" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#nucleosome" transform="translate(335 415) rotate(-30)"/><use href="#nucleosome" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#nucleosome" transform="translate(280 415) rotate(-30)"/><use href="#nucleosome" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#nucleosome" transform="translate(225 415) rotate(-30)"/><use href="#nucleosome" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#nucleosome" transform="translate(170 415) rotate(-30)"/><text x="310" y="490" font-family="Arial" font-size="26" text-anchor="middle" fill="#20252B" >Densely packed</text></g>

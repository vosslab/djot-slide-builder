<svg xmlns="http://www.w3.org/2000/svg" width="826" height="456" viewBox="0 0 826 456" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Mitotic twin-spot outcomes</title>
<desc id="figure-desc">Two replicated homologs carry aB and Ab in trans. The inner nonsisters exchange distal material at one breakpoint proximal to both loci. The two rows are alternative daughter-cell pairs: two heterozygotes, or homozygous aa and homozygous bb twin spots. Colors encode chromosome ancestry; positions and shapes are schematic.</desc>

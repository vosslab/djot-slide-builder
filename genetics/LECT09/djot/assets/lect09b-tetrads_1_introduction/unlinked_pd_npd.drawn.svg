<svg xmlns="http://www.w3.org/2000/svg" width="1469" height="1021" viewBox="0 0 1469 1021" role="img" aria-labelledby="title description">
<title id="title">Unlinked genes: parental and nonparental ditypes</title><desc id="description">Two alternative arrangements without crossing over. Each row has two homologous pairs, four replicated chromosomes and eight chromatids. The upper ascus contains AB, AB, ab, ab; the lower contains Ab, Ab, aB, aB. Each ascus contains four unordered spores. Schematic, not measured.</desc>

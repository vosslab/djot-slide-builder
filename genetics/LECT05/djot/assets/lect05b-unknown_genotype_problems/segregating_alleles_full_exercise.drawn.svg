<svg xmlns="http://www.w3.org/2000/svg" width="805" height="668" viewBox="0 0 805 668" role="img" aria-labelledby="title desc"><title id="title">Segregating alleles gel exercise</title><desc id="desc">Source parent and progeny band patterns with original exercise wording; no added answers.</desc><rect width="805" height="668" fill="white" /><rect x="5" y="1" width="795" height="226" rx="8" fill="#f6f3fa" /><g id="stem" font-family="Atkinson Hyperlegible Next" font-size="28" font-style="normal" font-weight="400" fill="#202b2e"><text x="12" y="29" font-weight="700" fill="#8d292f">3.11</text><g id="stem-prose"><text x="78" y="29" xml:space="preserve">The gel diagram below shows the banding patterns </text><text x="78" y="64" xml:space="preserve">observed among the progeny of a cross between </text><text x="78" y="99" xml:space="preserve">double heterozygous genotypes shown at the left (P1 </text><text x="78" y="134" xml:space="preserve">and P2). On the right are shown the patterns of bands </text><text x="78" y="169" xml:space="preserve">observed among the progeny. The bands are </text><text x="78" y="204" xml:space="preserve">numbered 1&#8211;4.</text></g></g><g id="gel-placement" transform="translate(70 245)"><g id="shared-gel"><g id="slab-construction" stroke="#2880b1" stroke-width="1.3" stroke-linejoin="round"><path id="parents-depth" d="M 186 5 L 189 2 V 177 L 186 180 Z" fill="#a4cde3" /><path id="parents-open-wells" d="M 77 5 H 94 V 29 H 124 V 5 H 140 V 29 H 170 V 5 H 186 V 180 H 77 Z" fill="#c7e1ef" /><path id="parents-top-rim" d="M 79 7 H 92" stroke="#eff9fc" fill="none" /><path id="progeny-depth" d="M 650 5 L 653 2 V 177 L 650 180 Z" fill="#a4cde3" /><path id="progeny-open-wells" d="M 217 5 H 233 V 29 H 264 V 5 H 279 V 29 H 310 V 5 H 326 V 29 H 356 V 5 H 372 V 29 H 402 V 5 H 418 V 29 H 449 V 5 H 465 V 29 H 495 V 5 H 511 V 29 H 541 V 5 H 557 V 29 H 588 V 5 H 604 V 29 H 634 V 5 H 650 V 180 H 217 Z" fill="#c7e1ef" /><path id="progeny-top-rim" d="M 219 7 H 231" stroke="#eff9fc" fill="none" /></g><g id="bands" fill="#790b86"><rect id="band-01" x="94" y="56" width="30" height="7" /><rect id="band-02" x="140" y="56" width="30" height="7" /><rect id="band-03" x="233" y="56" width="31" height="7" /><rect id="band-04" x="279" y="56" width="31" height="7" /><rect id="band-05" x="372" y="56" width="31" height="7" /><rect id="band-06" x="464" y="56" width="31" height="7" /><rect id="band-07" x="511" y="56" width="31" height="7" /><rect id="band-08" x="603" y="56" width="31" height="7" /><rect id="band-09" x="94" y="85" width="30" height="7" /><rect id="band-10" x="140" y="85" width="30" height="7" /><rect id="band-11" x="233" y="85" width="31" height="7" /><rect id="band-12" x="279" y="85" width="31" height="7" /><rect id="band-13" x="372" y="85" width="31" height="7" /><rect id="band-14" x="418" y="85" width="31" height="7" /><rect id="band-15" x="511" y="85" width="31" height="7" /><rect id="band-16" x="557" y="85" width="31" height="7" /><rect id="band-17" x="94" y="115" width="30" height="7" /><rect id="band-18" x="140" y="115" width="30" height="7" /><rect id="band-19" x="233" y="115" width="31" height="7" /><rect id="band-20" x="325" y="115" width="31" height="7" /><rect id="band-21" x="372" y="115" width="31" height="7" /><rect id="band-22" x="418" y="115" width="31" height="7" /><rect id="band-23" x="464" y="115" width="31" height="7" /><rect id="band-24" x="557" y="115" width="31" height="7" /><rect id="band-25" x="94" y="144" width="30" height="7" /><rect id="band-26" x="140" y="144" width="30" height="7" /><rect id="band-27" x="233" y="144" width="31" height="7" /><rect id="band-28" x="279" y="144" width="31" height="7" /><rect id="band-29" x="325" y="144" width="31" height="7" /><rect id="band-30" x="464" y="144" width="31" height="7" /><rect id="band-31" x="557" y="144" width="31" height="7" /><rect id="band-32" x="603" y="144" width="31" height="7" /></g><g id="gel-labels" font-family="Atkinson Hyperlegible Next" font-size="24" font-style="normal" font-weight="400" fill="#202b2e" text-anchor="middle"><text id="lane-P1" x="109.0" y="24">P1</text><text id="lane-P2" x="155.0" y="24">P2</text><text id="lane-A" x="248.5" y="24">A</text><text id="lane-B" x="294.5" y="24">B</text><text id="lane-C" x="341.0" y="24">C</text><text id="lane-D" x="387.0" y="24">D</text><text id="lane-E" x="433.5" y="24">E</text><text id="lane-F" x="480.0" y="24">F</text><text id="lane-G" x="526.0" y="24">G</text><text id="lane-H" x="572.5" y="24">H</text><text id="lane-I" x="619.0" y="24">I</text><text id="level-1" x="203" y="67.5">1</text><text id="level-2" x="203" y="97">2</text><text id="level-3" x="203" y="126">3</text><text id="level-4" x="203" y="155.5">4</text></g></g></g><g id="part-a" font-family="Atkinson Hyperlegible Next" font-size="28" font-style="normal" font-weight="400" fill="#202b2e"><text x="16" y="475" font-weight="700" fill="#202b2e">(a)</text><g id="part-a-prose"><text x="68" y="475" xml:space="preserve">Identify which pairs of numbered bands correspond to the </text><text x="68" y="510" xml:space="preserve">two segregating pairs of alleles.</text></g></g><g id="part-b" font-family="Atkinson Hyperlegible Next" font-size="28" font-style="normal" font-weight="400" fill="#202b2e"><text x="16" y="551" font-weight="700" fill="#202b2e">(b)</text><g id="part-b-prose"><text x="68" y="551" xml:space="preserve">Assuming that the two pairs of alleles undergo </text><text x="68" y="586" xml:space="preserve">independent assortment, what is the probability that an </text><text x="68" y="621" xml:space="preserve">offspring of the cross shows the banding pattern in lane </text><text x="68" y="656" xml:space="preserve">D?</text></g></g></svg>
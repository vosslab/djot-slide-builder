<svg xmlns="http://www.w3.org/2000/svg" width="724" height="299" viewBox="0 0 543 224.25" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Numbered family across three rows</title>
  <desc id="diagram-description">Sixteen people in rows I through III, joined by three family connections. Three squares and one circle are cyan; four squares and eight circles are white. Red numbers identify people within each row; blue Roman numerals identify rows.</desc>
  <rect width="100%" height="100%" fill="white" id="background" />
  <g id="connections">
    <g id="family-I1-I2">
      <line x1="226.75" y1="22.5" x2="263.75" y2="22.5" stroke="#000000" stroke-width="2" id="connection-1" />
      <line x1="243.75" y1="22.5" x2="243.75" y2="63.75" stroke="#000000" stroke-width="2" id="connection-2" />
      <line x1="150" y1="63.75" x2="380.25" y2="63.75" stroke="#000000" stroke-width="2" id="connection-3" />
      <line x1="150" y1="63.75" x2="150" y2="83" stroke="#000000" stroke-width="2" id="connection-4" />
      <line x1="225.75" y1="63.75" x2="225.75" y2="83" stroke="#000000" stroke-width="2" id="connection-5" />
      <line x1="300" y1="63.75" x2="300" y2="83" stroke="#000000" stroke-width="2" id="connection-6" />
      <line x1="380.25" y1="63.75" x2="380.25" y2="83" stroke="#000000" stroke-width="2" id="connection-7" />
    </g>
    <g id="family-II1-II2">
      <line x1="91" y1="99" x2="134" y2="99" stroke="#000000" stroke-width="2" id="connection-8" />
      <line x1="110.25" y1="99" x2="110.25" y2="152.25" stroke="#000000" stroke-width="2" id="connection-9" />
      <line x1="51" y1="152.25" x2="193.5" y2="152.25" stroke="#000000" stroke-width="2" id="connection-10" />
      <line x1="51" y1="152.25" x2="51" y2="168.5" stroke="#000000" stroke-width="2" id="connection-11" />
      <line x1="120" y1="152.25" x2="120" y2="168.5" stroke="#000000" stroke-width="2" id="connection-12" />
      <line x1="193.5" y1="152.25" x2="193.5" y2="168.5" stroke="#000000" stroke-width="2" id="connection-13" />
    </g>
    <g id="family-II5-II6">
      <line x1="396.25" y1="99" x2="443" y2="99" stroke="#000000" stroke-width="2" id="connection-14" />
      <line x1="418.5" y1="99" x2="418.5" y2="152.25" stroke="#000000" stroke-width="2" id="connection-15" />
      <line x1="313.5" y1="152.25" x2="520.5" y2="152.25" stroke="#000000" stroke-width="2" id="connection-16" />
      <line x1="313.5" y1="152.25" x2="313.5" y2="168.5" stroke="#000000" stroke-width="2" id="connection-17" />
      <line x1="366" y1="152.25" x2="366" y2="168.5" stroke="#000000" stroke-width="2" id="connection-18" />
      <line x1="418.5" y1="152.25" x2="418.5" y2="168.5" stroke="#000000" stroke-width="2" id="connection-19" />
      <line x1="471" y1="152.25" x2="471" y2="168.5" stroke="#000000" stroke-width="2" id="connection-20" />
      <line x1="520.5" y1="152.25" x2="520.5" y2="168.5" stroke="#000000" stroke-width="2" id="connection-21" />

    <circle cx="313.5" cy="184.5" r="15" fill="#fff" stroke="#000000" stroke-width="2" id="person-III4" />
    <rect x="351" y="169.5" width="30" height="30" fill="#fff" stroke="#000000" stroke-width="2" id="person-III5" />
    <circle cx="418.5" cy="184.5" r="15" fill="#fff" stroke="#000000" stroke-width="2" id="person-III6" />
    <circle cx="471" cy="184.5" r="15" fill="#fff" stroke="#000000" stroke-width="2" id="person-III7" />
    <rect x="505.5" y="169.5" width="30" height="30" fill="#6ed6ea" stroke="#000000" stroke-width="2" id="person-III8" />
  </g>
  <g id="row-labels">
    <text id="row-I" x="24" y="29.25" text-anchor="end" font-family="Atkinson Hyperlegible Next" font-size="20.25" font-weight="500" fill="#1749b1">I</text>
    <text id="row-II" x="24" y="105.75" text-anchor="end" font-family="Atkinson Hyperlegible Next" font-size="20.25" font-weight="500" fill="#1749b1">II</text>
    <text id="row-III" x="24" y="191.25" text-anchor="end" font-family="Atkinson Hyperlegible Next" font-size="20.25" font-weight="500" fill="#1749b1">III</text>
  </g>

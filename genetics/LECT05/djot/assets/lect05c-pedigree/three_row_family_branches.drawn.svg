    <circle cx="380.25" cy="99" r="15" fill="#fff" stroke="#000000" stroke-width="2" id="person-II5" />
    <rect x="444" y="84" width="30" height="30" fill="#fff" stroke="#000000" stroke-width="2" id="person-II6" />
    <rect x="36" y="169.5" width="30" height="30" fill="#fff" stroke="#000000" stroke-width="2" id="person-III1" />

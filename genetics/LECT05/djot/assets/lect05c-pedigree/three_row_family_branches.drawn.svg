    <text x="459" y="131.25" text-anchor="middle" font-family="Atkinson Hyperlegible Next" font-size="20.25" fill="#c21823" id="number-II6" font-weight="500">6</text>
    <text x="51" y="216.75" text-anchor="middle" font-family="Atkinson Hyperlegible Next" font-size="20.25" fill="#c21823" id="number-III1" font-weight="500">1</text>
    <text x="120" y="216.75" text-anchor="middle" font-family="Atkinson Hyperlegible Next" font-size="20.25" fill="#c21823" id="number-III2" font-weight="500">2</text>
    <text x="193.5" y="216.75" text-anchor="middle" font-family="Atkinson Hyperlegible Next" font-size="20.25" fill="#c21823" id="number-III3" font-weight="500">3</text>
    <text x="313.5" y="216.75" text-anchor="middle" font-family="Atkinson Hyperlegible Next" font-size="20.25" fill="#c21823" id="number-III4" font-weight="500">4</text>
    <text x="366" y="216.75" text-anchor="middle" font-family="Atkinson Hyperlegible Next" font-size="20.25" fill="#c21823" id="number-III5" font-weight="500">5</text>
    <text x="418.5" y="216.75" text-anchor="middle" font-family="Atkinson Hyperlegible Next" font-size="20.25" fill="#c21823" id="number-III6" font-weight="500">6</text>
    <text x="471" y="216.75" text-anchor="middle" font-family="Atkinson Hyperlegible Next" font-size="20.25" fill="#c21823" id="number-III7" font-weight="500">7</text>
    <text x="520.5" y="216.75" text-anchor="middle" font-family="Atkinson Hyperlegible Next" font-size="20.25" fill="#c21823" id="number-III8" font-weight="500">8</text>

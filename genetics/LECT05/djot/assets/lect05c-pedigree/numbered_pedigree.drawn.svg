<svg xmlns="http://www.w3.org/2000/svg" width="1454" height="1187" viewBox="0 0 1454 1187" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Numbered family diagram</title>
  <desc id="diagram-description">Twelve people numbered 1 through 12 in three rows, connected by three family branches. Seven squares and five circles have black or white fills. The pairs 1 and 2, 3 and 4, and 7 and 8 connect to children 5 through 7, 8 and 9, and 10 through 12 respectively. Nine detached response lines sit below numbers 1 through 9.</desc>
  <rect id="background" width="1454" height="1187" fill="#ffffff"/>
  <g id="connections" stroke="#000000" stroke-width="6" fill="none" stroke-linecap="square">
    <g id="branch-1">
      <line id="branch-1-edge-1" x1="265" y1="120" x2="425" y2="120"/>
      <line id="branch-1-edge-2" x1="350" y1="120" x2="350" y2="410"/>
      <line id="branch-1-edge-3" x1="112" y1="410" x2="690" y2="410"/>
      <line id="branch-1-edge-4" x1="112" y1="410" x2="112" y2="485"/>
      <line id="branch-1-edge-5" x1="405" y1="410" x2="405" y2="485"/>
      <line id="branch-1-edge-6" x1="690" y1="410" x2="690" y2="485"/>
    </g>
    <g id="branch-2">
      <line id="branch-2-edge-1" x1="985" y1="120" x2="1245" y2="120"/>
      <line id="branch-2-edge-2" x1="1170" y1="120" x2="1170" y2="410"/>
      <line id="branch-2-edge-3" x1="1060" y1="410" x2="1342" y2="410"/>
      <line id="branch-2-edge-4" x1="1060" y1="410" x2="1060" y2="485"/>
      <line id="branch-2-edge-5" x1="1342" y1="410" x2="1342" y2="485"/>
    </g>
    <g id="branch-3">
      <line id="branch-3-edge-1" x1="775" y1="570" x2="975" y2="570"/>
      <line id="branch-3-edge-2" x1="850" y1="570" x2="850" y2="900"/>
      <line id="branch-3-edge-3" x1="500" y1="900" x2="1170" y2="900"/>
      <line id="branch-3-edge-4" x1="500" y1="900" x2="500" y2="945"/>
      <line id="branch-3-edge-5" x1="850" y1="900" x2="850" y2="945"/>
      <line id="branch-3-edge-6" x1="1170" y1="900" x2="1170" y2="945"/>
    </g>
  </g>
  <g id="people" stroke="#000000" stroke-width="6">
    <rect id="person-1" x="95" y="35" width="170" height="170" fill="#000000"/>
    <circle id="person-2" cx="510" cy="120" r="85" fill="#000000"/>
    <circle id="person-3" cx="900" cy="120" r="85" fill="#ffffff"/>
    <rect id="person-4" x="1245" y="35" width="170" height="170" fill="#000000"/>
    <rect id="person-5" x="27" y="485" width="170" height="170" fill="#000000"/>
    <circle id="person-6" cx="405" cy="570" r="85" fill="#000000"/>
    <rect id="person-7" x="605" y="485" width="170" height="170" fill="#ffffff"/>
    <circle id="person-8" cx="1060" cy="570" r="85" fill="#ffffff"/>
    <rect id="person-9" x="1257" y="485" width="170" height="170" fill="#000000"/>
    <rect id="person-10" x="415" y="945" width="170" height="170" fill="#ffffff"/>
    <circle id="person-11" cx="850" cy="1030" r="85" fill="#ffffff"/>
    <rect id="person-12" x="1085" y="945" width="170" height="170" fill="#ffffff"/>
  </g>
  <g id="numbers" font-family="Atkinson Hyperlegible Next" font-size="54" text-anchor="middle" fill="#000000">
    <text id="number-1" x="180" y="252">1</text>
    <text id="number-2" x="510" y="252">2</text>
    <text id="number-3" x="900" y="252">3</text>
    <text id="number-4" x="1330" y="252">4</text>
    <text id="number-5" x="112" y="702">5</text>
    <text id="number-6" x="405" y="702">6</text>
    <text id="number-7" x="690" y="702">7</text>
    <text id="number-8" x="1060" y="702">8</text>
    <text id="number-9" x="1342" y="702">9</text>
    <text id="number-10" x="500" y="1162">10</text>
    <text id="number-11" x="850" y="1162">11</text>
    <text id="number-12" x="1170" y="1162">12</text>
  </g>
  <g id="response-lines" stroke="#000000" stroke-width="5">
    <line id="response-1" x1="125" y1="303" x2="235" y2="303"/>
    <line id="response-2" x1="455" y1="303" x2="565" y2="303"/>
    <line id="response-3" x1="845" y1="303" x2="955" y2="303"/>
    <line id="response-4" x1="1275" y1="303" x2="1385" y2="303"/>
    <line id="response-5" x1="57" y1="753" x2="167" y2="753"/>
    <line id="response-6" x1="350" y1="753" x2="460" y2="753"/>
    <line id="response-7" x1="635" y1="753" x2="745" y2="753"/>
    <line id="response-8" x1="1005" y1="753" x2="1115" y2="753"/>
    <line id="response-9" x1="1287" y1="753" x2="1397" y2="753"/>
  </g>
</svg>

  <title id="diagram-title">Numbered family across four rows</title>
  <desc id="diagram-description">Sixteen people in rows I through IV, joined by five family connections. Three squares are black; five squares and eight circles are white. Numbers identify people within each row; Roman numerals identify rows.</desc>

    <g id="person-numbers" text-anchor="middle">
      <text id="number-I1" x="148" y="78">1</text>
      <text id="number-I2" x="236" y="78">2</text>
      <text id="number-II1" x="66" y="194">1</text>
      <text id="number-II2" x="148" y="194">2</text>
      <text id="number-II3" x="236" y="194">3</text>
      <text id="number-II4" x="318" y="194">4</text>
      <text id="number-II5" x="398" y="194">5</text>
      <text id="number-II6" x="480" y="194">6</text>
      <text id="number-III1" x="66" y="312">1</text>
      <text id="number-III2" x="148" y="312">2</text>
      <text id="number-III3" x="236" y="312">3</text>
      <text id="number-III4" x="318" y="312">4</text>
      <text id="number-III5" x="398" y="312">5</text>
      <text id="number-III6" x="480" y="312">6</text>
    </g>
  </g>
</svg>

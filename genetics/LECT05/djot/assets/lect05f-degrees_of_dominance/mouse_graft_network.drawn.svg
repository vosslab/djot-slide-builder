<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Mouse skin-graft donor and recipient network</title>
<desc id="desc">Four schematic mice represent P1, P2, F1 and F2. Pink-red identifies P1, gold P2, blue F1 and green F2. Every pair has two separate arrows, one in each direction, from donor to recipient. No graft acceptance results are shown. Original artwork for Genetics LECT05, degrees of dominance, authored slides 31 through 35. Mouse anatomy and positions are illustrative and unmeasured.</desc>
<g id="directed-graft-relationships">

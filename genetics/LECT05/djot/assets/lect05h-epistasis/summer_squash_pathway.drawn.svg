<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc"><title id="title">Yellow pigment pathway in summer squash</title><desc id="desc">Source-faithful schematic pathway with three symbolic scalloped pattypan squash fruits. White compound A converts to green compound B through enzyme I, then yellow compound C through enzyme II. Active and blocked genotype arrows preserve the teaching figure; fruits are symbolic phenotypes, not measured specimens.</desc><rect width="1800" height="900" fill="#ffffff" /><g id="callout-1"><path d="M427.00000000000006 180 L540 236" fill="none" stroke="#a3a790" stroke-width="2" /><rect x="20" y="20" width="740" height="160" rx="16" fill="#faf5d8" stroke="#d2caa7" stroke-width="2" /><rect x="35" y="38" width="39" height="39" rx="9" fill="#425f57" /><text x="54.5" y="68" font-family="Atkinson Hyperlegible Next" font-size="31" text-anchor="middle" fill="#ffffff" font-weight="700" xml:space="preserve">1</text><text x="92" y="66" font-family="Atkinson Hyperlegible Next" font-size="31" text-anchor="start" fill="#233c3c" font-weight="400" xml:space="preserve"><tspan font-style="normal">Plants with genotype </tspan><tspan font-style="italic">ww</tspan><tspan font-style="normal"> produce</tspan></text><text x="92" y="106" font-family="Atkinson Hyperlegible Next" font-size="31" text-anchor="start" fill="#233c3c" font-weight="400" xml:space="preserve">enzyme I, which converts compound A</text><text x="92" y="146" font-family="Atkinson Hyperlegible Next" font-size="31" text-anchor="start" fill="#233c3c" font-weight="400" xml:space="preserve">(colorless) into compound B (green).</text></g><g id="callout-3"><path d="M1447.0 180 L1260 236" fill="none" stroke="#a3a790" stroke-width="2" /><rect x="1040" y="20" width="740" height="160" rx="16" fill="#faf5d8" stroke="#d2caa7" stroke-width="2" /><rect x="1055" y="38" width="39" height="39" rx="9" fill="#425f57" /><text x="1074.5" y="68" font-family="Atkinson Hyperlegible Next" font-size="31" text-anchor="middle" fill="#ffffff" font-weight="700" xml:space="preserve">3</text><text x="1112" y="66" font-family="Atkinson Hyperlegible Next" font-size="31" text-anchor="start" fill="#233c3c" font-weight="400" xml:space="preserve"><tspan font-style="normal">Plants with genotype </tspan><tspan font-style="italic">Y_</tspan><tspan font-style="normal"> produce</tspan></text><text x="1112" y="106" font-family="Atkinson Hyperlegible Next" font-size="31" text-anchor="start" fill="#233c3c" font-weight="400" xml:space="preserve">enzyme II, which converts compound B</text><text x="1112" y="146" font-family="Atkinson Hyperlegible Next" font-size="31" text-anchor="start" fill="#233c3c" font-weight="400" xml:space="preserve">into compound C (yellow).</text></g><g id="squash-1" data-compound="A" transform="translate(180 377)" stroke-linejoin="round"><path d="M-145 -8 C-157 -28 -143 -45 -121 -48 C-129 -65 -107 -78 -84 -70 C-70 -91 -43 -87 -26 -75 C-10 -89 14 -88 30 -75 C53 -89 78 -80 85 -66 C110 -72 132 -58 128 -43 C151 -38 161 -20 147 -4 C158 14 143 34 121 36 C114 58 91 64 70 56 C50 75 24 72 7 61 C-14 76 -42 69 -53 58 C-80 66 -105 52 -108 37 C-135 34 -150 15 -145 -8 Z" fill="#e9eee1" stroke="#7d997c" stroke-width="3" /><path d="M-145 -8 C-121 19 -103 24 -85 25 C-58 42 -35 44 -12 35 C13 46 40 45 60 32 C89 36 121 20 147 -4 C158 14 143 34 121 36 C114 58 91 64 70 56 C50 75 24 72 7 61 C-14 76 -42 69 -53 58 C-80 66 -105 52 -108 37 C-135 34 -150 15 -145 -8 Z" fill="#b8c9b4" opacity=".72" /><path d="M-4 -49 C-40 -53 -75 -58 -84 -70 C-100 -48 -94 -18 -108 13 C-80 -4 -44 -21 -4 -49 Z" fill="#ffffff" opacity=".45" stroke="none" /><path d="M0 -49 C-12 -63 -20 -69 -26 -75 C-43 -48 -42 -14 -53 29 C-31 6 -14 -24 0 -49 Z" fill="#ffffff" opacity=".45" stroke="none" /><path d="M8 -49 C28 -62 29 -69 30 -75 C54 -52 49 -13 70 28 C39 7 20 -18 8 -49 Z" fill="#ffffff" opacity=".45" stroke="none" /><path d="M10 -47 C52 -48 74 -57 85 -66 C99 -
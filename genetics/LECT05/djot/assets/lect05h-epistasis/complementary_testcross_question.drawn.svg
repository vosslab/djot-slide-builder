<?xml version='1.0' encoding='us-ascii'?>
<svg xmlns="http://www.w3.org/2000/svg" width="803" height="139" viewBox="0 0 803 139" role="img" aria-labelledby="title desc"><title id="title">Complementary testcross question 3.20</title><desc id="desc">Faithful source question with generation subscripts and phenotype ratios, without an answer.</desc><rect x="1" y="1" width="801" height="137" rx="8" fill="#faf8fd" stroke="#e4dfed" /><text x="12" y="28" id="number" font-family="Atkinson Hyperlegible Next" font-size="25" font-weight="400" font-style="normal" fill="#24212b" xml:space="preserve"><tspan font-weight="700" fill="#92251b">3.20</tspan></text><text x="75" y="28" id="line-1" font-family="Atkinson Hyperlegible Next" font-size="25" font-weight="400" font-style="normal" fill="#24212b" xml:space="preserve"><tspan>The F</tspan><tspan dy="7" font-size="17">2</tspan><tspan dy="-7"> progeny from a particular cross exhibit a modified</tspan></text><text x="75" y="60" id="line-2" font-family="Atkinson Hyperlegible Next" font-size="25" font-weight="400" font-style="normal" fill="#24212b" xml:space="preserve"><tspan>dihybrid ratio of 9 : 7 (instead of 9 : 3 : 3 : 1). What</tspan></text><text x="75" y="92" id="line-3" font-family="Atkinson Hyperlegible Next" font-size="25" font-weight="400" font-style="normal" fill="#24212b" xml:space="preserve"><tspan>phenotypic ratio would be expected from a testcross</tspan></text><text x="75" y="124" id="line-4" font-family="Atkinson Hyperlegible Next" font-size="25" font-weight="400" font-style="normal" fill="#24212b" xml:space="preserve"><tspan>of the F</tspan><tspan dy="7" font-size="17">1</tspan><tspan dy="-7"> progeny?</tspan></text></svg>
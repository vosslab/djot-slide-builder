<?xml version='1.0' encoding='us-ascii'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img" aria-labelledby="title desc"><title id="title">The Test Cross</title><desc id="desc">Two source test-cross outcomes with ten symbolic round pea seeds. Unknown yellow parent Y? and green yy parent precede an all-yellow Yy outcome and an outcome with two yellow Yy and two green yy offspring. The unknown gamete question marks are intentionally retained.</desc><rect width="1000" height="1250" fill="#cbdaba" /><rect y="160" width="1000" height="525" fill="#f8d8ad" /><defs><g id="seed-yellow"><path d="M-73 -4 C-78 -45 -39 -78 2 -75 C48 -78 78 -38 74 5 C73 49 39 76 -4 76 C-48 76 -77 42 -73 -4 Z" fill="#edb84f" stroke="#b88832" stroke-width="3" /><path d="M-62 14 C-44 63 24 77 58 30 C43 63 -7 79 -43 50 Z" fill="#d49d3b" /><path d="M-51 -30 C-28 -64 12 -67 37 -39 C16 -45 -10 -35 -23 -9 C-38 3 -57 -6 -51 -30 Z" fill="#ffe7a2" opacity=".65" /><path d="M-18 -53 Q-2 -61 14 -55" fill="none" stroke="#ffe7a2" stroke-width="6" stroke-linecap="round" /></g>
<g id="seed-green"><path d="M-73 -4 C-78 -45 -39 -78 2 -75 C48 -78 78 -38 74 5 C73 49 39 76 -4 76 C-48 76 -77 42 -73 -4 Z" fill="#49835a" stroke="#2e6149" stroke-width="3" /><path d="M-62 14 C-44 63 24 77 58 30 C43 63 -7 79 -43 50 Z" fill="#326d4d" /><path d="M-51 -30 C-28 -64 12 -67 37 -39 C16 -45 -10 -35 -23 -9 C-38 3 -57 -6 -51 -30 Z" fill="#8daf6b" opacity=".65" /><path d="M-18 -53 Q-2 -61 14 -55" fill="none" stroke="#8daf6b" stroke-width="6" stroke-linecap="round" /></g>
</defs><g data-seed="yellow" data-genotype="Y?"><use href="#seed-yellow" transform="translate(250 80) scale(0.74)" /><text x="250" y="92" font-family="Atkinson Hyperlegible Next" font-size="37" text-anchor="middle" font-style="italic" fill="#1c3229" font-weight="600">Y?</text></g><g data-seed="green" data-genotype="yy"><use href="#seed-green" transform="translate(410 80) scale(0.74)" /><text x="410" y="92" font-family="Atkinson Hyperlegible Next" font-size="37" text-anchor="middle" font-style="italic" fill="#ffffff" font-weight="600">yy</text></g><text x="710" y="95" font-family="Atkinson Hyperlegible Next" font-size="43" text-anchor="middle" font-style="normal" fill="#253b32" font-weight="700">The Test Cross</text><g id="outcome-1"><rect x="205" y="184" width="395" height="130" rx="10" fill="#f2c46f" /><text x="402" y="226" font-family="Atkinson Hyperlegible Next" font-size="31" text-anchor="middle" font-style="normal" fill="#253b32" font-weight="400">Gametes from parent</text><text x="402" y="264" font-family="Atkinson Hyperlegible Next" font-size="31" text-anchor="middle" font-style="normal" fill="#253b32" font-weight="400">of unknown genotype</text><text x="317.5" y="307" font-family="Atkinson Hyperlegible Next" font-size="35" text-anchor="middle" font-style="italic" fill="#253b32" font-weight="400" data-role="unknown-gamete">Y</text><text x="482.5" y="307" font-family="Atkinson Hyperlegible Next" font-size="35" text-anchor="middle" font-style="italic" fill="#253b32" font-weight="400" data-role="unknown-gamete">?</text><rect x="35" y="340" width="170" height="290" rx="10" fill="#afc496" /><text x="93" y="485" font-family="Atkinson Hyperlegible Next" font-size="30" text-anchor="middle" font-style="normal" fill="#253b32" font-weight="400" transform="rotate(-90 93 485)">Gametes from</text><text x="133" y="485" font-family="Atkinson Hyperlegible Next" font-size="30" text-anchor="middle" font-style="normal" fill="#253b32" font-weight="400" transform="rotate(-90 133 485)">recessive parent</text><text x="183" y="427" font-family="Atkinson Hyperlegible Next" font-size="36" text-anchor="middle" font-style="italic" fill="#253b32" font-weight="400" data-role="recessive-gamete">y</text><rect x="235" y="340" width="165" height="145" fill="#fce6c7" stroke="#637b55" stroke-width="2" /><g data-seed="yellow" data-genotype="Yy"><use href="#seed-yellow" transform="translate(317.5 412) scale(0.78)" /><text x="317.5" y="424" font-family="Atkinson Hyperlegible Next" font-size="37" text-anchor="middle" font-style="italic" fill="#1c3229" font-weight="600">Yy</text></g><rect x="400" y="340" width="165" height="145" fill="#fce6c7" stroke="#637b55" stroke-width="2" /><g data-seed="yellow" data-genotype="Yy"><use href="#seed-yellow" transform="translate(482.5 412) scale(0.78)" /><text x="482.5" y="424" font-family="Atkinson Hyperlegible Next" font-size="37" text-anchor="middle" font-style="italic" fill="#1c3229" font-weight="600">Yy</text></g><text x="183" y="572" font-family="Atkinson Hyperlegible Next" font-size="36" text-anchor="middle" font-style="italic" fill="#253b32" font-weight="400" data-role="recessive-gamete">y</text><rect x="235" y="485" width="165" height="145" fill="#fce6c7" stroke="#637b55" stroke-width="2" /><g data-seed="yellow" data-genotype="Yy"><use href="#seed-yellow" transform="translate(317.5 557) scale(0.78)" /><text x="317.5" y="569" font-family="Atkinson Hyperlegible Next" font-size="37" text-anchor="middle" font-style="italic" fill="#1c3229" font-weight="600">Yy</text></g><rect x="400" y="485" width="165" height="145" fill="#fce6c7" stroke="#637b55" stroke-width="2" /><g data-seed="yellow" data-genotype="Yy"><use href="#seed-yellow" transform="translate(482.5 557) scale(0.78)" /><text x="482.5" y="569" font-family="Atkinson Hyperlegible Next" font-size="37" text-anchor="middle" font-style="italic" fill="#1c3229" font-weight="600">Yy</text></g><g id="explanation-1"><text x="610" y="422" font-family="Atkinson Hyperlegible Next" font-size="30" text-anchor="start" font-style="normal" fill="#253b32" font-weight="400">A test cross resulting in</text><text x="610" y="461" font-family="Atkinson Hyperlegible Next" font-size="30" text-anchor="start" font-style="normal" fill="#253b32" font-weight="400">all dominant offspring</text><text x="610" y="500" font-family="Atkinson Hyperlegible Next" font-size="30" text-anchor="start" font-style="normal" fill="#253b32" font-weight="400">indicates that the parent</text><text x="610" y="539" font-family="Atkinson Hyperlegible Next" font-size="30" text-anchor="start" font-style="normal" fill="#253b32" font-weight="400">is homozygous dominant.</text></g></g><g id="outcome-2"><rect x="205" y="709" width="395" height="130" rx="10" fill="#f4cd98" /><text x="402" y="751" font-family="Atkinson Hyperlegible Next" font-size="31" text-anchor="middle" font-style="normal" fill="#253b32" font-weight="400">Gametes from parent</text><text x="402" y="789" font-family="Atkinson Hyperlegible Next" font-size="31" text-anchor="middle" font-style="normal" fill="#253b32" font-weight="400">of unknown genotype</text><text x="317.5" y="832" font-family="Atkinson Hyperlegible Next" font-size="35" text-anchor="middle" font-style="italic" fill="#253b32" font-weight="400" data-role="unknown-gamete">Y</text><text x="482.5" y="832" font-family="Atkinson Hyperlegible Next" font-size="35" text-anchor="middle" font-style="italic" fill="#253b32" font-weight="400" data-role="unknown-gamete">?</text><rect x="35" y="865" width="170" height="290" rx="10" fill="#afc496" /><text x="93" y="1010" font-family="Atkinson Hyperlegible Next" font-size="30" text-anchor="middle" font-style="normal" fill="#253b32" font-weight="400" transform="rotate(-90 93 1010)">Gametes from</text><text x="133" y="1010" font-family="Atkinson Hyperlegible Next" font-size="30" text-anchor="middle" font-style="normal" fill="#253b32" font-weight="400" transform="rotate(-90 133 1010)">recessive parent</text><text x="183" y="952" font-family="Atkinson Hyperlegible Next" font-size="36" text-anchor="middle" font-style="italic" fill="#253b32" font-weight="400" data-role="recessive-gamete">y</text><rect x="235" y="865" width="165" height="145" fill="#d8e4c9" stroke="#637b55" stroke-width="2" /><g data-seed="yellow" data-genotype="Yy"><use href="#seed-yellow" transform="translate(317.5 937) scale(0.78)" /><text x="317.5" y="949" font-family="Atkinson Hyperlegible Next" font-size="37" text-anchor="middle" font-style="italic" fill="#1c3229" font-weight="600">Yy</text></g><rect x="400" y="865" width="165" height="145" fill="#d8e4c9" stroke="#637b55" stroke-width="2" /><g data-seed="green" data-genotype="yy"><use href="#seed-green" transform="translate(482.5 937) scale(0.78)" /><text x="482.5" y="949" font-family="Atkinson Hyperlegible Next" font-size="37" text-anchor="middle" font-style="italic" fill="#ffffff" font-weight="600">yy</text></g><text x="183" y="1097" font-family="Atkinson Hyperlegible Next" font-size="36" text-anchor="middle" font-style="italic" fill="#253b32" font-weight="400" data-role="recessive-gamete">y</text><rect x="235" y="1010" width="165" height="145" fill="#d8e4c9" stroke="#637b55" stroke-width="2" /><g data-seed="yellow" data-genotype="Yy"><use href="#seed-yellow" transform="translate(317.5 1082) scale(0.78)" /><text x="317.5" y="1094" font-family="Atkinson Hyperlegible Next" font-size="37" text-anchor="middle" font-style="italic" fill="#1c3229" font-weight="600">Yy</text></g><rect x="400" y="1010" width="165" height="145" fill="#d8e4c9" stroke="#637b55" stroke-width="2" /><g data-seed="green" data-genotype="yy"><use href="#seed-green" transform="translate(482.5 1082) scale(0.78)" /><text x="482.5" y="1094" font-family="Atkinson Hyperlegible Next" font-size="37" text-anchor="middle" font-style="italic" fill="#ffffff" font-weight="600">yy</text></g><g id="explanation-2"><text x="610" y="947" font-family="Atkinson Hyperlegible Next" font-size="30" text-anchor="start" font-style="normal" fill="#253b32" font-weight="400">A test cross resulting</text><text x="610" y="986" font-family="Atkinson Hyperlegible Next" font-size="30" text-anchor="start" font-style="normal" fill="#253b32" font-weight="400">in a 1:1 ratio of yellow</text><text x="610" y="1025" font-family="Atkinson Hyperlegible Next" font-size="30" text-anchor="start" font-style="normal" fill="#253b32" font-weight="400">to green offspring</text><text x="610" y="1064" font-family="Atkinson Hyperlegible Next" font-size="30" text-anchor="start" font-style="normal" fill="#253b32" font-weight="400">indicates that the</text><text x="610" y="1103" font-family="Atkinson Hyperlegible Next" font-size="30" text-anchor="start" font-style="normal" fill="#253b32" font-weight="400">parent is heterozygous.</text></g></g></svg>
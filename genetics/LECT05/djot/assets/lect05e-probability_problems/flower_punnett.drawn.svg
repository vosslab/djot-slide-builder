<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title description">
<title id="title">Flower Punnett square</title>
<desc id="description">Pollen and pistil each supply B or b. Four equal outcome cells contain BB, Bb, Bb, and bb. BB and both Bb flowers are purple; bb is white. Two purple flowers identify the pollen and pistil headers.</desc>

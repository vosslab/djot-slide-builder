<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc"><title id="title">The gametes from the four-allele cross</title><desc id="desc">Each parent supplies either of its two alleles with probability one-half. Arrows show segregation, not measured distances or areas.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#526176"/></marker></defs><g font-family="Atkinson Hyperlegible Next"><text x="115" y="42" font-size="30" text-anchor="middle" fill="#172033">Parent 1</text><text x="355" y="42" font-size="30" text-anchor="middle" fill="#172033">Gametes</text><path d="M203 180 L298 104" fill="none" stroke="#526176" stroke-width="4" marker-end="url(#arrow)"/><path d="M203 180 L298 256" fill="none" stroke="#526176" stroke-width="4" marker-end="url(#arrow)"/><ellipse cx="110" cy="180" rx="87" ry="61" fill="#F2F3F5" stroke="#526176" stroke-width="3"/><text x="110" y="194" font-size="42" text-anchor="middle" fill="#172033" font-style="italic">A₁A₂</text><ellipse cx="355" cy="100" rx="46" ry="40" fill="#F2F3F5" stroke="#526176" stroke-width="3"/><text x="355" y="113" font-size="42" text-anchor="middle" fill="#172033" font-style="italic">A₁</text><text x="445" y="112" font-size="38" text-anchor="middle" fill="#172033">½</text><ellipse cx="355" cy="260" rx="46" ry="40" fill="#F2F3F5" stroke="#526176" stroke-width="3"/><text x="355" y="273" font-size="42" text-anchor="middle" fill="#172033" font-style="italic">A₂</text><text x="445" y="272" font-size="38" text-anchor="middle" fill="#172033">½</text><g transform="translate(580 0)"><text x="115" y="42" font-size="30" text-anchor="middle" fill="#172033">Parent 2</text><text x="355" y="42" font-size="30" text-anchor="middle" fill="#172033">Gametes</text><path d="M203 180 L298 104" fill="none" stroke="#526176" stroke-width="4" marker-end="url(#arrow)"/><path d="M203 180 L298 256" fill="none" stroke="#526176" stroke-width="4" marker-end="url(#arrow)"/><ellipse cx="110" cy="180" rx="87" ry="61" fill="#F2F3F5" stroke="#526176" stroke-width="3"/><text x="110" y="194" font-size="42" text-anchor="middle" fill="#172033" font-style="italic">A₃A₄</text><ellipse cx="355" cy="100" rx="46" ry="40" fill="#F2F3F5" stroke="#526176" stroke-width="3"/><text x="355" y="113" font-size="42" text-anchor="middle" fill="#172033" font-style="italic">A₃</text><text x="445" y="112" font-size="38" text-anchor="middle" fill="#172033">½</text><ellipse cx="355" cy="260" rx="46" ry="40" fill="#F2F3F5" stroke="#526176" stroke-width="3"/><text x="355" y="273" font-size="42" text-anchor="middle" fill="#172033" font-style="italic">A₄</text><text x="445" y="272" font-size="38" text-anchor="middle" fill="#172033">½</text></g></g></svg>

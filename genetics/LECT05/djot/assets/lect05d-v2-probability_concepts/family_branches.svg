<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="305" viewBox="0 0 1170 305" role="img" aria-labelledby="title desc"><title id="title">Following inheritance from son to child</title><desc id="desc">The child&#x27;s other parent is hh. Both son genotypes have probability one-half. Only an Hh son can transmit H. The three route probabilities sum to one.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#526176"/></marker></defs><g font-family="Atkinson Hyperlegible Next"><text x="330" y="30" font-size="30" text-anchor="middle" fill="#172033">Son</text><text x="690" y="30" font-size="30" text-anchor="middle" fill="#172033">Child</text><text x="1000" y="30" font-size="28" text-anchor="middle" fill="#172033">Route probability</text><path d="M125 165 L275 88" fill="none" stroke="#526176" stroke-width="4" marker-end="url(#arrow)"/><path d="M125 165 L275 245" fill="none" stroke="#526176" stroke-width="4" marker-end="url(#arrow)"/><path d="M386 88 L632 73" fill="none" stroke="#526176" stroke-width="4" marker-end="url(#arrow)"/><path d="M386 88 L632 166" fill="none" stroke="#526176" stroke-width="4" marker-end="url(#arrow)"/><path d="M386 245 L632 260" fill="none" stroke="#526176" stroke-width="4" marker-end="url(#arrow)"/><text x="78" y="158" font-size="23" text-anchor="middle" fill="#172033">Genotype</text><text x="78" y="186" font-size="23" text-anchor="middle" fill="#172033">unknown</text><ellipse cx="330" cy="88" rx="51" ry="33" fill="#F2F3F5" stroke="#526176" stroke-width="3"/><text x="330" y="99" font-size="36" text-anchor="middle" fill="#172033" font-style="italic">Hh</text><ellipse cx="330" cy="245" rx="51" ry="33" fill="#F2F3F5" stroke="#526176" stroke-width="3"/><text x="330" y="256" font-size="36" text-anchor="middle" fill="#172033" font-style="italic">hh</text><ellipse cx="690" cy="73" rx="51" ry="33" fill="#F2F3F5" stroke="#526176" stroke-width="3"/><text x="690" y="84" font-size="36" text-anchor="middle" fill="#172033" font-style="italic">Hh</text><ellipse cx="690" cy="166" rx="51" ry="33" fill="#F2F3F5" stroke="#526176" stroke-width="3"/><text x="690" y="177" font-size="36" text-anchor="middle" fill="#172033" font-style="italic">hh</text><ellipse cx="690" cy="260" rx="51" ry="33" fill="#F2F3F5" stroke="#526176" stroke-width="3"/><text x="690" y="271" font-size="36" text-anchor="middle" fill="#172033" font-style="italic">hh</text><text x="203" y="97" font-size="32" text-anchor="middle" fill="#172033">½</text><text x="203" y="258" font-size="32" text-anchor="middle" fill="#172033">½</text><text x="500" y="67" font-size="32" text-anchor="middle" fill="#172033">½</text><text x="500" y="158" font-size="32" text-anchor="middle" fill="#172033">½</text><text x="500" y="247" font-size="32" text-anchor="middle" fill="#172033">1</text><text x="1000" y="84" font-size="32" text-anchor="middle" fill="#A65B00">½ × ½ = ¼</text><text x="1000" y="178" font-size="32" text-anchor="middle" fill="#A65B00">½ × ½ = ¼</text><text x="1000" y="270" font-size="32" text-anchor="middle" fill="#A65B00">½ × 1 = ½</text></g></svg>

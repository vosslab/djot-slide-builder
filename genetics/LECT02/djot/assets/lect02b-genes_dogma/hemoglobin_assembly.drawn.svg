<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="hb-title hb-desc">
<title id="hb-title">Normal and clumped hemoglobin</title>
<desc id="hb-desc">Seven separate hemoglobin tetramers on the left and seven touching tetramers in a curved assembly on the right. Each tetramer contains two blue and two yellow folded subunits. Original schematic ribbons illustrate folded proteins; they do not trace atomic coordinates or a specific molecular interface. Source context: Genetics LECT02B original slide 42, image_015.png.</desc>

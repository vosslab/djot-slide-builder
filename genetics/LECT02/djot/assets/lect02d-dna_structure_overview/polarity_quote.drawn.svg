<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc"><title id="title">DNA polarity exercise 1.3</title><desc id="desc">A textbook exercise about strand polarity.</desc><rect x="0" y="0" width="1200" height="280" rx="14" fill="#F5F2FA" /><rect x="0" y="0" width="12" height="280" rx="6" fill="#69358B" /><text x="48" y="75" font-size="39" fill="#202024" text-anchor="start" font-family="Atkinson Hyperlegible Next, sans-serif">1.3 What does it mean to say that each strand of a duplex</text><text x="48" y="141" font-size="39" fill="#202024" text-anchor="start" font-family="Atkinson Hyperlegible Next, sans-serif">DNA molecule has a polarity? What does it mean to say that</text><text x="48" y="207" font-size="39" fill="#202024" text-anchor="start" font-family="Atkinson Hyperlegible Next, sans-serif">the paired strands in a duplex molecule have opposite polarity?</text></svg>
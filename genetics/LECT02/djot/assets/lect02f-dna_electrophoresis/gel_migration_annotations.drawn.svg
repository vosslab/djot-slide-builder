<?xml version='1.0' encoding='ascii'?>
<svg xmlns="http://www.w3.org/2000/svg" width="277" height="425" viewBox="0 0 277 425" role="img" aria-labelledby="title desc"><title id="title">Fragment size and migration annotations</title><desc id="desc">Source callouts for the largest and smallest fragments, with a downward direction arrow. The separate empirical gel is not part of this artwork.</desc><rect width="277" height="425" fill="white" /><g id="callout-leaders" stroke="#087fa6" stroke-width="2" fill="none"><path id="largest-leader" d="M 3.5 49 L 107 42" /><circle id="largest-terminal" cx="3.5" cy="49" r="2.7" fill="#087fa6" stroke="none" /><path id="smallest-leader" d="M 3.5 409 L 108 395" /><circle id="smallest-terminal" cx="3.5" cy="409" r="2.7" fill="#087fa6" stroke="none" /></g><g id="largest-callout"><rect id="largest-box" x="107" y="0.75" width="154" height="74" fill="#d1e4f1" stroke="#087fa6" stroke-width="1" /><text id="largest-text" font-family="Atkinson Hyperlegible Next" font-size="18" font-style="normal" font-weight="400" fill="#202b2e" xml:space="preserve"><tspan x="116" y="22.75">Band from </tspan><tspan x="116" y="44.75">largest fragment </tspan><tspan x="116" y="66.75">(moves least)</tspan></text></g><g id="smallest-callout"><rect id="smallest-box" x="108" y="350" width="168" height="74" fill="#d1e4f1" stroke="#087fa6" stroke-width="1" /><text id="smallest-text" font-family="Atkinson Hyperlegible Next" font-size="18" font-style="normal" font-weight="400" fill="#202b2e" xml:space="preserve"><tspan x="117" y="372">Band from </tspan><tspan x="117" y="394">smallest fragment </tspan><tspan x="117" y="416">(moves most)</tspan></text></g><g id="movement" fill="#202b2e"><text id="direction-text" font-family="Atkinson Hyperlegible Next" font-size="18" font-style="italic" font-weight="400" text-anchor="middle" xml:space="preserve"><tspan x="91" y="103">Direction </tspan><tspan x="91" y="123">of movement</tspan></text><path id="direction-shaft" d="M 91 133 V 347" stroke="#202b2e" stroke-width="1.3" fill="none" /><path id="direction-open-head" d="M 85 331 L 91 347 L 97 331" stroke="#202b2e" stroke-width="1.3" fill="none" stroke-linejoin="round" /></g></svg>
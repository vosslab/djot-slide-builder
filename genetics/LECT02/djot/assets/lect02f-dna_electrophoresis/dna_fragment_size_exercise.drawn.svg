<svg xmlns="http://www.w3.org/2000/svg" width="814" height="555" viewBox="0 0 814 555" role="img" aria-labelledby="title desc"><title id="title">DNA fragment size exercise 2.7</title><desc id="desc">Source exercise with one open loading well and four unlabeled purple bands. Four question marks retain the question state.</desc><rect width="814" height="555" fill="white" /><rect id="prompt-card" x="0" y="0" width="814" height="182" rx="8" fill="#f6f3fa" /><g id="exercise-text" font-family="Atkinson Hyperlegible Next" font-size="28" font-weight="400" font-style="normal"><text id="problem-number" x="9" y="29" font-weight="700" fill="#8d292f">2.7</text><g id="prompt" fill="#202b2e"><text x="69" y="29" xml:space="preserve">A solution contains double-stranded DNA fragments of size </text><text x="69" y="64" xml:space="preserve">4 kb, 8 kb, 10 kb, and 13 kb that are separated in an </text><text x="69" y="99" xml:space="preserve">electrophoresis gel. In the accompanying diagram of the </text><text x="69" y="134" xml:space="preserve">gel, match the fragments sizes with the correct bands.</text></g></g><g id="gel" stroke="#2679b7" stroke-width="1.6" stroke-linejoin="round"><path id="right-depth" d="M 518 209 L 521 206 V 526 L 518 529 Z" fill="#93c1df" /><path id="gel-face-open-well" d="M 392 209 H 419 V 221 H 496 V 209 H 518 V 529 H 392 Z" fill="#c3dfee" /><path id="upper-rim" d="M 392 209 L 395 206 H 422 V 218 H 496 L 499 206 H 521 L 518 209 H 496 V 221 H 419 V 209 Z" fill="#e5f2f9" /></g><g id="bands" fill="#890891"><rect id="band-1" x="417" y="282" width="80" height="9" /><rect id="band-2" x="417" y="327" width="80" height="8" /><rect id="band-3" x="417" y="384" width="80" height="9" /><rect id="band-4" x="417" y="452" width="80" height="8" /></g><g id="question-leaders" stroke="#24272b" stroke-width="1.5"><path id="leader-1" d="M 355 286.5 H 392" /><path id="leader-2" d="M 355 331.0 H 392" /><path id="leader-3" d="M 355 388.5 H 392" /><path id="leader-4" d="M 355 456.0 H 392" /></g><g id="question-marks" font-family="Atkinson Hyperlegible Next" font-size="27" font-weight="700" fill="#24272b"><text id="question-1" x="344" y="295.5" text-anchor="middle">?</text><text id="question-2" x="344" y="340.0" text-anchor="middle">?</text><text id="question-3" x="344" y="397.5" text-anchor="middle">?</text><text id="question-4" x="344" y="465.0" text-anchor="middle">?</text></g></svg>
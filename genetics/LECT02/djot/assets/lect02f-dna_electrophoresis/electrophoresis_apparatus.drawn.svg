<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="gel_angled-title gel_angled-desc">
  <title id="gel_angled-title">Agarose electrophoresis chamber</title>
  <desc id="gel_angled-desc">Schematic open chamber with wells nearest the negative electrode and DNA migration toward the positive electrode. Bands illustrate migration, not experimental measurements. The angled view uses parallel projection to show the tank and buffer; proportions are illustrative. Source slide: LECT02F apparatus, original image_003.jpg. Buffer, gel, wells and bands are separately labeled; visible bands require suitable treatment.</desc>

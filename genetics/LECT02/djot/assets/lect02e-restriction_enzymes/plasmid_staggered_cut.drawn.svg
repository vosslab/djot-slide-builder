<?xml version='1.0' encoding='us-ascii'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
  <title id="title">Staggered cutting of a plasmid</title>
  <desc id="desc">Text-free schematic of a green circular plasmid with a pale-green restriction-site segment. Magnification reveals parallel strands with staggered opposing cut pointers. The lower view shows the two exposed complementary ends of the opened plasmid, not two different molecules. No nucleotide sequence or polarity is inferred.</desc>
  <rect width="1200" height="1020" fill="#ffffff" />
  <path id="magnification-field" d="M522 216 L290 440 H910 L678 216 Z" fill="#eef2ed" />
  <circle id="plasmid-loop" cx="600" cy="130" r="107" fill="none" stroke="#3cad80" stroke-width="31" />
  <path id="plasmid-site" d="M553.1 226.2 A107 107 0 0 0 646.9 226.2" fill="none" stroke="#bfdc98" stroke-width="31" />
  <circle cx="600" cy="130" r="91.5" fill="none" stroke="#245f4e" stroke-width="2.5" />
  <circle cx="600" cy="130" r="122.5" fill="none" stroke="#245f4e" stroke-width="2.5" />
  <path d="M506 104 A98 98 0 0 1 566 38" fill="none" stroke="#ffffff" stroke-width="4" opacity=".32" stroke-linecap="round" />
  <g id="magnified-duplex">
    <g id="uncut-upper" data-start="290" data-end="910" data-pale-start="490" data-pale-end="690">
      <rect x="290" y="440" width="620" height="36" fill="#3cad80" />
      <rect x="490" y="440" width="200" height="36" fill="#bfdc98" />
      <path d="M290 471 H910 V476 H290 Z" fill="#21553d" opacity=".12" />
      <path d="M292 444 H908" stroke="#ffffff" stroke-width="3" opacity=".4" />
      <rect x="290" y="440" width="620" height="36" fill="none" stroke="#245f4e" stroke-width="2.5" />
    </g>
    <g id="uncut-lower" data-start="290" data-end="910" data-pale-start="490" data-pale-end="690">
      <rect x="290" y="494" width="620" height="36" fill="#3cad80" />
      <rect x="490" y="494" width="200" height="36" fill="#bfdc98" />
      <path d="M290 525 H910 V530 H290 Z" fill="#21553d" opacity=".12" />
      <path d="M292 498 H908" stroke="#ffffff" stroke-width="3" opacity=".4" />
      <rect x="290" y="494" width="620" height="36" fill="none" stroke="#245f4e" stroke-width="2.5" />
    </g>
  </g>
  <path id="upper-cut-pointer" d="M530 378 V423 M523 410 L530 423 L537 410" fill="none" stroke="#344c43" stroke-width="3" stroke-linejoin="round" />
  <path id="lower-cut-pointer" d="M650 590 V547 M643 560 L650 547 L657 560" fill="none" stroke="#344c43" stroke-width="3" stroke-linejoin="round" />
  <path id="process-arrow" d="M592 612 H608 V755 H625 L600 793 L575 755 H592 Z" fill="#687c70" />
  <g id="opened-plasmid-ends" transform="translate(175 853) scale(1)">
    <g id="left-end">
      <g id="left-upper" data-start="0" data-end="240" data-pale-start="200" data-pale-end="240">
        <rect x="0" y="0" width="240" height="36" fill="#3cad80" />
        <rect x="200" y="0" width="40" height="36" fill="#bfdc98" />
        <path d="M0 31 H240 V36 H0 Z" fill="#21553d" opacity=".12" />
        <path d="M2 4 H238" stroke="#ffffff" stroke-width="3" opacity=".4" />
        <rect x="0" y="0" width="240" height="36" fill="none" stroke="#245f4e" stroke-width="2.5" />
      </g>
      <g id="left-lower" data-start="0" data-end="360" data-pale-start="200" data-pale-end="360">
        <rect x="0" y="54" width="360" height="36" fill="#3cad80" />
        <rect x="200" y="54" width="160" height="36" fill="#bfdc98" />
        <path d="M0 85 H360 V90 H0 Z" fill="#21553d" opacity=".12" />
        <path d="M2 58 H358" stroke="#ffffff" stroke-width="3" opacity=".4" />
        <rect x="0" y="54" width="360" height="36" fill="none" stroke="#245f4e" stroke-width="2.5" />
      </g>
    </g>
    <g id="right-end">
      <g id="right-upper" data-start="490" data-end="850" data-pale-start="490" data-pale-end="650">
        <rect x="490" y="0" width="360" height="36" fill="#3cad80" />
        <rect x="490" y="0" width="160" height="36" fill="#bfdc98" />
        <path d="M490 31 H850 V36 H490 Z" fill="#21553d" opacity=".12" />
        <path d="M492 4 H848" stroke="#ffffff" stroke-width="3" opacity=".4" />
        <rect x="490" y="0" width="360" height="36" fill="none" stroke="#245f4e" stroke-width="2.5" />
      </g>
      <g id="right-lower" data-start="610" data-end="850" data-pale-start="610" data-pale-end="650">
        <rect x="610" y="54" width="240" height="36" fill="#3cad80" />
        <rect x="610" y="54" width="40" height="36" fill="#bfdc98" />
        <path d="M610 85 H850 V90 H610 Z" fill="#21553d" opacity=".12" />
        <path d="M612 58 H848" stroke="#ffffff" stroke-width="3" opacity=".4" />
        <rect x="610" y="54" width="240" height="36" fill="none" stroke="#245f4e" stroke-width="2.5" />
      </g>
    </g>
  </g>
</svg>
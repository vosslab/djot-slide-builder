  <title id="title">A Palindrome Cow</title>
  <desc id="desc">A playful cream and brown cow with two outward-facing heads sharing one body and four legs. Both heads say MOOM in one speech balloon. Original illustration for Genetics LECT02E, Literary Palindromes, slide 4; a visual joke, not an anatomical specimen.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" role="img" aria-labelledby="title desc">
<title id="title">Sticky Ends vs. Blunt Ends</title><desc id="desc">EcoRI cleaves G|AATTC / CTTAA|G; EcoRV cleaves GAT|ATC / CTA|TAG. Red arrows show cleavage sites and red lens symbols show the twofold symmetry axes at the duplex centers. Blue and gold identify prospective fragments. Schematic, not to scale. Source teaching content: image_011.png.</desc>

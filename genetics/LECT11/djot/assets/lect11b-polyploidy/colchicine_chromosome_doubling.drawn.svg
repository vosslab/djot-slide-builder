<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1208" height="834" viewBox="0 0 1208 834" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Colchicine and chromosome doubling</title>
  <desc id="figure-description">Simplified, unscaled cell-division comparison. A monoploid metaphase cell has three replicated chromosomes: one long blue, one short red, and one intermediate green, each with two sisters joined at a shared centromere. Without colchicine, two monoploid cells each contain one single chromosome of each type. With colchicine, one diploid cell contains six separate single chromosomes, two of each type. The source's five identifying labels are retained.</desc>
  <defs>
    <path id="single-chromosome-contour" d="M -7,-86 C -15,-61 -14,-33 -8,-10 Q -4,0 -8,10 C -13,36 -8,66 2,85 Q 8,94 15,85 Q 18,81 14,74 C 4,52 2,30 7,10 Q 10,0 7,-10 C 1,-37 1,-60 9,-80 Q 10,-89 2,-91 Q -4,-92 -7,-86 Z"/>
    <g id="blue-single">
      <use xlink:href="#single-chromosome-contour" transform="scale(1 .88)" fill="#2d719e"/>
      <circle cx="0" cy="0" r="6" fill="#215373" stroke="#f4f8fb" stroke-width="2.5"/>
    </g>
    <g id="red-single">
      <use xlink:href="#single-chromosome-contour" transform="scale(1 .4224)" fill="#b95040"/>
      <circle cx="0" cy="0" r="6" fill="#82382d" stroke="#fff5ef" stroke-width="2.5"/>
    </g>
    <g id="green-single">
      <use xlink:href="#single-chromosome-contour" transform="scale(1 .6248)" fill="#278065"/>
      <circle cx="0" cy="0" r="6" fill="#195b47" stroke="#eff9f3" stroke-width="2.5"/>
    </g>
    <g id="paired-sister-contours" fill="none" stroke-width="16" stroke-linecap="round">
      <path d="M -25,-80 C -32,-48 -17,-18 0,0 C -19,22 -30,51 -22,80"/>
      <path d="M 25,-80 C 32,-48 17,-18 0,0 C 19,22 30,51 22,80"/>
    </g>
  </defs>
  <rect width="1208" height="834" fill="#ffffff"/>
  <g id="source-label" fill="#263b48" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="38" text-anchor="middle">
    <text x="615" y="46"><tspan x="615">Metaphase in mitosis</tspan><tspan x="615" dy="46">in a monoploid cell</tspan></text>
  </g>
  <g id="metaphase-cell">
    <path id="parent-cell-outline" d="M 440,249 C 435,170 500,119 602,118 C 708,111 792,160 797,239 C 807,328 725,380 627,382 C 523,391 445,340 440,249 Z" fill="#f4ecdc" stroke="#667a80" stroke-width="4"/>
    <path d="M 459,273 C 487,348 561,365 638,360 C 704,359 760,331 781,285 C 764,351 699,377 627,378 C 545,385 476,349 459,273 Z" fill="#e7ddc9"/>
    <g id="parent-blue-replicated" transform="translate(552 243) rotate(-23)">
      <use xlink:href="#paired-sister-contours" stroke="#2d719e"/>
      <ellipse cx="0" cy="0" rx="11" ry="7" fill="#215373" stroke="#f4f8fb" stroke-width="2.5"/>
    </g>
    <g id="parent-red-replicated" transform="translate(696 195) rotate(65)">
      <use xlink:href="#paired-sister-contours" transform="scale(.8 .48)" stroke="#b95040"/>
      <ellipse cx="0" cy="0" rx="10" ry="6" fill="#82382d" stroke="#fff5ef" stroke-width="2.5"/>
    </g>
    <g id="parent-green-replicated" transform="translate(691 300) rotate(18)">
      <use xlink:href="#paired-sister-contours" transform="scale(.9 .71)" stroke="#278065"/>
      <ellipse cx="0" cy="0" rx="10" ry="6.5" fill="#195b47" stroke="#eff9f3" stroke-width="2.5"/>
    </g>
  </g>
  <g id="outcome-branches" fill="none" stroke="#263b48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <g id="untreated-arrow">
      <path d="M 480,354 C 445,393 394,428 325,472"/>
      <path d="M 331,447 L 325,472 L 350,469"/>
    </g>
    <g id="colchicine-arrow">
      <path d="M 756,354 C 801,396 853,430 923,472"/>
      <path d="M 897,469 L 923,472 L 915,447"/>
    </g>
  </g>
  <g id="treatment-labels" fill="#263b48" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="38" text-anchor="middle">
    <text x="240" y="418">No colchicine</text>
    <text x="999" y="418">Colchicine</text>
  </g>
  <g id="two-monoploid-cells">
    <g id="daughter-cell-a">
      <path id="daughter-a-outline" d="M 29,619 C 24,543 76,500 151,500 C 228,495 284,546 287,622 C 294,699 237,749 160,750 C 84,753 32,699 29,619 Z" fill="#f4ecdc" stroke="#667a80" stroke-width="4"/>
      <path d="M 45,645 C 72,714 132,733 184,726 C 224,723 262,698 276,664 C 260,720 215,747 160,746 C 100,748 54,711 45,645 Z" fill="#e7ddc9"/>
      <g id="daughter-a-blue" transform="translate(111 610) rotate(-20)"><use xlink:href="#blue-single"/></g>
      <g id="daughter-a-red" transform="translate(215 578) rotate(68)"><use xlink:href="#red-single"/></g>
      <g id="daughter-a-green" transform="translate(203 657) rotate(16)"><use xlink:href="#green-single"/></g>
    </g>
    <g id="daughter-cell-b">
      <path id="daughter-b-outline" d="M 328,626 C 322,549 371,504 449,500 C 531,495 586,542 590,618 C 595,696 541,747 461,750 C 385,756 333,708 328,626 Z" fill="#f4ecdc" stroke="#667a80" stroke-width="4"/>
      <path d="M 343,651 C 369,720 434,736 491,725 C 532,717 566,698 578,664 C 561,720 515,747 461,746 C 404,750 354,718 343,651 Z" fill="#e7ddc9"/>
      <g id="daughter-b-blue" transform="translate(416 608) rotate(20)"><use xlink:href="#blue-single"/></g>
      <g id="daughter-b-red" transform="translate(520 581) rotate(-58)"><use xlink:href="#red-single"/></g>
      <g id="daughter-b-green" transform="translate(513 654) rotate(-12)"><use xlink:href="#green-single"/></g>
    </g>
  </g>
  <g id="one-diploid-cell">
    <path id="diploid-cell-outline" d="M 781,624 C 775,544 849,498 958,498 C 1068,493 1162,538 1170,615 C 1179,696 1086,748 982,751 C 867,758 787,707 781,624 Z" fill="#f4ecdc" stroke="#667a80" stroke-width="4"/>
    <path d="M 797,649 C 832,718 920,735 1001,728 C 1070,726 1139,698 1156,659 C 1137,716 1062,746 982,747 C 886,753 813,713 797,649 Z" fill="#e7ddc9"/>
    <g id="diploid-blue-a" transform="translate(851 620) rotate(-8)"><use xlink:href="#blue-single"/></g>
    <g id="diploid-blue-b" transform="translate(907 619) rotate(8)"><use xlink:href="#blue-single"/></g>
    <g id="diploid-red-a" transform="translate(987 553) rotate(73)"><use xlink:href="#red-single"/></g>
    <g id="diploid-red-b" transform="translate(1084 565) rotate(82)"><use xlink:href="#red-single"/></g>
    <g id="diploid-green-a" transform="translate(993 661) rotate(9)"><use xlink:href="#green-single"/></g>
    <g id="diploid-green-b" transform="translate(1080 664) rotate(-5)"><use xlink:href="#green-single"/></g>
  </g>
  <g id="outcome-labels" fill="#263b48" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="39" text-anchor="middle">
    <text x="309" y="810">Two monoploid cells</text>
    <text x="976" y="810">One diploid cell</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Unreduced gametes and tetraploid zygote</title>
<desc id="desc">One diploid parent produces two unreduced gametes. Each contains six separate chromosome rods; the tetraploid zygote contains twelve. Each rod has an individual primary constriction.</desc>

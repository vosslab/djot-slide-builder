<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title description">
<title id="title">Repeated DNA can produce a duplication or deletion of genes X, Y, Z</title>
<desc id="description">A: two normal chromosomes have genes X, Y, Z between red repeat sequences. B: offset repeats mispair and cross over in meiosis. C: reciprocal products have two copies or no copies of the gene region. D: fertilization with normal gametes gives three copies or one copy of each gene. Source Figure 8.19 caption is retained.</desc>
<metadata id="provenance">Original editable schematic constructed from instructor asset genetics/LECT11/djot/assets/lect11e-chromo_alter_2-duplications/image_003.png; source meaning and labels retained, geometry recomposed. Unmeasured chromosome lengths. 2026-11-09.</metadata>

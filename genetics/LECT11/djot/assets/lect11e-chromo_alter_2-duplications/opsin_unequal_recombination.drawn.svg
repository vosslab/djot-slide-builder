<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc"><title id="title">Opsin gene recombination between and within genes</title><desc id="desc">Source-specific schematic of unequal recombination. Between-gene exchange yields R-only and R-G-G products. Within-gene exchange yields a magenta-to-green Greenlike hybrid and R plus green-to-magenta Redlike hybrid plus G. Blue and coral lines track source ancestry. All genes point right; no new sequence or polarity labels are added.</desc><rect width="1600" height="650" fill="white" /><text x="24" y="44" font-family="Atkinson Hyperlegible Next" font-size="35" font-weight="700" font-style="normal" fill="#273d3b">(A) Recombination between genes</text><text x="24" y="301" font-family="Atkinson Hyperlegible Next" font-size="35" font-weight="700" font-style="normal" fill="#273d3b">(B) Recombination within genes</text><g id="A-input-upper" data-left-color="#157ca4" data-right-color="#157ca4"><path d="M30 115 q13 -13 26 0 t26 0 t26 0 H527" fill="none" stroke="#157ca4" stroke-width="6" stroke-linecap="round" /><path d="M527 115 q13 -13 26 0 t26 0 t26 0" fill="none" stroke="#157ca4" stroke-width="6" stroke-linecap="round" /></g><g id="A-input-upper-R" data-gene="R" data-direction="right" data-left="#bd126b" data-right="#bd126b"><path d="M174 99 H252 V90 L280 115 L252 140 V131 H174 Z" fill="#bd126b" /><text x="217" y="125" font-family="Atkinson Hyperlegible Next" font-size="28" font-weight="700" fill="white" text-anchor="middle">R</text></g><g id="A-input-upper-G" data-gene="G" data-direction="right" data-left="#087c48" data-right="#087c48"><path d="M370 99 H448 V90 L476 115 L448 140 V131 H370 Z" fill="#087c48" /><text x="413" y="125" font-family="Atkinson Hyperlegible Next" font-size="28" font-weight="700" fill="white" text-anchor="middle">G</text></g><g id="A-input-lower" data-left-color="#df7967" data-right-color="#df7967"><path d="M30 218 q13 -13 26 0 t26
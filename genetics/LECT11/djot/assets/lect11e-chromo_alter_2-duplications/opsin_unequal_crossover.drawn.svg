<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
<title id="title">Unequal crossing over of red and green opsin genes</title>
<desc id="description">Two active chromatids are misaligned. A crossover in the homologous region between genes produces an r-only chromatid and an r-g-g chromatid. Red r and green g identities and the source panel B callout are retained. White clearance at the crossing denotes an overpass, not a fused four-way junction.</desc>
<metadata id="provenance">Original editable schematic constructed from instructor asset genetics/LECT11/djot/assets/lect11e-chromo_alter_2-duplications/image_005.png; source meaning and labels retained, geometry recomposed. Unmeasured chromosome lengths. 2026-11-09.</metadata>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title description">
<title id="title">Unequal crossing over expands or contracts a tandem duplication</title>
<desc id="description">Four chromatids pass through normal pairing, mispairing and an exchange between nonsister chromatids. Products retain two, one, three and two repeat copies in source order. L and R identify the left and right copies. The two inner chromatids exchange within misaligned repeats; white interruptions distinguish overlap from fusion.</desc>
<metadata id="provenance">Original editable schematic constructed from instructor asset genetics/LECT11/djot/assets/lect11e-chromo_alter_2-duplications/image_002.png; source meaning and labels retained, geometry recomposed. Unmeasured chromosome lengths. 2026-11-09.</metadata>

<svg xmlns="http://www.w3.org/2000/svg" width="861" height="804" viewBox="0 0 861 804" role="img" aria-labelledby="title desc">
<title id="title">Opsin hybrid genes and impaired color vision</title>
<desc id="desc">Three schematic continuous locus strips compare red and green gene segments. Panel A has a green-to-red hybrid; both arrangements in panel B have a red-to-green hybrid. Source labels and caption are retained.</desc>
<defs>
<linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eb7a64"/><stop offset="1" stop-color="#ce493d"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#83b66a"/><stop offset="1" stop-color="#4b8b43"/></linearGradient>
<linearGradient id="locus" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c9c1dc"/><stop offset="1" stop-color="#aba0c2"/></linearGradient>
</defs>
<rect width="861" height="804" fill="white"/>
<g font-family="Atkinson Hyperlegible Next" fill="#20262b">
<g id="source-callout"><rect x="217" y="40" width="588" height="184" rx="5" fill="#e6f0f8" stroke="#287daf" stroke-width="2"/>
<text id="callout-line-0" x="238" y="87" font-size="29" >Unequal crossing-over within the opsin</text>
<text id="callout-line-1" x="238" y="136" font-size="29" >genes results in chimeric genes and</text>
<text id="callout-line-2" x="238" y="185" font-size="29" >defects in either green or red perception.</text>
</g>

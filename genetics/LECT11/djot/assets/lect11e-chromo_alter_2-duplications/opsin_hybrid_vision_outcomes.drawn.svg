<text id="panel-B" x="90" y="418" font-size="30" font-weight="700">(B)</text>
<text id="phenotype-B" x="90" y="456" font-size="29" >R<tspan baseline-shift="super" font-size="21">-</tspan> G<tspan baseline-shift="super" font-size="21">+</tspan></text>

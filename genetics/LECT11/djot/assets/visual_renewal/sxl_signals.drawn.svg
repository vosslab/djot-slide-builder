<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">X-linked signals and Sxl</title><desc id="desc">High, intermediate, and low X-linked signals lead to female, mixed, and male transcript states. The intermediate state includes both Sxl ON and OFF cells.</desc><rect width="1200" height="460" fill="white"/>

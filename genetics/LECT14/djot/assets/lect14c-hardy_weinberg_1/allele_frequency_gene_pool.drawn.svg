<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="924" viewBox="0 0 1200 924" role="img" aria-labelledby="title desc">
<title id="title">Allele frequencies and the gene pool</title><desc id="desc">Two source steps show allele frequencies and a schematic open bin containing sixteen red and four white allele tokens.</desc>
<defs>
<radialGradient id="red" cx="30%" cy="25%" r="75%"><stop stop-color="#ef997b"/><stop offset=".45" stop-color="#df4b39"/><stop offset="1" stop-color="#a52830"/></radialGradient>
<radialGradient id="white" cx="30%" cy="25%" r="75%"><stop stop-color="#ffffff"/><stop offset=".5" stop-color="#f4f5f1"/><stop offset="1" stop-color="#c2ccca"/></radialGradient>
<linearGradient id="wall" x2="1" y2="1"><stop stop-color="#dcecee" stop-opacity=".8"/><stop offset="1" stop-color="#9bc6ce" stop-opacity=".7"/></linearGradient>
<linearGradient id="rim" y2="1" x2="0"><stop stop-color="#d5edef"/><stop offset="1" stop-color="#80afb9"/></linearGradient>
</defs><rect width="1200" height="924" fill="white"/>
<g id="headings" font-family="Atkinson Hyperlegible Next" font-size="39" font-weight="750" text-anchor="middle" fill="#202b2e"><text x="795" y="59">Frequencies of alleles</text><text x="795" y="436">Alleles in the population</text></g>
<g id="definitions" font-family="Atkinson Hyperlegible Next" font-size="32" fill="#202b2e">
<text x="470" y="139" xml:space="preserve"><tspan font-style="italic">p</tspan> = frequency of <tspan font-style="italic">C</tspan><tspan font-style="italic" baseline-shift="super" font-size="23">R</tspan> allele</text>
<text x="1062" y="139">= 0.8</text>
<text x="470" y="231" xml:space="preserve"><tspan font-style="italic">q</tspan> = frequency of <tspan font-style="italic">C</tspan><tspan font-style="italic" baseline-shift="super" font-size="23">W</tspan> allele</text>
<text x="1062" y="231">= 0.2</text></g>
<g id="key-tokens"><circle id="key-red" cx="1009" cy="127" r="25" fill="url(#red)" stroke="#ad4542" stroke-width="2"/><circle id="key-white" cx="1009" cy="219" r="25" fill="url(#white)" stroke="#9caaa9" stroke-width="2"/></g>
<path id="down-arrow" d="M785 270 H805 V350 H820 L795 390 L770 350 H785 Z" fill="#6b7168"/>

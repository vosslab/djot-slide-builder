<g id="leaders" fill="none" stroke="#058cac" stroke-width="2.3"><path d="M370 77 V283 M370 171 L447 127 M370 171 L447 219 M370 464 V882 M370 654 L469 677"/></g><g id="leader-dots" fill="#058cac"><circle cx="447" cy="127" r="7"/><circle cx="447" cy="219" r="7"/><circle cx="469" cy="677" r="7"/></g>
<g id="callouts" font-family="Atkinson Hyperlegible Next" font-size="35" fill="#008bad" text-anchor="end">
<g id="callout-1"><circle cx="73" cy="95" r="23" fill="#008bad"/><text x="73" y="107" text-anchor="middle" fill="white" font-weight="750">1</text>
<text x="350" y="107">The allele</text><text x="350" y="151">frequencies of</text><text x="350" y="195">the population</text><text x="350" y="239">are 0.8 (80%)</text><text x="350" y="283">and 0.2 (20%).</text></g>
<g id="callout-2"><circle cx="46" cy="480" r="23" fill="#008bad"/><text x="46" y="492" text-anchor="middle" fill="white" font-weight="750">2</text>
<text x="350" y="492">If all of these</text><text x="350" y="536">alleles could be</text><text x="350" y="580">placed in a large</text><text x="350" y="624">bin (representing</text><text x="350" y="668">the gene pool),</text><text x="350" y="712">80% would be <tspan font-style="italic">C</tspan><tspan font-style="italic" baseline-shift="super" font-size="25">R</tspan></text><text x="350" y="756">and 20% would</text><text x="350" y="800">be <tspan font-style="italic">C</tspan><tspan font-style="italic" baseline-shift="super" font-size="25">W</tspan>.</text></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1006" viewBox="0 0 1200 1006" role="img" aria-labelledby="title desc"><title id="title">Gene pool and gamete allele probabilities</title><desc id="desc">Source-staged allele sampling diagram. Colored spheres represent alleles. Cropped continuation geometry is preserved.</desc><defs>
<radialGradient id="red" cx="30%" cy="25%" r="75%"><stop stop-color="#ef997b"/><stop offset=".45" stop-color="#df4b39"/><stop offset="1" stop-color="#a52830"/></radialGradient>
<radialGradient id="white" cx="30%" cy="25%" r="75%"><stop stop-color="#ffffff"/><stop offset=".5" stop-color="#f4f5f1"/><stop offset="1" stop-color="#c2ccca"/></radialGradient>
<linearGradient id="wall" x2="1" y2="1"><stop stop-color="#dcecee" stop-opacity=".8"/><stop offset="1" stop-color="#9bc6ce" stop-opacity=".7"/></linearGradient>
<linearGradient id="rim" y2="1" x2="0"><stop stop-color="#d5edef"/><stop offset="1" stop-color="#80afb9"/></linearGradient>
</defs><rect width="1200" height="1006" fill="white"/><g font-family="Atkinson Hyperlegible Next" fill="#202b2e"><text x="795" y="50" text-anchor="middle" font-size="39" font-weight="750">Alleles in the population</text><g id="bin-placement" transform="translate(0,-390)"><g id="bin">
<path id="rear-wall" d="M526 477 H1085 L1135 526 L1118 854 Q1116 880 1090 880 H497 Q471 880 470 854 L451 526 Z" fill="url(#wall)" stroke="#759ea7" stroke-width="3"/>
<path id="inner-floor" d="M493 843 L535 811 H1080 L1112 847 L1092 873 H510 Z" fill="#a0c6cc" opacity=".5"/>
<path id="side-wall" d="M1085 494 L1126 534 L1110 847 L1080 811 Z" fill="#83b4bf" opacity=".3"/>
<path id="front-wall" d="M460 534 H1127 L1112 855 Q1110 873 1090 873 H499 Q480 873 479 855 Z" fill="#d5e9eb" fill-opacity=".32" stroke="#82adb6" stroke-width="3"/>
<path id="open-rim" fill="url(#rim)" fill-rule="evenodd" stroke="#739fa8" stroke-width="3" d="M518 468 H1090 L1144 513 Q1156 532 1131 540 H456 Q433 534 446 515 Z M530 484 L480 518 H1108 L1080 484 Z"/>
<path d="M462 544 L480 849 Q482 865 502 865" fill="none" stroke="#edf8f8" stroke-width="7" opacity=".65"/>
<g id="bin-tokens">
<circle id="bin-token-1-white" cx="522" cy="583" r="24" fill="url(#white)" stroke="#9caaa9" stroke-width="2"/>
<circle id="bin-token-2-red" cx="637" cy="605" r="24" fill="url(#red)" stroke="#ad4542" stroke-width="2"/>
<circle id="bin-token-3-red" cx="770" cy="600" r="24" fill="url(#red)" stroke="#ad4542" stroke-width="2"/>
<circle id="bin-token-4-red" cx="920" cy="611" r="24" fill="url(#red)" stroke="#ad4542" stroke-width="2"/>
<circle id="bin-token-5-red" cx="1065" cy="585" r="24" fill="url(#red)" stroke="#ad4542" stroke-width="2"/>
<circle id="bin-token-6-red" cx="518" cy="697" r="24" fill="url(#red)" stroke="#ad4542" stroke-width="2"/>
<circle id="bin-token-7-red" cx="610" cy="676" r="24" fill="url(#red)" stroke="#ad4542" stroke-width="2"/>
<circle id="bin-token-8-white" cx="736" cy="719" r="24" fill="url(#white)" stroke="#9caaa9" stroke-width="2"/>
<circle id="bin-token-9-white" cx="914" cy="704" r="24" fill="url(#white)" stroke="#9caaa9" stroke-width="2"/>
<circle id="bin-token-10-red" cx="1062" cy="692" r="24" fill="url(#red)" stroke="#ad4542" stroke-width="2"/>
<circle id="bin-token-11-red" cx="640" cy="760" r="24" fill="url(#red)" stroke="#ad4542" stroke-width="2"/>
<circle id="bin-token-12-red" cx="800" cy="778" r="24" fill="url(#red)" stroke="#ad4542" stroke-width="2"/>
<circle id="bin-token-13-red" cx="973" cy="778" r="24" fill="url(#red)" stroke="#ad4542" stroke-width="2"/>
<circle id="bin-token-14-red" cx="1081" cy="759" r="24" fill="url(#red)" stroke="#ad4542" stroke-width="2"/>
<circle id="bin-token-15-red" cx="524" cy="825" r="24" fill="url(#red)" stroke="#ad4542" stroke-width="2"/>
<circle id="bin-token-16-red" cx="618" cy="837" r="24" fill="url(#red)" stroke="#ad4542" stroke-width="2"/>
<circle id="bin-token-17-red" cx="722" cy="832" r="24" fill="url(#red)" stroke="#ad4542" stroke-width="2"/>
<circle id="bin-token-18-white" cx="849" cy="839" r="24" fill="url(#white)" stroke="#9caaa9" stroke-width="2"/>
<circle id="bin-token-19-red" cx="983" cy="839" r="24" fill="url(#red)" stroke="#ad4542" stroke-width="2"/>
<circle id="bin-token-20-red" cx="1080" cy="830" r="24" fill="url(#red)" stroke="#ad4542" stroke-width="2"/>
</g></g></g><g id="callout-2" fill="#008bad"><circle cx="35" cy="40" r="22"/><text fill="white" x="35" y="53" text-anchor="middle" font-size="32" font-weight="750">2</text><text x="365" y="52" text-anchor="end" font-size="34" font-weight="400">If all of these</text><text x="365" y="94" text-anchor="end" font-size="34" font-weight="400">alleles could be</text><text x="365" y="136" text-anchor="end" font-size="34" font-weight="400">placed in a large</text><text x="365" y="178" text-anchor="end" font-size="34" font-weight="400">bin (representing</text><text x="365" y="220" text-anchor="end" font-size="34" font-weight="400">the gene pool),</text><text x="365" y="262" text-anchor="end" font-size="34" font-weight="400">80% would be <tspan font-style="italic">C</tspan><tspan font-style="italic" baseline-shift="super" font-size="24">R</tspan></text><text x="365" y="304" text-anchor="end" font-size="34" font-weight="400">and 20% would</text><text x="365" y="346" text-anchor="end" font-size="34" font-weight="400">be <tspan font-style="italic">C</tspan><tspan font-style="italic" baseline-shift="super" font-size="24">W</tspan>.</text></g><g id="bin-leader" fill="none" stroke="#058cac" stroke-width="2.3"><path d="M385 20 V365 M385 220 L469 287"/></g><circle id="bin-leader-dot" cx="469" cy="287" r="7" fill="#058cac"/><g transform="translate(0,520)"><g id="gamete-stage"><path id="down-arrow" d="M785 -5 H805 V93 H821 L795 129 L769 93 H785 Z" fill="#6b7168"/><text x="795" y="171" text-anchor="middle" font-size="39" font-weight="750">Gametes produced</text><text x="585" y="227" text-anchor="middle" font-size="36" font-weight="400">Each egg:</text><text x="1000" y="227" text-anchor="middle" font-size="36" font-weight="400">Each sperm:</text><g id="gamete-tokens"><circle id="gamete-1-red" cx="500" cy="292" r="25" fill="url(#red)" stroke="#ad4542" stroke-width="2"/><circle id="gamete-2-white" cx="680" cy="292" r="25" fill="url(#white)" stroke="#9caaa9" stroke-width="2"/><circle id="gamete-3-red" cx="915" cy="292" r="25" fill="url(#red)" stroke="#ad4542" stroke-width="2"/><circle id="gamete-4-white" cx="1095" cy="292" r="25" fill="url(#white)" stroke="#9caaa9" stroke-width="2"/></g><g id="probability-labels"><text x="500" y="359" text-anchor="middle" font-size="38" font-weight="400">80%</text><text x="500" y="402" text-anchor="middle" font-size="36" font-weight="400">chance</text><text x="680" y="359" text-anchor="middle" font-size="38" font-weight="400">20%</text><text x="680" y="402" text-anchor="middle" font-size="36" font-weight="400">chance</text><text x="915" y="359" text-anchor="middle" font-size="38" font-weight="400">80%</text><text x="915" y="402" text-anchor="middle" font-size="36" font-weight="400">chance</text><text x="1095" y="359" text-anchor="middle" font-size="38" font-weight="400">20%</text><text x="1095" y="402" text-anchor="middle" font-size="36" font-weight="400">chance</text></g><g id="callout-3" fill="#008bad"><circle cx="35" cy="31" r="22"/><text fill="white" x="35" y="44" text-anchor="middle" font-size="32" font-weight="750">3</text><text x="365" y="43" text-anchor="end" font-size="34" font-weight="400">Assuming</text><text x="365" y="85" text-anchor="end" font-size="34" font-weight="400">mating is random,</text><text x="365" y="127" text-anchor="end" font-size="34" font-weight="400">each time two</text><text x="365" y="169" text-anchor="end" font-size="34" font-weight="400">gametes come</text><text x="365" y="211" text-anchor="end" font-size="34" font-weight="400">together, there is</text><text x="365" y="253" text-anchor="end" font-size="34" font-weight="400">an 80% chance the</text><text x="365" y="295" text-anchor="end" font-size="34" font-weight="400">egg carries a <tspan font-style="italic">C</tspan><tspan font-style="italic" baseline-shift="super" font-size="24">R</tspan></text><text x="365" y="337" text-anchor="end" font-size="34" font-weight="400">allele and a 20%</text><text x="365" y="379" text-anchor="end" font-size="34" font-weight="400">chance it carries</text><text x="365" y="421" text-anchor="end" font-size="34" font-weight="400">a <tspan font-style="italic">C</tspan><tspan font-style="italic" baseline-shift="super" font-size="24">W</tspan> allele.</text></g><g id="gamete-leaders" fill="none" stroke="#058cac" stroke-width="2.3"><path d="M385 15 V430 M385 240 L482 278 M385 240 L662 278 M865 520 L915 450 M865 520 L1095 450"/></g><g id="gamete-leader-dots" fill="#058cac"><circle cx="482" cy="278" r="7"/><circle cx="662" cy="278" r="7"/><circle cx="915" cy="450" r="7"/><circle cx="1095" cy="450" r="7"/></g></g></g></g></svg>
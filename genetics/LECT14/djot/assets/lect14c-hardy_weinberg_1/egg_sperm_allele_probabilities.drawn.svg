<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="674" viewBox="0 0 1200 674" role="img" aria-labelledby="title desc"><title id="title">Egg and sperm allele probabilities</title><desc id="desc">Source-staged allele sampling diagram. Colored spheres represent alleles. Cropped continuation geometry is preserved.</desc><defs>
<radialGradient id="red" cx="30%" cy="25%" r="75%"><stop stop-color="#ef997b"/><stop offset=".45" stop-color="#df4b39"/><stop offset="1" stop-color="#a52830"/></radialGradient>
<radialGradient id="white" cx="30%" cy="25%" r="75%"><stop stop-color="#ffffff"/><stop offset=".5" stop-color="#f4f5f1"/><stop offset="1" stop-color="#c2ccca"/></radialGradient>
<linearGradient id="wall" x2="1" y2="1"><stop stop-color="#dcecee" stop-opacity=".8"/><stop offset="1" stop-color="#9bc6ce" stop-opacity=".7"/></linearGradient>
<linearGradient id="rim" y2="1" x2="0"><stop stop-color="#d5edef"/><stop offset="1" stop-color="#80afb9"/></linearGradient>
</defs><rect width="1200" height="674" fill="white"/><g font-family="Atkinson Hyperlegible Next" fill="#202b2e"><g id="gamete-stage"><path id="down-arrow" d="M785 -5 H805 V93 H821 L795 129 L769 93 H785 Z" fill="#6b7168"/><text x="795" y="171" text-anchor="middle" font-size="39" font-weight="750">Gametes produced</text><text x="585" y="227" text-anchor="middle" font-size="36" font-weight="400">Each egg:</text><text x="1000" y="227" text-anchor="middle" font-size="36" font-weight="400">Each sperm:</text><g id="gamete-tokens"><circle id="gamete-1-red" cx="500" cy="292" r="25" fill="url(#red)" stroke="#ad4542" stroke-width="2"/><circle id="gamete-2-white" cx="680" cy="292" r="25" fill="url(#white)" stroke="#9caaa9" stroke-width="2"/><circle id="gamete-3-red" cx="915" cy="292" r="25" fill="url(#red)" stroke="#ad4542" stroke-width="2"/><circle id="gamete-4-white" cx="1095" cy="292" r="25" fill="url(#white)" stroke="#9caaa9" stroke-width="2"/></g><g id="probability-labels"><text x="500" y="359" text-anchor="middle" font-size="38" font-weight="400">80%</text><text x="500" y="402" text-anchor="middle" font-size="36" font-weight="400">chance</text><text x="680" y="359" text-anchor="middle" font-size="38" font-weight="400">20%</text><text x="680" y="402" text-anchor="middle" font-size="36" font-weight="400">chance</text><text x="915" y="359" text-anchor="middle" font-size="38" font-weight="400">80%</text><text x="915" y="402" text-anchor="middle" font-size="36" font-weight="400">chance</text><text x="1095" y="359" text-anchor="middle" font-size="38" font-weight="400">20%</text><text x="1095" y="402" text-anchor="middle" font-size="36" font-weight="400">chance</text></g><g id="callout-3" fill="#008bad"><circle cx="35" cy="31" r="22"/><text fill="white" x="35" y="44" text-anchor="middle" font-size="32" font-weight="750">3</text><text x="365" y="43" text-anchor="end" font-size="34" font-weight="400">Assuming</text><text x="365" y="85" text-anchor="end" font-size="34" font-weight="400">mating is random,</text><text x="365" y="127" text-anchor="end" font-size="34" font-weight="400">each time two</text><text x="365" y="169" text-anchor="end" font-size="34" font-weight="400">gametes come</text><text x="365" y="211" text-anchor="end" font-size="34" font-weight="400">together, there is</text><text x="365" y="253" text-anchor="end" font-size="34" font-weight="400">an 80% chance the</text><text x="365" y="295" text-anchor="end" font-size="34" font-weight="400">egg carries a <tspan font-style="italic">C</tspan><tspan font-style="italic" baseline-shift="super" font-size="24">R</tspan></text><text x="365" y="337" text-anchor="end" font-size="34" font-weight="400">allele and a 20%</text><text x="365" y="379" text-anchor="end" font-size="34" font-weight="400">chance it carries</text><text x="365" y="421" text-anchor="end" font-size="34" font-weight="400">a <tspan font-style="italic">C</tspan><tspan font-style="italic" baseline-shift="super" font-size="24">W</tspan> allele.</text></g><g id="gamete-leaders" fill="none" stroke="#058cac" stroke-width="2.3"><path d="M385 15 V430 M385 240 L482 278 M385 240 L662 278 M865 520 L915 450 M865 520 L1095 450"/></g><g id="gamete-leader-dots" fill="#058cac"><circle cx="482" cy="278" r="7"/><circle cx="662" cy="278" r="7"/><circle cx="915" cy="450" r="7"/><circle cx="1095" cy="450" r="7"/></g><g id="callout-4" fill="#008bad"><path d="M430 520 H1180" stroke="#058cac" stroke-width="2.3"/><circle cx="453" cy="550" r="22"/><text fill="white" x="453" y="562" text-anchor="middle" font-size="32" font-weight="750">4</text><text x="488" y="562" text-anchor="start" font-size="33" font-weight="400">Likewise, each sperm has an 80%</text><text x="430" y="606" text-anchor="start" font-size="33" font-weight="400">chance of carrying a <tspan font-style="italic">C</tspan><tspan font-style="italic" baseline-shift="super" font-size="24">R</tspan> allele and a</text><text x="430" y="650" text-anchor="start" font-size="33" font-weight="400">20% chance of carrying a <tspan font-style="italic">C</tspan><tspan font-style="italic" baseline-shift="super" font-size="24">W</tspan> allele.</text></g></g></g></svg>
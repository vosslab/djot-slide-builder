<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">Carrier-risk pedigree</title>
<desc id="desc">Six source pedigree individuals and their relationships, followed by the original parent-specific carrier and transmission probabilities and the complete risk calculation. Probability arrows are not pedigree offspring connections.</desc>

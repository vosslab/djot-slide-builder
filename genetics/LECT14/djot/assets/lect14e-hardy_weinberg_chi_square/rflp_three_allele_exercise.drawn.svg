<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="824" viewBox="0 0 1200 824" role="img" aria-labelledby="title desc">
<title id="title">RFLP three-allele exercise 17.7</title><desc id="desc">Full source exercise with six labeled schematic gel lanes and nine purple bands at three shared heights.</desc>
<rect width="1200" height="824" fill="white"/>
<rect x="15" y="15" width="1170" height="415" rx="12" fill="#f6f3fa"/><path d="M 28 33 L 28 411" stroke="#8e77ab" stroke-width="5"/>
<g id="prompt" font-family="Atkinson Hyperlegible Next" font-size="35" fill="#202b2e"><text x="45" y="58" fill="#9a302e" font-weight="750">17.7</text>
<text x="143" y="58">A population geneticist observed the RFLP phenotypes</text>
<text x="143" y="98">shown in the accompanying gel diagram, where the</text>
<text x="143" y="138">number above each well is the number of individuals</text>
<text x="143" y="178">exhibiting the corresponding phenotype. Test whether</text>
<text x="143" y="218">the observed phenotype frequencies are consistent with</text>
<text x="143" y="258">those expected from a single locus with three alleles in a</text>
<text x="143" y="298">random-mating population, using the chi-square criterion.</text>
<text x="143" y="338">Explain why, in this test, the appropriate number of</text>
<text x="143" y="378">degrees of freedom is 3.</text>
</g>
<g id="gel"><path id="slab" d="M 120 500 H 172 V 526 H 268 V 500 H 322 V 526 H 418 V 500 H 472 V 526 H 568 V 500 H 622 V 526 H 718 V 500 H 772 V 526 H 868 V 500 H 922 V 526 H 1018 V 500 H 1070 V 780 H 120 Z" fill="#c7e2ee" stroke="#287ba2" stroke-width="3"/><path id="rim" d="M 1070 500 L 1077 494 V 774 L 1070 780 M 120 500 L 126 494 H 172" fill="none" stroke="#79b7d1" stroke-width="3"/></g>
<g id="bands" fill="#870d9c">

<?xml version='1.0' encoding='ascii'?>
<svg xmlns="http://www.w3.org/2000/svg" width="650" height="540" viewBox="0 0 650 540" role="img" aria-labelledby="title desc">
  <title id="title">X inactivation is not complete silencing</title>
  <desc id="desc">Conceptual active X and condensed inactive X. A green symbol indicates escape from inactivation without assigning genes to genomic coordinates. The actual gene distribution is retained in the source reference figure.</desc>
  <rect width="650" height="540" fill="white" />
  <g id="active-x">
    <g data-lect12c-chromosome="true" transform="translate(120.0 80.0)" id="x_activity-drawn-chromosome-1" data-lect12c-input="120,80,65,290,#A1467E">
      <g id="x_activity-drawn-chromosome-1-body">
        <defs>
          <clipPath id="x_activity-drawn-chromosome-1-body-clip">
            <path d="M 23.2 0 H 266.8 Q 290.0 0 290.0 32.5 Q 290.0 65.0 266.8 65.0L 266.8 65.0 H 23.2 Q 0 65.0 0 32.5 Q 0 0 23.2 0 Z" transform="matrix(0 1 1 0 0 0) " />
          </clipPath>
        </defs>
        <g clip-path="url(#x_activity-drawn-chromosome-1-body-clip)">
          <path d="M 23.2 0 H 266.8 Q 290.0 0 290.0 32.5 Q 290.0 65.0 266.8 65.0L 266.8 65.0 H 23.2 Q 0 65.0 0 32.5 Q 0 0 23.2 0 Z" fill="#A1467E" transform="matrix(0 1 1 0 0 0) " />
          <rect x="23.2" y="0" width="266.8" height="65.0" fill="#A1467E" transform="matrix(0 1 1 0 0 0) " />
          <g id="x_activity-drawn-chromosome-1-body-region-0">
            <rect x="23.2" y="0" width="243.6" height="65.0" fill="#A1467E" transform="matrix(0 1 1 0 0 0) " />
          </g>
        </g>
        <path d="M 23.2 0 H 266.8 Q 290.0 0 290.0 32.5 Q 290.0 65.0 266.8 65.0L 266.8 65.0 H 23.2 Q 0 65.0 0 32.5 Q 0 0 23.2 0 Z" fill="none" stroke="#344651" stroke-width="2.2750000000000004" transform="matrix(0 1 1 0 0 0) " />
      </g>
    </g>
  </g>
  <g id="inactive-x">
    <circle cx="450" cy="240" r="72" fill="#A1467E" />
    <circle cx="473" cy="213" r="17" fill="#007A00" stroke="white" stroke-width="3" />
  </g>
  <g font-family="Arial" fill="#222" text-anchor="middle">
    <text x="153" y="430" font-size="29">Active X</text>
    <text x="450" y="430" font-size="29">Inactive X</text>
    <text x="450" y="472" font-size="24">Some genes escape</text>
    <text x="325" y="525" font-size="21">Conceptual symbols - no gene positions are assigned</text>
  </g>
</svg>
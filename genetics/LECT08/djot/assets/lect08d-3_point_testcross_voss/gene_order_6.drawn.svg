<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
<title id="title">Use the shorter intervals: 9 + 18 = 27 cM from A to B.</title>
<desc id="desc">Original schematic gene-placement diagram. Positions show the current candidates; letters and colors identify genes. Use the shorter intervals: 9 + 18 = 27 cM from A to B.</desc>
<g id="chromosome"><rect x="40" y="95" width="920" height="44" rx="12" fill="#F0F1F3" stroke="#67717D" stroke-width="2"/></g>
<g id="gene-A-0"><rect x="347" y="88" width="46" height="58" rx="4" fill="#C9211E"/><text x="370" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="white">A</text></g>
<g id="gene-C-1"><rect x="507" y="88" width="46" height="58" rx="4" fill="#24578F"/><text x="530" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="white">C</text></g>
<g id="gene-B-2"><rect x="827" y="88" width="46" height="58" rx="4" fill="#506C16"/><text x="850" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="white">B</text></g>
<g id="interval-0" stroke="#343A40" stroke-width="2"><line x1="370" y1="42" x2="530" y2="42"/><line x1="370" y1="34" x2="370" y2="87"/><line x1="530" y1="34" x2="530" y2="87"/></g><text x="450.0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#20252A">9 cM</text>
<g id="interval-1" stroke="#343A40" stroke-width="2"><line x1="530" y1="42" x2="850" y2="42"/><line x1="530" y1="34" x2="530" y2="87"/><line x1="850" y1="34" x2="850" y2="87"/></g><text x="690.0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#20252A">18 cM</text>
<g id="outer-frequency" stroke="#767D85" stroke-width="2"><line x1="370" y1="185" x2="850" y2="185"/><line x1="370" y1="148" x2="370" y2="192"/><line x1="850" y1="148" x2="850" y2="192"/></g><text x="610.0" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#525960">Observed A-B recombination: 23.8%</text>

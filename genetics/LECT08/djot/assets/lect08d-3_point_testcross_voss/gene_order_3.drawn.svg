<g id="gene-C-2"><rect x="507" y="88" width="46" height="58" rx="4" fill="#24578F" opacity="0.65"/><text x="530" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="white">C</text></g>

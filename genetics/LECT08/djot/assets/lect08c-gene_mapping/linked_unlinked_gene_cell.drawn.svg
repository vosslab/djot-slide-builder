<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 805.9747048558182" width="1400" height="805.9747048558182" role="img" aria-labelledby="title desc"><title id="title">Linked and unlinked genes in a heterozygous cell</title><desc id="desc">Three chromosomes in each parental gamete combine into six chromosomes. The A, B, C and F loci share one chromosome; A, B and C are close, while F is distant. D and E are on separate chromosomes. Source-specific schematic, without a numerical distance scale.</desc><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2=".3"><stop offset="0.0" stop-color="#8bdaec" /><stop offset="0.5" stop-color="#1598c0" /><stop offset="1.0" stop-color="#087397" /></linearGradient><linearGradient id="red" x1="0" y1="0" x2="1" y2=".3"><stop offset="0.0" stop-color="#ffb1a7" /><stop offset="0.5" stop-color="#e44e50" /><stop offset="1.0" stop-color="#b6293c" /></linearGradient><radialGradient id="cell-fill" cx=".28" cy=".2" r=".85"><stop offset="0" stop-color="#fff0cf" /><stop offset="1" stop-color="#efbf7f" /></radialGradient></defs><rect width="1400" height="805.9747048558182" fill="white" /><g id="diagram" font-family="Atkinson Hyperlegible Next" font-size="25" font-weight="bold" fill="#171b20"><g id="cells"><ellipse id="cell-sperm" cx="490" cy="132" rx="113" ry="113" fill="url(#cell-fill)" stroke="#b88c55" stroke-width="1.8" /><ellipse id="cell-egg" cx="790" cy="132" rx="113" ry="113" fill="url(#cell-fill)" stroke="#b88c55" stroke-width="1.8" /><ellipse id="cell-f1" cx="650" cy="555" rx="220" ry="225" fill="url(#cell-fill)" stroke="#b88c55" stroke-width="1.8" /></g><g id="chromosomes"><g id="sperm-long" data-color="blue" data-genes="C,B,A,F"><g id="sperm-long-shape" transform="rotate(0 490 47)"><path id="sperm-long-body" d="M490 47 C482 47 480 51 480 59 L480 120.10000000000002 Q480 130.10000000000002 485 137.10000000000002 Q480 144.10000000000002 480 154.10000000000002 L480 205 Q480 217 490 217 Q500 217 500 205 L500 154.10000000000002 Q500 144.10000000000002 495 137.10000000000002 Q500 130.10000000000002 500 120.10000000000002 L500 59 Q500 47 490 47 Z" fill="url(#blue)" stroke="#206179" stroke-width="1.4" /><rect id="sperm-long-band-C" x="480" y="60.0" width="20" height="8" fill="#16191e" /><rect id="sperm-long-band-B" x="480" y="82.1" width="20" height="8" fill="#16191e" /><rect id="sperm-long-band-A" x="480" y="104.19999999999999" width="20" height="8" fill="#16191e" /><rect id="sperm-long-band-F" x="480" y="190.9" width="20" height="8" fill="#16191e" /></g><text id="sperm-long-label-C" x="473" y="72.0" text-anchor="end" font-style="italic" font-size="25">C</text><text id="sperm-long-label-B" x="473" y="94.1" text-anchor="end" font-style="italic" font-size="25">B</text><text id="sperm-long-label-A" x="473" y="116.19999999999999" text-anchor="end" font-style="italic" font-size="25">A</text><text id="sperm-long-label-F" x="473" y="202.9" text-anchor="end" font-style="italic" font-size="25">F</text></g><g id="sperm-medium" data-color="blue" data-genes="D"><g id="sperm-medium-shape" transform="rotate(0 427 85)"><path id="sperm-medium-body" d="M427 85 C419 85 417 89 417 97 L417 126.30000000000001 Q417 136.3 422 143.3 Q417 150.3 417 160.3 L417 183 Q417 195 427 195 Q437 195 437 183 L437 160.3 Q437 150.3 432 143.3 Q437 136.3 437 126.30000000000001 L437 97 Q437 85 427 85 Z" fill="url(#blue)" stroke="#206179" stroke-width="1.4" /><rect id="sperm-medium-band-D" x="417" y="105.2" width="20" height="8" fill="#16191e" /></g><text id="sperm-medium-label-D" x="410" y="117.2" text-anchor="end" font-style="italic" font-size="25">D</text></g><g id="sperm-short" data-color="blue" data-genes="E"><g id="sperm-short-shape" transform="rotate(0 557 114)"><path id="sperm-short-body" d="M557 114 C549 114 547 118 547 126 L547 131.45 Q547 141.45 552 148.45 Q547 155.45 547 165.45 L547 167 Q547 179 557 179 Q567 179 567 167 L567 165.45 Q567 155.45 562 148.45 Q567 141.45 567 131.45 L567 126 Q567 114 557 114 Z" fill="url(#blue)" stroke="#206179" stroke-width="1.4" /><rect id="sperm-short-band-E" x="547" y="125.6" width="20" height="8" fill="#16191e" /></g><text id="sperm-short-label-E" x="540" y="137.6" text-anchor="end" font-style="italic" font-size="25">E</text></g><g id="egg-long" data-color="red" data-genes="c,b,a,f"><g id="egg-long-shape" transform="rotate(0 790 47)"><path id="egg-long-body" d="M790 47 C782 47 780 51 780 59 L780 120.10000000000002 Q780 130.10000000000002 785 137.10000000000002 Q780 144.10000000000002 780 154.10000000000002 L780 205 Q780 217 790 217 Q800 217 800 205 L800 154.10000000000002 Q800 144.10000000000002 795 137.10000000000002 Q800 130.10000000000002 800 120.10000000000002 L800 59 Q800 47 790 47 Z" fill="url(#red)" stroke="#9f3440" stroke-width="1.4" /><rect id="egg-long-band-c" x="780" y="60.0" width="20" height="8" fill="#16191e" /><rect id="egg-long-band-b" x="780" y="82.1" width="20" height="8" fill="#16191e" /><rect id="egg-long-band-a" x="780" y="104.19999999999999" width="20" height="8" fill="#16191e" /><rect id="egg-long-band-f" x="780" y="190.9" width="20" height="8" fill="#16191e" /></g><text id="egg-long-label-c" x="773" y="72.0" text-anchor="end" font-style="italic" font-size="25">c</text><text id="egg-long-label-b" x="773" y="94.1" text-anchor="end" font-style="italic" font-size="25">b</text><text id="egg-long-label-a" x="773" y="116.19999999999999" text-anchor="end" font-style="italic" font-size="25">a</text><text id="egg-long-label-f" x="773" y="202.9" text-anchor="end" font-style="italic" font-size="25">f</text></g><g id="egg-medium" data-color="red" data-genes="d"><g id="egg-medium-shape" transform="rotate(0 727 85)"><path id="egg-medium-body" d="M727 85 C719 85 717 89 717 97 L717 126.30000000000001 Q717 136.3 722 143.3 Q717 150.3 717 160.3 L717 183 Q717 195 727 195 Q737 195 737 183 L737 160.3 Q737 150.3 732 143.3 Q737 136.3 737 126.30000000000001 L737 97 Q737 85 727 85 Z" fill="url(#red)" stroke="#9f3440" stroke-width="1.4" /><rect id="egg-medium-band-d" x="717" y="105.2" width="20" height="8" fill="#16191e" /></g><text id="egg-medium-label-d" x="710" y="117.2" text-anchor="end" font-style="italic" font-size="25">d</text></g><g id="egg-short" data-color="red" data-genes="e"><g id="egg-short-shape" transform="rotate(0 857 114)"><path id="egg-short-body" d="M857 114 C849 114 847 118 847 126 L847 131.45 Q847 141.45 852 148.45 Q847 155.45 847 165.45 L847 167 Q847 179 857 179 Q867 179 867 167 L867 165.45 Q867 155.45 862 148.45 Q867 141.45 867 131.45 L867 126 Q867 114 857 114 Z" fill="url(#red)" stroke="#9f3440" stroke-width="1.4" /><rect id="egg-short-band-e" x="847" y="125.6" width="20" height="8" fill="#16191e" /></g><text id="egg-short-label-e" x="840" y="137.6" text-anchor="end" font-style="italic" font-size="25">e</text></g><g id="f1-blue-long" data-color="blue" data-genes="C,B,A,F"><g id="f1-blue-long-shape" transform="rotate(0 530 445)"><path id="f1-blue-long-body" d="M530 445 C522 445 520 449 520 457 L520 541.95 Q520 551.95 525 558.95 Q520 565.95 520 575.95 L520 648 Q520 660 530 660 Q540 660 540 648 L540 575.95 Q540 565.95 535 558.95 Q540 551.95 540 541.95 L540 457 Q540 445 530 445 Z" fill="url(#blue)" stroke="#206179" stroke-width="1.4" /><rect id="f1-blue-long-band-C" x="520" y="462.5" width="20" height="8" fill="#16191e" /><rect id="f1-blue-long-band-B" x="520" y="490.45" width="20" height="8" fill="#16191e" /><rect id="f1-blue-long-band-A" x="520" y="518.4" width="20" height="8" fill="#16191e" /><rect id="f1-blue-long-band-F" x="520" y="628.05" width="20" height="8" fill="#16191e" /></g><text id="f1-blue-long-label-C" x="513" y="474.5" text-anchor="end" font-style="italic" font-size="25">C</text><text id="f1-blue-long-label-B" x="513" y="502.45" text-anchor="end" font-style="italic" font-size="25">B</text><text id="f1-blue-long-label-A" x="513" y="530.4" text-anchor="end" font-style="italic" font-size="25">A</text><text id="f1-blue-long-label-F" x="513" y="640.05" text-anchor="end" font-style="italic" font-size="25">F</text></g><g id="f1-red-long" data-color="red" data-genes="c,b,a,f"><g id="f1-red-long-shape" transform="rotate(0 610 445)"><path id="f1-red-long-body" d="M610 445 C602 445 600 449 600 457 L600 541.95 Q600 551.95 605 558.95 Q600 565.95 600 575.95 L600 648 Q600 660 610 660 Q620 660 620 648 L620 575.95 Q620 565.95 615 558.95 Q620 551.95 620 541.95 L620 457 Q620 445 610 445 Z" fill="url(#red)" stroke="#9f3440" stroke-width="1.4" /><rect id="f1-red-long-band-c" x="600" y="462.5" width="20" height="8" fill="#16191e" /><rect id="f1-red-long-band-b" x="600" y="490.45" width="20" height="8" fill="#16191e" /><rect id="f1-red-long-band-a" x="600" y="518.4" width="20" height="8" fill="#16191e" /><rect id="f1-red-long-band-f" x="600" y="628.05" width="20" height="8" fill="#16191e" /></g><text id="f1-red-long-label-c" x="593" y="474.5" text-anchor="end" font-style="italic" font-size="25">c</text><text id="f1-red-long-label-b" x="593" y="502.45" text-anchor="end" font-style="italic" font-size="25">b</text><text id="f1-red-long-label-a" x="593" y="530.4" text-anchor="end" font-style="italic" font-size="25">a</text><text id="f1-red-long-label-f" x="593" y="640.05" text-anchor="end" font-style="italic" font-size="25">f</text></g><g id="f1-blue-medium" data-color="blue" data-genes="D"><g id="f1-blue-medium-shape" transform="rotate(-90 680 415)"><path id="f1-blue-medium-body" d="M680 415 C672 415 670 419 670 427 L670 464.25 Q670 474.25 675 481.25 Q670 488.25 670 498.25 L670 528 Q670 540 680 540 Q690 540 690 528 L690 498.25 Q690 488.25 685 481.25 Q690 474.25 690 464.25 L690 427 Q690 415 680 415 Z" fill="url(#blue)" stroke="#206179" stroke-width="1.4" /><rect id="f1-blue-medium-band-D" x="670" y="438.5" width="20" height="8" fill="#16191e" /></g><text id="f1-blue-medium-label-D" x="707.5" y="399" text-anchor="middle" font-style="italic" font-size="25">D</text></g><g id="f1-red-medium" data-color="red" data-genes="d"><g id="f1-red-medium-shape" transform="rotate(-90 680 525)"><path id="f1-red-medium-body" d="M680 525 C672 525 670 529 670 537 L670 574.25 Q670 584.25 675 591.25 Q670 598.25 670 608.25 L670 638 Q670 650 680 650 Q690 650 690 638 L690 608.25 Q690 598.25 685 591.25 Q690 584.25 690 574.25 L690 537 Q690 525 680 525 Z" fill="url(#red)" stroke="#9f3440" stroke-width="1.4" /><rect id="f1-red-medium-band-d" x="670" y="548.5" width="20" height="8" fill="#16191e" /></g><text id="f1-red-medium-label-d" x="707.5" y="509" text-anchor="middle" font-style="italic" font-size="25">d</text></g><g id="f1-blue-short" data-color="blue" data-genes="E"><g id="f1-blue-short-shape" transform="rotate(0 705 620)"><path id="f1-blue-short-body" d="M705 620 C697 620 695 624 695 632 L695 645.4 Q695 655.4 700 662.4 Q695 669.4 695 679.4 L695 688 Q695 700 705 700 Q715 700 715 688 L715 679.4 Q715 669.4 710 662.4 Q715 655.4 715 645.4 L715 632 Q715 620 705 620 Z" fill="url(#blue)" stroke="#206179" stroke-width="1.4" /><rect id="f1-blue-short-band-E" x="695" y="635.2" width="20" height="8" fill="#16191e" /></g><text id="f1-blue-short-label-E" x="688" y="647.2" text-anchor="end" font-style="italic" font-size="25">E</text></g><g id="f1-red-short" data-color="red" data-genes="e"><g id="f1-red-short-shape" transform="rotate(0 790 620)"><path id="f1-red-short-body" d="M790 620 C782 620 780 624 780 632 L780 645.4 Q780 655.4 785 662.4 Q780 669.4 780 679.4 L780 688 Q780 700 790 700 Q800 700 800 688 L800 679.4 Q800 669.4 795 662.4 Q800 655.4 800 645.4 L800 632 Q800 620 790 620 Z" fill="url(#red)" stroke="#9f3440" stroke-width="1.4" /><rect id="f1-red-short-band-e" x="780" y="635.2" width="20" height="8" fill="#16191e" /></g><text id="f1-red-short-label-e" x="773" y="647.2" text-anchor="end" font-style="italic" font-size="25">e</text></g></g><g id="fusion" fill="none" stroke="#24282d" stroke-width="3.5" stroke-linejoin="round"><path id="fusion-branches" d="M 550 230 L 650 297 L 730 230 M 650 297 L 650 326" /><path id="fusion-arrowhead" d="M 641 316 L 650 336 L 659 316" fill="#24282d" stroke="none" /></g><text id="plus" x="640" y="132" font-size="35" text-anchor="middle">+</text><g id="callout-leaders" fill="none" stroke="#30353b" stroke-width="1.8"><path id="leader-f1-cell" d="M 375 431 L 465 480" data-target="cell-f1" /><path id="leader-four-genes" d="M 372 635 L 520 632" data-target="f1-blue-long" /><path id="leader-separate-d" d="M 978 380 L 707.5 525" data-target="f1-red-medium-band-d" /><path id="leader-separate-e" d="M 978 380 L 800 639.2" data-target="f1-red-short-band-e" /><path id="leader-distant-c" d="M 978 470 L 620 466.5" data-target="f1-red-long-band-c" /><path id="leader-distant-f" d="M 978 470 L 620 632.05" data-target="f1-red-long-band-f" /><path id="leader-linked-cluster" d="M 978 655 L 670 570 L 650 494.45" data-target="linked-bracket" /><path id="linked-bracket" d="M 627 466.5 Q 642 466.5 642 477 L 642 486 Q 642 493 650 494.45 Q 642 496 642 503 L 642 511.9 Q 642 522.4 627 522.4" /></g><g id="source-text" xml:space="preserve"><g id="sperm-label" font-size="28"><text x="370" y="30"><tspan>Sperm</tspan></text></g><g id="egg-label" font-size="28"><text x="880" y="30"><tspan>Egg</tspan></text></g><g id="parent-label" font-size="28"><text x="90" y="135"><tspan>P generation</tspan></text><text x="90" y="170"><tspan>gametes</tspan></text></g><g id="f1-description" font-size="25"><text x="15" y="305"><tspan>This F</tspan><tspan font-size="16.25" dy="5.75">1</tspan><tspan dy="-5.75"> cell has 2</tspan><tspan font-style="italic">n</tspan><tspan> </tspan><tspan font-weight="normal">=</tspan><tspan> 6</tspan></text><text x="15" y="337"><tspan>chromosomes and is</tspan></text><text x="15" y="369"><tspan>heterozygous for all six</tspan></text><text x="15" y="401"><tspan>genes shown (</tspan><tspan font-style="italic">AaBbCcDdEeFf</tspan><tspan>).</tspan></text><text x="15" y="433"><tspan>Red </tspan><tspan font-weight="normal">=</tspan><tspan> maternal;</tspan></text><text x="15" y="465"><tspan>blue </tspan><tspan font-weight="normal">=</tspan><tspan> paternal.</tspan></text></g><g id="four-genes-description" font-size="25"><text x="15" y="594"><tspan>Each chromosome has</tspan></text><text x="15" y="626"><tspan>hundreds or thousands</tspan></text><text x="15" y="658"><tspan>of genes. Four (</tspan><tspan font-style="italic">A, B, C, F</tspan><tspan>)</tspan></text><text x="15" y="690"><tspan>are shown on this one.</tspan></text></g><g id="unlinked-description" font-size="25"><text x="985" y="265"><tspan>The alleles of unlinked</tspan></text><text x="985" y="297"><tspan>genes are either on</tspan></text><text x="985" y="329"><tspan>separate chromosomes</tspan></text><text x="985" y="361"><tspan>(such as </tspan><tspan font-style="italic">d</tspan><tspan> and </tspan><tspan font-style="italic">e</tspan><tspan>) or so</tspan></text><text x="985" y="393"><tspan>far apart on the same</tspan></text><text x="985" y="425"><tspan>chromosome (</tspan><tspan font-style="italic">c</tspan><tspan> and </tspan><tspan font-style="italic">f</tspan><tspan>)</tspan></text><text x="985" y="457"><tspan>that they assort</tspan></text><text x="985" y="489"><tspan>independently.</tspan></text></g><g id="linked-description" font-size="25"><text x="985" y="565"><tspan>Genes on the same</tspan></text><text x="985" y="597"><tspan>chromosome whose alleles</tspan></text><text x="985" y="629"><tspan>are so close together that</tspan></text><text x="985" y="661"><tspan>they do not assort</tspan></text><text x="985" y="693"><tspan>independently (such as</tspan></text><text x="985" y="725"><tspan font-style="italic">a</tspan><tspan>, </tspan><tspan font-style="italic">b</tspan><tspan>, and </tspan><tspan font-style="italic">c</tspan><tspan>) are said to be</tspan></text><text x="985" y="757"><tspan>genetically linked.</tspan></text></g></g></g></svg>
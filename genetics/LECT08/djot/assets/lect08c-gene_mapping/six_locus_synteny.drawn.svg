<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><title>Six loci on three homologous chromosome pairs</title><desc>A B C and F occupy the same chromosome. A B C are clustered, F far away. D and E are on separate chromosome pairs. Paternal homologs blue carry uppercase alleles, maternal homologs red carry lowercase alleles.</desc><g id="f1-title" font-family="Arial" fill="#202020"><text x="320" y="40" font-size="32">F<tspan x="340" y="48" font-size="22">1</tspan></text><text x="355" y="40" font-size="32">: AaBbCcDdEeFf &#183; 2n = 6</text></g><g id="pair-0-homolog-0"><rect x="160" y="115" width="24" height="350" rx="12" fill="#1978A4"/><path d="M155 150 L189 150" stroke="#202020" stroke-width="2" fill="none"/><text x="127" y="159" font-family="Arial" font-size="28" fill="#1978A4" text-anchor="middle">A</text><path d="M155 190 L189 190" stroke="#202020" stroke-width="2" fill="none"/><text x="127" y="199" font-family="Arial" font-size="28" fill="#1978A4" text-anchor="middle">B</text><path d="M155 230 L189 230" stroke="#202020" stroke-width="2" fill="none"/><text x="127" y="239" font-family="Arial" font-size="28" fill="#1978A4" text-anchor="middle">C</text><path d="M155 430 L189 430" stroke="#202020" stroke-width="2" fill="none"/><text x="127" y="439" font-family="Arial" font-size="28" fill="#1978A4" text-anchor="middle">F</text></g><g id="pair-0-homolog-1"><rect x="220" y="115" width="24" height="350" rx="12" fill="#C44545"/><path d="M215 150 L249 150" stroke="#202020" stroke-width="2" fill="none"/><text x="277" y="159" font-family="Arial" font-size="28" fill="#C44545" text-anchor="middle">a</text><path d="M215 190 L249 190" stroke="#202020" stroke-width="2" fill="none"/><text x="277" y="199" font-family="Arial" font-size="28" fill="#C44545" text-anchor="middle">b</text><path d="M215 230 L249 230" stroke="#202020" stroke-width="2" fill="none"/><text x="277" y="239" font-family="Arial" font-size="28" fill="#C44545" text-anchor="middle">c</text><path d="M215 430 L249 430" stroke="#202020" stroke-width="2" fill="none"/><text x="277" y="439" font-family="Arial" font-size="28" fill="#C44545" text-anchor="middle">f</text></g><g id="pair-1-homolog-0"><rect x="580" y="170" width="24" height="240" rx="12" fill="#1978A4"/><path d="M575 260 L609 260" stroke="#202020" stroke-width="2" fill="none"/><text x="547" y="269" font-family="Arial" font-size="28" fill="#1978A4" text-anchor="middle">D</text></g><g id="pair-1-homolog-1"><rect x="640" y="170" width="24" height="240" rx="12" fill="#C44545"/><path d="M635 260 L669 260" stroke="#202020" stroke-width="2" fill="none"/><text x="697" y="269" font-family="Arial" font-size="28" fill="#C44545" text-anchor="middle">d</text></g><g id="pair-2-homolog-0"><rect x="940" y="210" width="24" height="160" rx="12" fill="#1978A4"/><path d="M935 260 L969 260" stroke="#202020" stroke-width="2" fill="none"/><text x="907" y="269" font-family="Arial" font-size="28" fill="#1978A4" text-anchor="middle">E</text></g><g id="pair-2-homolog-1"><rect x="1000" y="210" width="24" height="160" rx="12" fill="#C44545"/><path d="M995 260 L1029 260" stroke="#202020" stroke-width="2" fill="none"/><text x="1057" y="269" font-family="Arial" font-size="28" fill="#C44545" text-anchor="middle">e</text></g><text x="600" y="520" font-family="Arial" font-size="28" fill="#202020" text-anchor="middle">Blue = paternal &#183; Red = maternal</text><text x="600" y="565" font-family="Arial" font-size="24" fill="#202020" text-anchor="middle">Schematic chromosomes; positions are not a base-pair scale.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="954" height="498" viewBox="0 0 954 498" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Two chiasmata in homologous chromosomes</title>
<desc id="figure-desc">Four continuous chromatids form two replicated homologs with shared sister centromere regions at the left. The two inner nonsister chromatids cross twice; outer chromatids remain separate. The two chiasmata are schematic contacts, not finished genotype products. Teal and blue retain homolog identity throughout.</desc>
<rect width="954" height="498" fill="white"/>
<text x="20" y="39" fill="#213547" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="29" text-anchor="start">(B)</text>

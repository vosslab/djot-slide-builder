<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="195" viewBox="0 0 1220 195" role="img"><title>seed trait key</title><desc>Four seed phenotypes. A dash means either allele at that position. W gives round, ww wrinkled; G gives yellow, gg green. Original illustration for LECT08B; schematic, not to scale.</desc><g font-family="Arial, sans-serif" fill="#20262C"><g id="phenotype-1"><g transform="translate(160,65) scale(1.0)"><circle r="34" fill="#E2C943" stroke="#596642" stroke-width="3"/><path d="M -19 -14 Q -12 -25 2 -24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/></g><text x="160" y="130" font-size="26" text-anchor="middle">Round, yellow</text><text x="160" y="170" font-size="26" text-anchor="middle">W- G-</text></g><g id="phenotype-2"><g transform="translate(460,65) scale(1.0)"><circle r="34" fill="#639E44" stroke="#596642" stroke-width="3"/><path d="M -19 -14 Q -12 -25 2 -24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/></g><text x="460" y="130" font-size="26" text-anchor="middle">Round, green</text><text x="460" y="170" font-size="26" text-anchor="middle">W- gg</text></g><g id="phenotype-3"><g transform="translate(760,65) scale(1.0)"><path d="M -33 -13 Q -40 -35 -17 -31 Q 0 -43 14 -30 Q 39 -35 31 -12 Q 42 7 26 20 Q 23 40 2 30 Q -19 42 -29 23 Q -42 11 -33 -13Z" fill="#E2C943" stroke="#596642" stroke-width="3"/><path d="M -19 -15 Q 2 -22 11 -10 Q -5 2 12 18 M -25 9 Q -14 1 -9 18" fill="none" stroke="#727138" stroke-width="3" stroke-linecap="round"/></g><text x="760" y="130" font-size="26" text-anchor="middle">Wrinkled, yellow</text><text x="760" y="170" font-size="26" text-anchor="middle">ww G-</text></g><g id="phenotype-4"><g transform="translate(1060,65) scale(1.0)"><path d="M -33 -13 Q -40 -35 -17 -31 Q 0 -43 14 -30 Q 39 -35 31 -12 Q 42 7 26 20 Q 23 40 2 30 Q -19 42 -29 23 Q -42 11 -33 -13Z" fill="#639E44" stroke="#596642" stroke-width="3"/><path d="M -19 -15 Q 2 -22 11 -10 Q -5 2 12 18 M -25 9 Q -14 1 -9 18" fill="none" stroke="#727138" stroke-width="3" stroke-linecap="round"/></g><text x="1060" y="130" font-size="26" text-anchor="middle">Wrinkled, green</text><text x="1060" y="170" font-size="26" text-anchor="middle">ww gg</text></g></g></svg>
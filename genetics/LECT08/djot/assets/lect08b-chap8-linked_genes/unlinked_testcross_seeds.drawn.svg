<svg xmlns="http://www.w3.org/2000/svg" width="800" height="510" viewBox="0 0 800 510" role="img"><title>unlinked testcross seeds</title><desc>Four equally frequent offspring from WwGg crossed with wwgg; each tester gamete is wg. Seed form and color are independent. Original illustration for LECT08B; schematic, not to scale.</desc><g font-family="Atkinson Hyperlegible Next, sans-serif" fill="#20262C"><text x="380" y="38" font-size="32" text-anchor="middle">WwGg &#215; wwgg</text><text x="380" y="82" font-size="27" text-anchor="middle">Tester gamete: wg only</text><g id="offspring-1"><text x="110" y="160" font-size="30" text-anchor="middle">WG  &#188;</text><path d="M 180 150 H 250" fill="none" stroke="#384E5B" stroke-width="3" stroke-linecap="round"/><g transform="translate(315,150) scale(0.8333333333333334)"><circle r="34" fill="#E2C943" stroke="#596642" stroke-width="3"/><path d="M -19 -14 Q -12 -25 2 -24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/></g><text x="450" y="160" font-size="30" text-anchor="middle">WwGg</text><text x="620" y="160" font-size="23" text-anchor="middle">round, yellow</text></g><g id="offspring-2"><text x="110" y="260" font-size="30" text-anchor="middle">Wg  &#188;</text><path d="M 180 250 H 250" fill="none" stroke="#384E5B" stroke-width="3" stroke-linecap="round"/><g transform="translate(315,250) scale(0.8333333333333334)"><circle r="34" fill="#639E44" stroke="#596642" stroke-width="3"/><path d="M -19 -14 Q -12 -25 2 -24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/></g><text x="450" y="260" font-size="30" text-anchor="middle">Wwgg</text><text x="620" y="260" font-size="23" text-anchor="middle">round, green</text></g><g id="offspring-3"><text x="110" y="360" font-size="30" text-anchor="middle">wG  &#188;</text><path d="M 180 350 H 250" fill="none" stroke="#384E5B" stroke-width="3" stroke-linecap="round"/><g transform="translate(315,350) scale(0.8333333333333334)"><path d="M -33 -13 Q -40 -35 -17 -31 Q 0 -43 14 -30 Q 39 -35 31 -12 Q 42 7 26 20 Q 23 40 2 30 Q -19 42 -29 23 Q -42 11 -33 -13Z" fill="#E2C943" stroke="#596642" stroke-width="3"/><path d="M -19 -15 Q 2 -22 11 -10 Q -5 2 12 18 M -25 9 Q -14 1 -9 18" fill="none" stroke="#727138" stroke-width="3" stroke-linecap="round"/></g><text x="450" y="360" font-size="30" text-anchor="middle">wwGg</text><text x="620" y="360" font-size="23" text-anchor="middle">wrinkled, yellow</text></g><g id="offspring-4"><text x="110" y="460" font-size="30" text-anchor="middle">wg  &#188;</text><path d="M 180 450 H 250" fill="none" stroke="#384E5B" stroke-width="3" stroke-linecap="round"/><g transform="translate(315,450) scale(0.8333333333333334)"><path d="M -33 -13 Q -40 -35 -17 -31 Q 0 -43 14 -30 Q 39 -35 31 -12 Q 42 7 26 20 Q 23 40 2 30 Q -19 42 -29 23 Q -42 11 -33 -13Z" fill="#639E44" stroke="#596642" stroke-width="3"/><path d="M -19 -15 Q 2 -22 11 -10 Q -5 2 12 18 M -25 9 Q -14 1 -9 18" fill="none" stroke="#727138" stroke-width="3" stroke-linecap="round"/></g><text x="450" y="460" font-size="30" text-anchor="middle">wwgg</text><text x="620" y="460" font-size="23" text-anchor="middle">wrinkled, green</text></g></g></svg>
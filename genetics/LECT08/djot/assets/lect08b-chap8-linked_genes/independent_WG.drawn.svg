<svg xmlns="http://www.w3.org/2000/svg" width="570" height="420" viewBox="0 0 570 420" role="img"><title>independent WG</title><desc>W and w segregate equally; G and g segregate independently, giving WG, Wg, wG and wg each one quarter. Original illustration for LECT08B; schematic, not to scale.</desc><g font-family="Arial, sans-serif" fill="#20262C"><text x="90" y="215" font-size="32" text-anchor="middle">WwGg</text><g id="segregation-W"><path d="M 155 205 L 220 110" fill="none" stroke="#384E5B" stroke-width="3" stroke-linecap="round"/><text x="270" y="110" font-size="32" text-anchor="middle">W  &#189;</text><path d="M 320 102 L 395 57" fill="none" stroke="#384E5B" stroke-width="3" stroke-linecap="round"/><text x="465" y="65" font-size="32" text-anchor="middle">WG  &#188;</text><path d="M 320 102 L 395 152" fill="none" stroke="#384E5B" stroke-width="3" stroke-linecap="round"/><text x="465" y="160" font-size="32" text-anchor="middle">Wg  &#188;</text></g><g id="segregation-w"><path d="M 155 205 L 220 310" fill="none" stroke="#384E5B" stroke-width="3" stroke-linecap="round"/><text x="270" y="310" font-size="32" text-anchor="middle">w  &#189;</text><path d="M 320 302 L 395 257" fill="none" stroke="#384E5B" stroke-width="3" stroke-linecap="round"/><text x="465" y="265" font-size="32" text-anchor="middle">wG  &#188;</text><path d="M 320 302 L 395 352" fill="none" stroke="#384E5B" stroke-width="3" stroke-linecap="round"/><text x="465" y="360" font-size="32" text-anchor="middle">wg  &#188;</text></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550">
<title>Trace a Double-Recombinant Chromatid</title>
<desc>Schematic of two participating nonsister chromatids. Original allele rows in D-C-H order are +c+ and d+h. The highlighted path starts on the first chromatid at D, switches to the second at C, and returns to the first at H. The product is +++, with parental outer +/+ alleles and the exchanged middle allele. The faint reciprocal path produces dch. Red identifies the CD interval and blue the CH interval.</desc>
<g font-family="Arial, sans-serif">
<text x="180" y="48" font-size="48" fill="#182033" text-anchor="middle" font-weight="bold">D</text><text x="600" y="48" font-size="48" fill="#182033" text-anchor="middle" font-weight="bold">C</text><text x="1020" y="48" font-size="48" fill="#182033" text-anchor="middle" font-weight="bold">H</text><text x="395" y="101" font-size="32" fill="#D40000" text-anchor="middle" font-weight="normal">C-D interval</text><text x="805" y="101" font-size="32" fill="#003FFF" text-anchor="middle" font-weight="normal">C-H interval</text><line x1="100" y1="200" x2="1100" y2="200" stroke="#CBD0D7" stroke-width="4"/><line x1="100" y1="360" x2="1100" y2="360" stroke="#CBD0D7" stroke-width="4"/><path d="M 100,360 H 300 L 500,200 H 700 L 900,360 H 1100" fill="none" stroke="#CBD0D7" stroke-width="4" stroke-dasharray="10 8"/><path d="M 100,200 H 300 L 500,360 H 600" fill="none" stroke="#D40000" stroke-width="8"/><path d="M 600,360 H 700 L 900,200 H 1100" fill="none" stroke="#003FFF" stroke-width="8"/><rect x="146" y="126" width="68" height="63" fill="#FFFFFF" stroke="#182033" stroke-width="3"/><text x="180" y="173" font-size="48" fill="#182033" text-anchor="middle" font-weight="bold">+</text><rect x="146" y="286" width="68" height="63" fill="#FFFFFF" stroke="none" stroke-width="3"/><text x="180" y="333" font-size="48" fill="#737C89" text-anchor="middle" font-weight="normal">d</text><rect x="566" y="126" width="68" height="63" fill="#FFFFFF" stroke="none" stroke-width="3"/><text x="600" y="173" font-size="48" fill="#737C89" text-anchor="middle" font-weight="normal">c</text><rect x="566" y="286" width="68" height="63" fill="#FFFFFF" stroke="#182033" stroke-width="3"/><text x="600" y="333" font-size="48" fill="#182033" text-anchor="middle" font-weight="bold">+</text><rect x="986" y="126" width="68" height="63" fill="#FFFFFF" stroke="#182033" stroke-width="3"/><text x="1020" y="173" font-size="48" fill="#182033" text-anchor="middle" font-weight="bold">+</text><rect x="986" y="286" width="68" height="63" fill="#FFFFFF" stroke="none" stroke-width="3"/><text x="1020" y="333" font-size="48" fill="#737C89" text-anchor="middle" font-weight="normal">h</text><text x="400" y="235" font-size="34" fill="#D40000" text-anchor="middle" font-weight="bold">1</text><text x="800" y="235" font-size="34" fill="#003FFF" text-anchor="middle" font-weight="bold">2</text><text x="600" y="458" font-size="40" fill="#182033" text-anchor="middle" font-weight="bold">Trace one chromatid:  +  +  +</text><text x="600" y="520" font-size="36" fill="#182033" text-anchor="middle" font-weight="normal">Two exchanges restore the parental D-H combination.</text>
</g>
</svg>

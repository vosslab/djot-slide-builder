<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430">
<title>Gene Order and Map Intervals</title>
<desc>D-C is 30 cM and C-H is 20 cM, drawn in a 30:20 ratio. The interval sum is 50 cM; D-H observed recombination remains 40%.</desc>
<g font-family="Arial, sans-serif">
<line x1="55" y1="150" x2="373.0" y2="150" stroke="#D40000" stroke-width="10"/><line x1="373.0" y1="150" x2="585" y2="150" stroke="#003FFF" stroke-width="10"/><text x="214.0" y="92" font-size="42" fill="#D40000" text-anchor="middle" font-weight="bold">30 cM</text><text x="479.0" y="92" font-size="42" fill="#003FFF" text-anchor="middle" font-weight="bold">20 cM</text><line x1="55" y1="133" x2="55" y2="167" stroke="#182033" stroke-width="5"/><text x="55" y="226" font-size="60" fill="#182033" text-anchor="middle" font-weight="bold">D</text><line x1="585" y1="133" x2="585" y2="167" stroke="#182033" stroke-width="5"/><text x="585" y="226" font-size="60" fill="#182033" text-anchor="middle" font-weight="bold">H</text><line x1="373.0" y1="133" x2="373.0" y2="167" stroke="#182033" stroke-width="5"/><text x="373.0" y="226" font-size="60" fill="#182033" text-anchor="middle" font-weight="bold">C</text><path d="M 55,248 V 263 H 585 V 248" fill="none" stroke="#182033" stroke-width="3"/><text x="320.0" y="316" font-size="38" fill="#182033" text-anchor="middle" font-weight="normal">30 + 20 = 50 cM</text><text x="320.0" y="394" font-size="38" fill="#A719DB" text-anchor="middle" font-weight="normal">D-H observed: 40%</text>
</g>
</svg>

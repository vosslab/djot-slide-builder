<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510">
<title>Gene Order and Map Intervals</title>
<desc>C lies between D and H. Reversing the map gives the equivalent H-C-D order.</desc>
<g font-family="Arial, sans-serif">
<text x="210" y="65" font-size="42" fill="#D40000" text-anchor="middle" font-weight="bold">CD: 30%</text><text x="600" y="65" font-size="42" fill="#003FFF" text-anchor="middle" font-weight="bold">CH: 20%</text><text x="990" y="65" font-size="42" fill="#A719DB" text-anchor="middle" font-weight="bold">DH: 40%</text><line x1="110" y1="225" x2="698.0" y2="225" stroke="#D40000" stroke-width="7"/><line x1="698.0" y1="225" x2="1090" y2="225" stroke="#003FFF" stroke-width="7"/><line x1="110" y1="208" x2="110" y2="242" stroke="#182033" stroke-width="5"/><text x="110" y="301" font-size="60" fill="#182033" text-anchor="middle" font-weight="bold">D</text><line x1="1090" y1="208" x2="1090" y2="242" stroke="#182033" stroke-width="5"/><text x="1090" y="301" font-size="60" fill="#182033" text-anchor="middle" font-weight="bold">H</text><line x1="698.0" y1="208" x2="698.0" y2="242" stroke="#182033" stroke-width="5"/><text x="698.0" y="301" font-size="60" fill="#182033" text-anchor="middle" font-weight="bold">C</text><text x="600.0" y="385" font-size="44" fill="#182033" text-anchor="middle" font-weight="normal">C lies between D and H.</text><text x="600.0" y="455" font-size="36" fill="#182033" text-anchor="middle" font-weight="normal">H-C-D is the same order reversed.</text>
</g>
</svg>

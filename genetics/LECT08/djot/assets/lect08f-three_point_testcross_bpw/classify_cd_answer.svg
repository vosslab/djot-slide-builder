<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="565" viewBox="0 0 1200 565">
<title>C-D Parental and Recombinant Comparisons</title>
<desc>Green references show both original parents with H covered. The offspring cd+ projects to cd; c+h projects to c+. The first is recombinant and the second matches a parental pair.</desc>
<g font-family="Arial, sans-serif">
<text x="600" y="38" font-size="36" fill="#182033" text-anchor="middle" font-weight="normal">Compare the C-D pair to either original parent.</text><text x="300" y="100" font-size="36" fill="#007A00" text-anchor="middle" font-weight="bold">Parent c++ (260)</text><text x="900" y="100" font-size="36" fill="#007A00" text-anchor="middle" font-weight="bold">Parent +dh (290)</text><text x="208" y="133" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">C</text><rect x="168" y="151" width="80" height="72" fill="#8FFF8F" stroke="none" stroke-width="2"/><text x="208" y="204" font-size="52" fill="#182033" text-anchor="middle" font-weight="bold">c</text><text x="300" y="133" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">D</text><rect x="260" y="151" width="80" height="72" fill="#8FFF8F" stroke="none" stroke-width="2"/><text x="300" y="204" font-size="52" fill="#182033" text-anchor="middle" font-weight="bold">+</text><text x="392" y="133" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">H</text><rect x="352" y="151" width="80" height="72" fill="#AAB2BC" stroke="none" stroke-width="2"/><text x="808" y="133" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">C</text><rect x="768" y="151" width="80" height="72" fill="#8FFF8F" stroke="none" stroke-width="2"/><text x="808" y="204" font-size="52" fill="#182033" text-anchor="middle" font-weight="bold">+</text><text x="900" y="133" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">D</text><rect x="860" y="151" width="80" height="72" fill="#8FFF8F" stroke="none" stroke-width="2"/><text x="900" y="204" font-size="52" fill="#182033" text-anchor="middle" font-weight="bold">d</text><text x="992" y="133" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">H</text><rect x="952" y="151" width="80" height="72" fill="#AAB2BC" stroke="none" stroke-width="2"/><line x1="80" y1="255" x2="1120" y2="255" stroke="#B7BDC5" stroke-width="2"/><text x="300" y="308" font-size="36" fill="#182033" text-anchor="middle" font-weight="normal">Offspring cd+ (120)</text><text x="208" y="338" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">C</text><rect x="168" y="356" width="80" height="72" fill="#FF8F8F" stroke="none" stroke-width="2"/><text x="208" y="409" font-size="52" fill="#182033" text-anchor="middle" font-weight="bold">c</text><text x="300" y="338" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">D</text><rect x="260" y="356" width="80" height="72" fill="#FF8F8F" stroke="none" stroke-width="2"/><text x="300" y="409" font-size="52" fill="#182033" text-anchor="middle" font-weight="bold">d</text><text x="392" y="338" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">H</text><rect x="352" y="356" width="80" height="72" fill="#AAB2BC" stroke="none" stroke-width="2"/><text x="300" y="487" font-size="38" fill="#D40000" text-anchor="middle" font-weight="bold">R: Recombinant</text><text x="900" y="308" font-size="36" fill="#182033" text-anchor="middle" font-weight="normal">Offspring c+h (75)</text><text x="808" y="338" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">C</text><rect x="768" y="356" width="80" height="72" fill="#D6FFAD" stroke="none" stroke-width="2"/><text x="808" y="409" font-size="52" fill="#182033" text-anchor="middle" font-weight="bold">c</text><text x="900" y="338" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">D</text><rect x="860" y="356" width="80" height="72" fill="#D6FFAD" stroke="none" stroke-width="2"/><text x="900" y="409" font-size="52" fill="#182033" text-anchor="middle" font-weight="bold">+</text><text x="992" y="338" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">H</text><rect x="952" y="356" width="80" height="72" fill="#AAB2BC" stroke="none" stroke-width="2"/><text x="900" y="487" font-size="38" fill="#3B7600" text-anchor="middle" font-weight="bold">P: Parental for C-D</text><text x="300" y="539" font-size="34" fill="#182033" text-anchor="middle" font-weight="normal">cd matches neither parent.</text><text x="900" y="539" font-size="34" fill="#182033" text-anchor="middle" font-weight="normal">c+ matches the first parent.</text>
</g>

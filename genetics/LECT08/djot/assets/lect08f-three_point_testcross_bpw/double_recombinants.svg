<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490">
<title>Double Recombinants Preserve the Outer Allele Combination</title>
<desc>Alleles are displayed in solved D-C-H map order. The c++ parental class becomes +c+ in this order and matches +++ at D and H. The +dh parental class becomes d+h and matches dch at D and H. Only the middle allele differs in each comparison. These are comparisons of offspring classes, not parent-offspring pedigrees.</desc>
<g font-family="Arial, sans-serif">
<text x="275" y="45" font-size="36" fill="#007A00" text-anchor="middle" font-weight="bold">Parental Combination</text><text x="875" y="45" font-size="36" fill="#182033" text-anchor="middle" font-weight="bold">Double Recombinant</text><text x="175" y="105" font-size="32" fill="#182033" text-anchor="middle" font-weight="normal">D</text><text x="275" y="105" font-size="32" fill="#182033" text-anchor="middle" font-weight="normal">C</text><text x="375" y="105" font-size="32" fill="#182033" text-anchor="middle" font-weight="normal">H</text><text x="775" y="105" font-size="32" fill="#182033" text-anchor="middle" font-weight="normal">D</text><text x="875" y="105" font-size="32" fill="#182033" text-anchor="middle" font-weight="normal">C</text><text x="975" y="105" font-size="32" fill="#182033" text-anchor="middle" font-weight="normal">H</text><rect x="135" y="140" width="80" height="75" fill="#8FFF8F" stroke="none" stroke-width="3"/><text x="175" y="196" font-size="54" fill="#182033" text-anchor="middle" font-weight="bold">+</text><rect x="235" y="140" width="80" height="75" fill="#8FFF8F" stroke="#182033" stroke-width="3"/><text x="275" y="196" font-size="54" fill="#182033" text-anchor="middle" font-weight="bold">c</text><rect x="335" y="140" width="80" height="75" fill="#8FFF8F" stroke="none" stroke-width="3"/><text x="375" y="196" font-size="54" fill="#182033" text-anchor="middle" font-weight="bold">+</text><rect x="735" y="140" width="80" height="75" fill="#F0F1F3" stroke="none" stroke-width="3"/><text x="775" y="196" font-size="54" fill="#182033" text-anchor="middle" font-weight="bold">+</text><rect x="835" y="140" width="80" height="75" fill="#F0F1F3" stroke="#182033" stroke-width="3"/><text x="875" y="196" font-size="54" fill="#182033" text-anchor="middle" font-weight="bold">+</text><rect x="935" y="140" width="80" height="75" fill="#F0F1F3" stroke="none" stroke-width="3"/><text x="975" y="196" font-size="54" fill="#182033" text-anchor="middle" font-weight="bold">+</text><text x="275" y="264" font-size="32" fill="#007A00" text-anchor="middle" font-weight="normal">260 offspring</text><text x="875" y="264" font-size="32" fill="#182033" text-anchor="middle" font-weight="normal">21 offspring</text><text x="575" y="187" font-size="32" fill="#182033" text-anchor="middle" font-weight="normal">Only C differs</text><rect x="135" y="330" width="80" height="75" fill="#8FFF8F" stroke="none" stroke-width="3"/><text x="175" y="386" font-size="54" fill="#182033" text-anchor="middle" font-weight="bold">d</text><rect x="235" y="330" width="80" height="75" fill="#8FFF8F" stroke="#182033" stroke-width="3"/><text x="275" y="386" font-size="54" fill="#182033" text-anchor="middle" font-weight="bold">+</text><rect x="335" y="330" width="80" height="75" fill="#8FFF8F" stroke="none" stroke-width="3"/><text x="375" y="386" font-size="54" fill="#182033" text-anchor="middle" font-weight="bold">h</text><rect x="735" y="330" width="80" height="75" fill="#F0F1F3" stroke="none" stroke-width="3"/><text x="775" y="386" font-size="54" fill="#182033" text-anchor="middle" font-weight="bold">d</text><rect x="835" y="330" width="80" height="75" fill="#F0F1F3" stroke="#182033" stroke-width="3"/><text x="875" y="386" font-size="54" fill="#182033" text-anchor="middle" font-weight="bold">c</text><rect x="935" y="330" width="80" height="75" fill="#F0F1F3" stroke="none" stroke-width="3"/><text x="975" y="386" font-size="54" fill="#182033" text-anchor="middle" font-weight="bold">h</text><text x="275" y="454" font-size="32" fill="#007A00" text-anchor="middle" font-weight="normal">290 offspring</text><text x="875" y="454" font-size="32" fill="#182033" text-anchor="middle" font-weight="normal">29 offspring</text><text x="575" y="377" font-size="32" fill="#182033" text-anchor="middle" font-weight="normal">Only C differs</text>
</g>
</svg>

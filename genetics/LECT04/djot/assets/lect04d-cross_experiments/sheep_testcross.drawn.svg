<svg xmlns="http://www.w3.org/2000/svg" width="760" height="503" viewBox="0 0 760 503" role="img" aria-labelledby="title desc">
  <title id="title">Sheep testcross: two possible genotypes</title>
  <desc id="desc">A black sheep of unknown genotype, BB or Bb, is crossed with a white bb sheep. The BB alternative gives four Bb cells and 100% black offspring. The Bb alternative gives Bb, bb, Bb, bb and 50% black, 50% white offspring. Five sheep icons illustrate the parents and the possible offspring phenotypes.</desc>
  <rect width="760" height="503" fill="#FFFFFF"/>
  <g id="labels-and-diagram" font-family="Atkinson Hyperlegible Next, sans-serif" fill="#213547" text-anchor="middle">
    <g id="parent-labels" font-size="22">
      <text x="190" y="25">Unknown dominant phenotype</text>
      <text x="190" y="51" font-weight="700">(BB or Bb)</text>
      <text x="570" y="25">Known homozygous recessive</text>
      <text x="570" y="51" font-weight="700">(bb)</text>
    </g>
    <g id="cross-symbol" stroke="#213547" stroke-width="5" stroke-linecap="round"><path d="M369 114 L391 136 M391 114 L369 136"/></g>
    <g id="branch-routes" fill="none" stroke="#43848D" stroke-width="5" stroke-linejoin="round">
      <path d="M380 163 V188 H190 V206 M380 188 H570 V206"/>
      <path d="M181 200 L190 209 L199 200 M561 200 L570 209 L579 200"/>
    </g>
    <g id="branch-labels" font-size="23">
      <text x="190" y="237">If unknown is</text>
      <text x="190" y="264" font-weight="700">homozygous (BB)</text>
      <text x="570" y="237">If unknown is</text>
      <text x="570" y="264" font-weight="700">heterozygous (Bb)</text>
    </g>

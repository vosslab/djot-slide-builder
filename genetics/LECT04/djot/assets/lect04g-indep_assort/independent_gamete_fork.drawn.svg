<svg xmlns="http://www.w3.org/2000/svg" width="406" height="383" viewBox="0 0 406 383" role="img" aria-labelledby="title desc" font-family="Atkinson Hyperlegible Next, sans-serif" fill="#243641" xml:space="preserve"><title id="title">Independent gamete segregation fork</title><desc id="desc">Two equally probable W or w branches each split into G or g, producing four equally probable gametes.</desc><rect width="406" height="383" fill="white" /><g id="first-heading"><rect x="110" y="1" width="149" height="68" rx="2" fill="#d9e8f2" stroke="#5596b5" stroke-width=".8" /><text x="117" y="23" font-size="16"><tspan font-style="normal">Segregation of</tspan></text><text x="117" y="44" font-size="16"><tspan font-style="italic">W</tspan><tspan font-style="normal"> and </tspan><tspan font-style="italic">w</tspan><tspan font-style="normal"> alleles</tspan></text></g><g id="second-heading"><rect x="266" y="1" width="138" height="68" rx="2" fill="#d9e8f2" stroke="#5596b5" stroke-width=".8" /><text x="273" y="20" font-size="16"><tspan font-style="normal">Independent</tspan></text><text x="273" y="40" font-size="16"><tspan font-style="normal">segregation of</tspan></text><text x="273" y="60" font-size="16"><tspan font-style="italic">G</tspan><tspan font-style="normal"> and </tspan><tspan font-style="italic">g</tspan><tspan font-style="normal"> alleles</tspan></text></g><text x="1" y="203" font-size="17" font-weight="700" id="parent-genotype"><tspan font-style="italic">Ww Gg</tspan></text><g id="first-W"><rect x="110" y="80" width="149" height="112" rx="2" fill="#d4c1da" stroke="none" stroke-width=".8" /><text x="116" y="141" font-size="16" id="fraction-first-W"><tspan font-size="12" dy="-3">1</tspan><tspan dy="3">/</tspan><tspan font-size="12" dy="3">2</tspan></text><text x="144" y="141" font-size="14"><tspan font-style="italic">W</tspan><tspan font-style="normal"> (and </tspan><tspan font-style="italic">G</tspan><tspan font-style="normal"> or </tspan><tspan font-style="italic">g</tspan><tspan font-style="normal">)</tspan></text></g><g id="first-w"><rect x="110" y="195" width="149" height="112" rx="2" fill="#d4c1da" stroke="none" stroke-width=".8" /><text x="116" y="256" font-size="16" id="fraction-first-w"><tspan font-size="12" dy="-3">1</tspan><tspan dy="3">/</tspan><tspan font-size="12" dy="3">2</tspan></text><text x="144" y="256" font-size="14"><tspan font-style="italic">w</tspan><tspan font-style="normal"> (and </tspan><tspan font-style="italic">G</tspan><tspan font-style="normal"> or </tspan><tspan font-style="italic">g</tspan><tspan font-style="normal">)</tspan></text></g><g id="outcome-WG"><rect x="266" y="80" width="138" height="55" rx="2" fill="#f8d18b" stroke="none" stroke-width=".8" /><text x="315" y="113" font-size="16" id="fraction-outcome-WG"><tspan font-size="12" dy="-3">1</tspan><tspan dy="3">/</tspan><tspan font-size="12" dy="3">4</tspan></text><text x="347" y="113" font-size="17"><tspan font-style="italic">WG</tspan></text></g><g id="outcome-Wg"><rect x="266" y="137" width="138" height="55" rx="2" fill="#f8d18b" stroke="none" stroke-width=".8" /><text x="315" y="170" font-size="16" id="fraction-outcome-Wg"><tspan font-size="12" dy="-3">1</tspan><tspan dy="3">/</tspan><tspan font-size="12" dy="3">4</tspan></text><text x="347" y="170" font-size="17"><tspan font-style="italic">Wg</tspan></text></g><g id="outcome-wG"><rect x="266" y="195" width="138" height="55" rx="2" fill="#f8d18b" stroke="none" stroke-width=".8" /><text x="315" y="228" font-size="16" id="fraction-outcome-wG"><tspan font-size="12" dy="-3">1</tspan><tspan dy="3">/</tspan><tspan font-size="12" dy="3">4</tspan></text><text x="347" y="228" font-size="17"><tspan font-style="italic">wG</tspan></text></g><g id="outcome-wg"><rect x="266" y="252" width="138" height="55" rx="2" fill="#f8d18b" stroke="none" stroke-width=".8" /><text x="315" y="285" font-size="16" id="fraction-outcome-wg"><tspan font-size="12" dy="-3">1</tspan><tspan dy="3">/</tspan><tspan font-size="12" dy="3">4</tspan></text><text x="347" y="285" font-size="17"><tspan font-style="italic">wg</tspan></text></g><g id="branch-arrows" fill="none" stroke="#24313a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g id="parent-W" data-from="parent" data-to="W"><path d="M68 177 L103 145" id="parent-W-shaft" /><path d="M96.105 156.724 L103 145 L90.707 150.820" id="parent-W-open-head" /></g><g id="parent-w" data-from="parent" data-to="w"><path d="M68 219 L103 251" id="parent-w-shaft" /><path d="M90.707 245.180 L103 251 L96.105 239.276" id="parent-w-open-head" /></g><g id="W-WG" data-from="W" data-to="WG"><path d="M268 126 L302 107" id="W-WG-shaft" /><path d="M292.603 116.833 L302 107 L288.700 109.850" id="W-WG-open-head" /></g><g id="W-Wg" data-from="W" data-to="Wg"><path d="M268 144 L302 162" id="W-Wg-shaft" /><path d="M288.639 159.453 L302 162 L292.382 152.382" id="W-Wg-open-head" /></g><g id="w-wG" data-from="w" data-to="wG"><path d="M268 242 L302 223" id="w-wG-shaft" /><path d="M292.603 232.833 L302 223 L288.700 225.850" id="w-wG-open-head" /></g><g id="w-wg" data-from="w" data-to="wg"><path d="M268 260 L302 278" id="w-wg-shaft" /><path d="M288.639 275.453 L302 278 L292.382 268.382" id="w-wg-open-head" /></g></g><g id="result"><rect x="110" y="331" width="294" height="50" rx="2" fill="#d9e8f2" stroke="#5596b5" stroke-width=".8" /><text x="117" y="351" font-size="15"><tspan font-style="normal">Result : An equal frequency of all</tspan></text><text x="117" y="373" font-size="15"><tspan font-style="normal">four possible types of gametes</tspan></text></g></svg>
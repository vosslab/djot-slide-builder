<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">SNP chip fluorescence patterns</title><desc id="desc">Original signal grid, Genetics LECT03D slide9. AT/AT: on,on,off,off. AT/CG: all on. CG/CG: off,off,on,on. Four columns retain source probe order. Binary states do not imply quantitative intensity.</desc><g font-family="Arial, sans-serif" fill="#253746"><text x="414" y="75" font-size="27" text-anchor="middle">Probe 1</text><text x="564" y="75" font-size="27" text-anchor="middle">Probe 2</text><text x="714" y="75" font-size="27" text-anchor="middle">Probe 3</text><text x="864" y="75" font-size="27" text-anchor="middle">Probe 4</text><text x="30" y="190" font-size="29" >Homozygous AT/AT</text><g id="signal-1-1"><circle cx="414" cy="180" r="40" fill="#FFD477" stroke="#7B4500" stroke-width="4"/><text x="414" y="190" font-size="26" text-anchor="middle">ON</text></g><g id="signal-1-2"><circle cx="564" cy="180" r="40" fill="#FFD477" stroke="#7B4500" stroke-width="4"/><text x="564" y="190" font-size="26" text-anchor="middle">ON</text></g><g id="signal-1-3"><circle cx="714" cy="180" r="40" fill="#FFFFFF" stroke="#7A858B" stroke-width="4"/><text x="714" y="190" font-size="26" text-anchor="middle">off</text></g><g id="signal-1-4"><circle cx="864" cy="180" r="40" fill="#FFFFFF" stroke="#7A858B" stroke-width="4"/><text x="864" y="190" font-size="26" text-anchor="middle">off</text></g><text x="30" y="365" font-size="29" >Heterozygous AT/CG</text><g id="signal-2-1"><circle cx="414" cy="355" r="40" fill="#FFD477" stroke="#7B4500" stroke-width="4"/><text x="414" y="365" font-size="26" text-anchor="middle">ON</text></g><g id="signal-2-2"><circle cx="564" cy="355" r="40" fill="#FFD477" stroke="#7B4500" stroke-width="4"/><text x="564" y="365" font-size="26" text-anchor="middle">ON</text></g><g id="signal-2-3"><circle cx="714" cy="355" r="40" fill="#FFD477" stroke="#7B4500" stroke-width="4"/><text x="714" y="365" font-size="26" text-anchor="middle">ON</text></g><g id="signal-2-4"><circle cx="864" cy="355" r="40" fill="#FFD477" stroke="#7B4500" stroke-width="4"/><text x="864" y="365" font-size="26" text-anchor="middle">ON</text></g><text x="30" y="540" font-size="29" >Homozygous CG/CG</text><g id="signal-3-1"><circle cx="414" cy="530" r="40" fill="#FFFFFF" stroke="#7A858B" stroke-width="4"/><text x="414" y="540" font-size="26" text-anchor="middle">off</text></g><g id="signal-3-2"><circle cx="564" cy="530" r="40" fill="#FFFFFF" stroke="#7A858B" stroke-width="4"/><text x="564" y="540" font-size="26" text-anchor="middle">off</text></g><g id="signal-3-3"><circle cx="714" cy="530" r="40" fill="#FFD477" stroke="#7B4500" stroke-width="4"/><text x="714" y="540" font-size="26" text-anchor="middle">ON</text></g><g id="signal-3-4"><circle cx="864" cy="530" r="40" fill="#FFD477" stroke="#7B4500" stroke-width="4"/><text x="864" y="540" font-size="26" text-anchor="middle">ON</text></g></g></svg>

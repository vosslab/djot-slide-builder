<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Genome information compared with books</title>
  <desc id="desc">Original composition preserving the examples in Genetics LECT03F, source image_008.png. Printing all of your DNA, 6.4 billion letters, would fill 4,200 books. 23andMe looks at less than 1% of your DNA, equivalent to 180 pages. Veritas sequences your whole genome, equivalent to 4,200 books. Assumes a book like Darwin's Origin of Species has 500 pages. The open book and library are schematic illustrations, not a proportional book count.</desc>
  <defs>
    <g id="upright-book" stroke="#213547" stroke-width="2.3" stroke-linejoin="round">
      <path d="M2 0 L34 -19 H65 V131 L34 150 H2 Z" fill="currentColor"/>
      <path d="M6 -1 L36 -17 H60 L31 0 Z" fill="#FFF9E9"/>
      <path d="M10 -3 L37 -17 M18 -3 L44 -17 M26 -3 L52 -17" fill="none" stroke="#C9BFA7" stroke-width="1"/>
      <path d="M32 0 L65 -19 V131 L32 150 Z" fill="#213547" fill-opacity="0.18"/>
      <path d="M2 0 Q-2 2 0 10 V141 Q-1 149 4 150 H32 V0 Z" fill="currentColor"/>
      <path d="M7 9 V139" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
      <path d="M10 24 H25 M10 30 H25 M10 119 H25 M10 125 H25" fill="none" stroke="#FFF9E9" stroke-width="2"/>
    </g>
  </defs>
  <rect width="1400" height="900" fill="#FFFFFF"/>
  <g id="printed-dna" font-family="Atkinson Hyperlegible Next, sans-serif" fill="#213547">
    <text x="70" y="68" font-size="37">If you printed all of your DNA (6.4 billion letters),</text>
    <text x="70" y="128" font-size="43">it would fill <tspan font-weight="bold" fill="#1C4470">4,200 books*</tspan>.</text>
  </g>
  <path d="M70 168 H1330" stroke="#CAD7E2" stroke-width="2"/>
  <g id="comparison-labels" font-family="Atkinson Hyperlegible Next, sans-serif" fill="#213547">
    <text x="95" y="230" font-size="37" font-weight="bold" fill="#8A410F">23andMe</text>
    <text x="95" y="275" font-size="31">looks at <tspan font-weight="bold">less than 1%</tspan></text>
    <text x="95" y="315" font-size="31">of your DNA</text>
    <text x="765" y="230" font-size="37" font-weight="bold" fill="#1C4470">Veritas</text>
    <text x="765" y="275" font-size="31">sequences your <tspan font-weight="bold">whole genome</tspan></text>
  </g>
  <g id="open-book" stroke-linejoin="round">
    <ellipse cx="325" cy="652" rx="229" ry="18" fill="#EEF0EF"/>
    <path d="M103 544 Q210 512 315 565 Q421 508 527 535 L547 636 Q431 603 324 654 Q215 615 108 645 Z" fill="#B96B30" stroke="#633D27" stroke-width="3"/>
    <path d="M115 539 Q219 507 315 562 Q413 506 515 531 L529 620 Q420 594 323 640 Q223 601 119 631 Z" fill="#E8DDC6" stroke="#99866B" stroke-width="2"/>
    <path d="M115 525 Q220 489 315 548 Q414 487 515 516 L529 605 Q417 578 323 627 Q221 585 119 616 Z" fill="#FFF9E9" stroke="#99866B" stroke-width="2.5"/>
    <path d="M315 548 Q308 582 323 627 Q329 578 315 548" fill="#D9CDB7"/>
    <path d="M128 622 Q228 597 323 634 Q423 589 523 614 M129 628 Q227 603 323 640 Q421 597 522 621" fill="none" stroke="#B7A88E" stroke-width="1.4"/>
    <path d="M142 541 Q222 520 284 551 M143 553 Q222 532 285 563 M145 565 Q224 544 287 575 M147 577 Q225 556 289 587 M149 589 Q226 568 291 599" fill="none" stroke="#B9AA91" stroke-width="2"/>
    <path d="M347 551 Q414 518 489 535 M348 563 Q415 530 491 547 M350 575 Q416 542 493 559 M352 587 Q416 554 495 571 M354 599 Q417 566 497 583" fill="none" stroke="#B9AA91" stroke-width="2"/>
    <path d="M295 551 L300 620 L310 614 L320 620 L311 548" fill="#C57635"/>
    <path d="M110 645 Q216 616 324 654 Q431 604 547 636" fill="none" stroke="#633D27" stroke-width="3"/>
  </g>
  <g id="library" stroke-linejoin="round">
    <ellipse cx="1000" cy="682" rx="318" ry="17" fill="#EEF0EF"/>
    <path d="M706 343 L740 323 H1292 V643 L1258 663 H706 Z" fill="#E3D9C6" stroke="#80745E" stroke-width="2.5"/>
    <path d="M728 355 H1238 V643 H728 Z" fill="#F6F1E7"/>
    <path d="M1258 343 L1292 323 V643 L1258 663 Z" fill="#B5A588" stroke="#80745E" stroke-width="2.5"/>
    <path d="M706 343 L740 323 H1292 L1258 343 Z" fill="#EEE6D7" stroke="#80745E" stroke-width="2.5"/>
    <g id="upper-shelf-books">
      <use xlink:href="#upright-book" transform="translate(736 353) scale(.82 .89)" color="#3177A4"/>
      <use xlink:href="#upright-book" transform="translate(783 367) scale(.86 .80)" color="#527D6D"/>
      <use xlink:href="#upright-book" transform="translate(830 350) scale(.80 .91)" color="#B07438"/>
      <use xlink:href="#upright-book" transform="translate(875 357) scale(.85 .865)" color="#3177A4"/>
      <use xlink:href="#upright-book" transform="translate(923 371) scale(.82 .77)" color="#527D6D"/>
      <use xlink:href="#upright-book" transform="translate(970 353) scale(.90 .89)" color="#3177A4"/>
      <use xlink:href="#upright-book" transform="translate(1020 362) scale(.82 .83)" color="#B07438"/>
      <use xlink:href="#upright-book" transform="translate(1067 351) scale(.85 .905)" color="#527D6D"/>
      <use xlink:href="#upright-book" transform="translate(1115 358) scale(.85 .86)" color="#3177A4"/>
      <use xlink:href="#upright-book" transform="translate(1163 364) scale(.82 .82)" color="#B07438"/>
    </g>
    <path d="M706 490 L740 470 H1292 L1258 490 Z" fill="#EEE6D7" stroke="#80745E" stroke-width="2"/>
    <path d="M706 490 H1258 V503 H706 Z" fill="#C4B496" stroke="#80745E" stroke-width="2"/>
    <g id="lower-shelf-books">
      <use xlink:href="#upright-book" transform="translate(736 520) scale(.82 .82)" color="#527D6D"/>
      <use xlink:href="#upright-book" transform="translate(783 512) scale(.86 .875)" color="#3177A4"/>
      <use xlink:href="#upright-book" transform="translate(830 528) scale(.80 .77)" color="#B07438"/>
      <use xlink:href="#upright-book" transform="translate(875 508) scale(.85 .90)" color="#527D6D"/>
      <use xlink:href="#upright-book" transform="translate(923 520) scale(.82 .82)" color="#3177A4"/>
      <use xlink:href="#upright-book" transform="translate(970 514) scale(.90 .86)" color="#B07438"/>
      <use xlink:href="#upright-book" transform="translate(1020 523) scale(.82 .80)" color="#3177A4"/>
      <use xlink:href="#upright-book" transform="translate(1067 509) scale(.85 .895)" color="#527D6D"/>
      <use xlink:href="#upright-book" transform="translate(1115 518) scale(.85 .835)" color="#B07438"/>
      <use xlink:href="#upright-book" transform="translate(1163 512) scale(.82 .875)" color="#3177A4"/>
    </g>
    <path d="M706 646 L740 626 H1292 L1258 646 Z" fill="#EEE6D7" stroke="#80745E" stroke-width="2"/>
    <path d="M706 646 H1258 V663 H706 Z" fill="#C4B496" stroke="#80745E" stroke-width="2"/>
    <path d="M706 343 H724 V663 H706 Z M1240 343 H1258 V663 H1240 Z" fill="#D1C3A9" stroke="#80745E" stroke-width="2"/>
  </g>
  <g id="equivalent-volumes" font-family="Atkinson Hyperlegible Next, sans-serif" text-anchor="middle">
    <text x="325" y="712" font-size="26" fill="#526879">equivalent to</text>
    <text x="325" y="758" font-size="43" font-weight="bold" fill="#8A410F">180 pages</text>
    <text x="1000" y="712" font-size="26" fill="#526879">equivalent to</text>
    <text x="1000" y="758" font-size="43" font-weight="bold" fill="#1C4470">4,200 books</text>
  </g>
  <g id="assumption-and-scale" font-family="Atkinson Hyperlegible Next, sans-serif" fill="#526879">
    <text x="70" y="830" font-size="26">* Assuming that a book, like Darwin's <tspan font-style="italic">Origin of Species</tspan>, has 500 pages.</text>
    <text x="70" y="871" font-size="24">Book forms are schematic; quantities are given by the labels.</text>
  </g>
</svg>

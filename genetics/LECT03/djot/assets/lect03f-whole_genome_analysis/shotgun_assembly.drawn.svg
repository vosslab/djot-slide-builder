<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc">
<title id="title">Shotgun sequencing, stage 3</title>
<desc id="desc">Genetics LECT03F original slides 6-8. Schematic, not to scale. Purple chromosomal DNA is randomly fragmented; three selected fragments are cloned in circular vectors. Fragment number and vector proportions are illustrative. Sequenced reads: CGCCATCAGT; AGTCCGCTATACGA; ACGATACTGGT. Aligned read starts at zero-based offsets 0, 7, 17. Exact overlaps AGT (3 bases) and ACGA (4 bases). Bars are proportional to sequence length. Assembled sequence: CGCCATCAGTCCGCTATACGATACTGGT (28 bases).</desc>

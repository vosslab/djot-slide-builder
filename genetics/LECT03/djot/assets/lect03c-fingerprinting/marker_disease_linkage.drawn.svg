<rect id="disease-locus" x="790" y="383" width="76" height="62" fill="#cf644b"/>
<path d="M66 391 H546 M646 391 H784 M872 391 H1309" fill="none" stroke="#f0d49c" stroke-width="3" opacity=".75"/>
<g font-family="Atkinson Hyperlegible Next, sans-serif" fill="#263844">
<g id="close-callout"><rect x="30" y="105" width="620" height="176" rx="8" fill="#e4eff6" stroke="#6a9fbd" stroke-width="2"/>
<text x="48" y="140" text-anchor="start" font-size="32">DNA markers that are close enough to a</text>
<text x="48" y="178" text-anchor="start" font-size="32">disease gene tend to be inherited</text>
<text x="48" y="216" text-anchor="start" font-size="32">together (genetically linked) with the</text>
<text x="48" y="254" text-anchor="start" font-size="32">disease gene.</text>
</g>
<g id="far-callout"><rect x="1040" y="35" width="730" height="214" rx="8" fill="#e4eff6" stroke="#6a9fbd" stroke-width="2"/>
<text x="1058" y="70" text-anchor="start" font-size="32">DNA markers that are too far from the disease</text>
<text x="1058" y="108" text-anchor="start" font-size="32">gene in the chromosome (or are in a different</text>
<text x="1058" y="146" text-anchor="start" font-size="32">chromosome) are not linked to the disease gene.</text>
<text x="1058" y="184" text-anchor="start" font-size="32">They do not tend to be inherited with the disease</text>
<text x="1058" y="222" text-anchor="start" font-size="32">gene in pedigrees.</text>
</g>
<g id="proximity-callout"><rect x="805" y="530" width="965" height="100" rx="8" fill="#fae9d8" stroke="#d2a47a" stroke-width="2"/>
<text x="823" y="565" text-anchor="start" font-size="32">The closer a marker is to the disease gene, the closer the linkage</text>
<text x="823" y="603" text-anchor="start" font-size="32">and the more likely it is that they will be inherited together.</text>
</g>
<text x="800" y="36" text-anchor="middle" font-size="30">Locus of a &#8220;disease gene&#8221;</text>
<text x="800" y="76" text-anchor="middle" font-size="30">(a genetic risk factor), <tspan font-style="italic">D</tspan></text>
<text x="828" y="428" text-anchor="middle" font-size="37"><tspan font-style="italic" fill="white">D</tspan></text>
<text x="235" y="555" text-anchor="middle" font-size="31">DNA polymorphisms</text>
<text x="235" y="593" text-anchor="middle" font-size="31">(genetic markers) along</text>
<text x="235" y="631" text-anchor="middle" font-size="31">the chromosomes</text>
</g>

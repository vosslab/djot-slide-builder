<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700" role="img" aria-labelledby="title desc"><title id="title">Disease gene mapping with DNA markers</title><desc id="desc">An unreplicated chromosome has distributed purple DNA markers and a red disease locus D. Callouts distinguish close linked markers from distant markers; marker positions are schematic.</desc><rect width="1800" height="700" fill="white"/>

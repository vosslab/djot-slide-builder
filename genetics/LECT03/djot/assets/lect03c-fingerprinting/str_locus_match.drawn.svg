<svg xmlns="http://www.w3.org/2000/svg" width="1402" height="617" viewBox="0 0 1402 617" role="img" aria-labelledby="title desc">
<title id="title">Short tandem repeat comparison at two loci</title><desc id="desc">Two samples are compared at two STR loci. Crime scene DNA above and suspect DNA below each have seven AGAT modules at site 1. At site 2, the crime scene has eight GATA modules and the suspect has thirteen. Each visible outlined module denotes one motif copy; the internal line separates two schematic DNA rails and is not a second copy. Original vector construction from image_006.png, whose source footer credits Copyright 2009 Pearson Education, Inc.; that source provenance is not a copyright claim on this new artwork. The drawing is schematic and not to scale.</desc>

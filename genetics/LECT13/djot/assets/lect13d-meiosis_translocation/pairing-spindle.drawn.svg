58" font-family="Arial" font-size="29" fill="#243447">3</text></g><g id="chromosome-2"><path d="M233 460 L233 307" stroke="#246ab2" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M233 307 L80 307" stroke="#246ab2" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M247 460 L247 293" stroke="#246ab2" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M247 293 L80 293" stroke="#246ab2" stroke-width="10" stroke-linecap="round" fill="none"/><ellipse cx="240" cy="390" rx="19" ry="11" fill="#246ab2" stroke="white" stroke-width="2"/><text x="194" y="398" font-family="Arial" font-size="29" fill="#243447">2</text></g><g id="chromosome-4"><path d="M293 460 L293 293" stroke="#246ab2" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M293 293 L460 293" stroke="#bd333b" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M307 460 L307 307" stroke="#246ab2" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M307 307 L460 307" stroke="#bd333b" stroke-width="10" stroke-linecap="round" fill="none"/><ellipse cx="300" cy="390" rx="19" ry="11" fill="#246ab2" stroke="white" stroke-width="2"/><text x="328" y="398" font-family="Arial" font-size="29" fill="#9d247e">4</text></g><text x="65" y="515" font-family="Arial" font-size="25" fill="#243447">4 chromosomes / 8 chromatids</text></svg>
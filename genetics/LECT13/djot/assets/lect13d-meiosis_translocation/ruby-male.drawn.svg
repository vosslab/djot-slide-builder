<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" aria-labelledby="title desc"><title id="title">ruby-male</title><desc id="desc">Male carries ID1 X+part2 rb+; ID3 normalY; ID4 2+partX dp+; ID2normal2 dp. No crossing over in males. Original schematic based on source LECT13D. Not to scale.</desc><rect width="680" height="430" fill="white"/><text x="35" y="58" font-family="Arial" font-size="24" fill="#982079">1</text><path d="M75 50 L382.4 50" stroke="#667f89" stroke-width="13" stroke-linecap="round" fill="none"/><path d="M382.4 50 L605 50" stroke="#246ab2" stroke-width="13" stroke-linecap="round" fill="none"/><circle cx="181.0" cy="50" r="11" fill="#667f89" stroke="white" stroke-width="2"/><text x="100" y="35" font-family="Arial" font-size="22" fill="#263747">rb+</text><text x="75" y="84" font-family="Arial" font-size="21" fill="#263747">X + part of 2</text><text x="35" y="158" font-family="Arial" font-size="24" fill="#263747">3</text><path d="M75 150 L477.8 150" stroke="#bd333b" stroke-width="13" stroke-linecap="round" fill="none"/><path d="M477.8 150 L605 150" stroke="#bd333b" stroke-width="13" stroke-linecap="round" fill="none"/><circle cx="276.4" cy="150" r="11" fill="#bd333b" stroke="white" stroke-width="2"/><text x="75" y="184" font-family="Arial" font-size="21" fill="#263747">Normal Y</text><text x="35" y="258" font-family="Arial" font-size="24" fill="#982079">4</text><path d="M75 250 L477.8 250" stroke="#246ab2" stroke-width="13" stroke-linecap="round" fill="none"/><path d="M477.8 250 L605 250" stroke="#667f89" stroke-width="13" stroke-linecap="round" fill="none"/><circle cx="350.6" cy="250" r="11" fill="#246ab2" stroke="white" stroke-width="2"/><text x="100" y="235" font-family="Arial" font-size="22" fill="#263747">dp+</text><text x="75" y="284" font-family="Arial" font-size="21" fill="#263747">2 + part of X</text><text x="35" y="358" font-family="Arial" font-size="24" fill="#263747">2</text><path d="M75 350 L477.8 350" stroke="#246ab2" stroke-width="13" stroke-linecap="round" fill="none"/><path d="M477.8 350 L605 350" stroke="#246ab2" stroke-width="13" stroke-linecap="round" fill="none"/><circle cx="350.6" cy="350" r="11" fill="#246ab2" stroke="white" stroke-width="2"/><text x="100" y="335" font-family="Arial" font-size="22" fill="#263747">dp</text><text x="75" y="384" font-family="Arial" font-size="21" fill="#263747">Normal 2</text></svg>
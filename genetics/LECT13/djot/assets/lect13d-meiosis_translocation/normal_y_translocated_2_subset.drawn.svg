<?xml version='1.0' encoding='ascii'?>
<svg xmlns="http://www.w3.org/2000/svg" width="742" height="105" viewBox="0 0 742 105" role="img" aria-labelledby="title desc"><title id="title">Normal y translocated 2 subset</title><desc id="desc">Two source-specific unreplicated chromosome rods with integrated round centromeres and original row and allele labels.</desc><defs><linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#df5146" /><stop offset="1" stop-color="#ba302b" /></linearGradient>

<svg xmlns="http://www.w3.org/2000/svg" width="1348.5" height="862" viewBox="0 0 1348.5 862" role="img" aria-labelledby="title desc">
<title id="title">Reciprocal-translocation gamete products</title>
<desc id="desc">Three columns of four gametes, each with two unreplicated chromosomes. Source red and blue ancestry segments and the distinct final two normal chromosome orders are preserved.</desc>

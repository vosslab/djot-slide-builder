<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="300" viewBox="0 0 1300 300" role="img" aria-labelledby="title desc"><title id="title">ruby-surviving-products</title><desc id="desc">Surviving offspring: 50% non-ruby non-dumpy daughters from1+4;50% ruby dumpysons from2+3. Maternal gamete carriesXrb and2dp. Original schematic based on source LECT13D. Not to scale.</desc><rect width="1300" height="300" fill="white"/><text x="65" y="40" font-family="Arial" font-size="28" fill="#263747">50% wildtype females</text><text x="30" y="108" font-family="Arial" font-size="24" fill="#982079">1</text><path d="M70 100 L360.0 100" stroke="#667f89" stroke-width="13" stroke-linecap="round" fill="none"/><path d="M360.0 100 L570 100" stroke="#246ab2" stroke-width="13" stroke-linecap="round" fill="none"/><circle cx="170.0" cy="100" r="11" fill="#667f89" stroke="white" stroke-width="2"/><text x="95" y="85" font-family="Arial" font-size="22" fill="#263747">rb+</text><text x="70" y="134" font-family="Arial" font-size="21" fill="#263747">X + part of 2</text><text x="30" y="208" font-family="Arial" font-size="24" fill="#982079">4</text><path d="M70 200 L450.0 200" stroke="#246ab2" stroke-width="13" stroke-linecap="round" fill="none"/><path d="M450.0 200 L570 200" stroke="#667f89" stroke-width="13" stroke-linecap="round" fill="none"/><circle cx="330.0" cy="200" r="11" fill="#246ab2" stroke="white" stroke-width="2"/><text x="95" y="185" font-family="Arial" font-size="22" fill="#263747">dp+</text><text x="70" y="234" font-family="Arial" font-size="21" fill="#263747">2 + part of X</text><text x="715" y="40" font-family="Arial" font-size="28" fill="#263747">50% ruby, dumpy males</text><text x="680" y="108" font-family="Arial" font-size="24" fill="#263747">2</text><path d="M720 100 L1100.0 100" stroke="#246ab2" stroke-width="13" stroke-linecap="round" fill="none"/><path d="M1100.0 100 L1220 100" stroke="#246ab2" stroke-width="13" stroke-linecap="round" fill="none"/><circle cx="980.0" cy="100" r="11" fill="#246ab2" stroke="white" stroke-width="2"/><text x="745" y="85" font-family="Arial" font-size="22" fill="#263747">dp</text><text x="720" y="134" font-family="Arial" font-size="21" fill="#263747">Normal 2</text><text x="680" y="208" font-family="Arial" font-size="24" fill="#263747">3</text><path d="M720 200 L1100.0 200" stroke="#bd333b" stroke-width="13" stroke-linecap="round" fill="none"/><path d="M1100.0 200 L1220 200" stroke="#bd333b" stroke-width="13" stroke-linecap="round" fill="none"/><circle cx="910.0" cy="200" r="11" fill="#bd333b" stroke="white" stroke-width="2"/><text x="720" y="234" font-family="Arial" font-size="21" fill="#263747">Normal Y</text></svg>
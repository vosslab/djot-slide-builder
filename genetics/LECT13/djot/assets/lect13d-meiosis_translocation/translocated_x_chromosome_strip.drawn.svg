<svg xmlns="http://www.w3.org/2000/svg" width="527" height="60" viewBox="0 0 527 60" role="img" aria-labelledby="title desc"><title id="title">Translocated X chromosome</title><desc id="desc">One source-specific unreplicated chromosome with a round integrated centromere and the original allele label.</desc><defs><linearGradient id="slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7895a2" /><stop offset="1" stop-color="#546e7b" /></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#367cb7" /><stop offset="1" stop-color="#235d9a" /></linearGradient>
<clipPath id="rod-clip-1"><rect x="184" y="15" width="320" height="26" rx="13" /></clipPath>
</defs><rect width="527" height="60" fill="white" /><g font-family="Atkinson Hyperlegible Next" font-size="26" fill="#17191c" transform="translate(1 3)"><g id="row-1">
<text id="row-1-label" x="15" y="37">X + part of 2</text>
<g id="row-1-rod">
<rect id="row-1-continuous-body" x="184" y="15" width="320" height="26" rx="13" fill="url(#slate)" />
<g id="row-1-distal-segment" clip-path="url(#rod-clip-1)"><rect x="366" y="15" width="138" height="26" fill="url(#blue)" /></g>
<rect x="184" y="15" width="320" height="26" rx="13" fill="none" stroke="#b1bdcf" stroke-width="1.3" />
<circle id="row-1-centromere" cx="236" cy="28" r="15" fill="url(#slate)" stroke="#b1bdcf" stroke-width="1.3" />
</g>
<text id="row-1-allele" x="279" y="37" fill="white" font-style="italic" font-weight="600">rb<tspan font-size="18" font-style="normal" baseline-shift="super">+</tspan></text>
</g>
</g></svg>

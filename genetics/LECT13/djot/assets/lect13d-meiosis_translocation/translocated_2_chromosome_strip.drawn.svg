<svg xmlns="http://www.w3.org/2000/svg" width="730" height="60" viewBox="0 0 730 60" role="img" aria-labelledby="title desc"><title id="title">Translocated chromosome 2</title><desc id="desc">One source-specific unreplicated chromosome with a round integrated centromere and the original allele label.</desc><defs><linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#367cb7" /><stop offset="1" stop-color="#235d9a" /></linearGradient>
<linearGradient id="slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7895a2" /><stop offset="1" stop-color="#546e7b" /></linearGradient>
<clipPath id="rod-clip-3"><rect x="184" y="121" width="535" height="26" rx="13" /></clipPath>
</defs><rect width="730" height="60" fill="white" /><g font-family="Atkinson Hyperlegible Next" font-size="26" fill="#17191c" transform="translate(-5 -105)"><g id="row-3">
<text id="row-3-label" x="15" y="143">2 + part of X</text>
<g id="row-3-rod">
<rect id="row-3-continuous-body" x="184" y="121" width="535" height="26" rx="13" fill="url(#blue)" />
<g id="row-3-distal-segment" clip-path="url(#rod-clip-3)"><rect x="582" y="121" width="137" height="26" fill="url(#slate)" /></g>
<rect x="184" y="121" width="535" height="26" rx="13" fill="none" stroke="#b1bdcf" stroke-width="1.3" />
<circle id="row-3-centromere" cx="451" cy="134" r="15" fill="url(#blue)" stroke="#b1bdcf" stroke-width="1.3" />
</g>
<text id="row-3-allele" x="279" y="143" fill="white" font-style="italic" font-weight="600">dp<tspan font-size="18" font-style="normal" baseline-shift="super">+</tspan></text>
</g>
</g></svg>

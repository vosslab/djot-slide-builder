<svg xmlns="http://www.w3.org/2000/svg" width="540" height="545" viewBox="0 0 540 545" role="img" aria-labelledby="title desc"><title id="title">pairing-flat</title><desc id="desc">Flat four-way pairing. Each chromosome has two sister chromatids. 1 and 4 have exchanged terminal regions. This is pairing topology, not physical scale. Original schematic based on LECT13D image_006 and image_008.</desc><rect width="540" height="545" fill="white"/><g id="chromosome-1"><path d="M233 80 L233 233" stroke="#bd333b" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M233 233 L80 233" stroke="#246ab2" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M247 80 L247 247" stroke="#bd333b" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M247 247 L80 247" stroke="#246ab2" stroke-width="10" stroke-linecap="round" fill="none"/><ellipse cx="240" cy="150" rx="19" ry="11" fill="#bd333b" stroke="white" stroke-width="2"/><text x="194" y="158" font-family="Atkinson Hyperlegible Next" font-size="29" fill="#9d247e">1</text></g><g id="chromosome-3"><path d="M293 80 L293 247" stroke="#bd333b" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M293 247 L460 247" stroke="#bd333b" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M307 80 L307 233" stroke="#bd333b" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M307 233 L460 233" stroke="#bd333b" stroke-width="10" stroke-linecap="round" fill="none"/><ellipse cx="300" cy="150" rx="19" ry="11" fill="#bd333b" stroke="white" stroke-width="2"/><text x="328" y="158" font-family="Atkinson Hyperlegible Next" font-size="29" fill="#243447">3</text></g><g id="chromosome-2"><path d="M233 460 L233 307" stroke="#246ab2" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M233 307 L80 307" stroke="#246ab2" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M247 460 L247 293" stroke="#246ab2" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M247 293 L80 293" stroke="#246ab2" stroke-width="10" stroke-linecap="round" fill="none"/><ellipse cx="240" cy="390" rx="19" ry="11" fill="#246ab2" stroke="white" stroke-width="2"/><text x="194" y="398" font-family="Atkinson Hyperlegible Next" font-size="29" fill="#243447">2</text></g><g id="chromosome-4"><path d="M293 460 L293 293" stroke="#246ab2" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M293 293 L460 293" stroke="#bd333b" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M307 460 L307 307" stroke="#246ab2" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M307 307 L460 307" stroke="#bd333b" stroke-width="10" stroke-linecap="round" fill="none"/><ellipse cx="300" cy="390" rx="19" ry="11" fill="#246ab2" stroke="white" stroke-width="2"/><text x="328" y="398" font-family="Atkinson Hyperlegible Next" font-size="29" fill="#9d247e">4</text></g><text x="65" y="515" font-family="Atkinson Hyperlegible Next" font-size="25" fill="#243447">4 chromosomes / 8 chromatids</text></svg>
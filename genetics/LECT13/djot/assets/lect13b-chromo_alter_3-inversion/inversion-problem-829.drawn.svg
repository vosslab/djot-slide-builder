<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-labelledby="title desc"><title id="title">Inversion heterozygote</title><desc id="desc">Source problem 8.29: one chromosome has gene order A D C B E; its homolog has a b c d e. Centromeres lie before A and a. The D C B interval is inverted. Original schematic; not to scale.</desc><rect width="900" height="290" fill="white"/><g id="homolog-ADCBE"><path d="M40 80 H845" stroke="#5d94c3" stroke-width="32" stroke-linecap="round"/><circle cx="155" cy="80" r="24" fill="#5d94c3" stroke="white" stroke-width="3"/><text x="235" y="93" text-anchor="middle" font-family="Arial" font-style="italic" font-size="38" fill="#142332">A</text><rect x="317" y="58" width="96" height="44" rx="5" fill="#ad465c"/><text x="365" y="93" text-anchor="middle" font-family="Arial" font-style="italic" font-size="38" fill="white">D</text><rect x="447" y="58" width="96" height="44" rx="5" fill="#ad465c"/><text x="495" y="93" text-anchor="middle" font-family="Arial" font-style="italic" font-size="38" fill="white">C</text><rect x="577" y="58" width="96" height="44" rx="5" fill="#ad465c"/><text x="625" y="93" text-anchor="middle" font-family="Arial" font-style="italic" font-size="38" fill="white">B</text><text x="755" y="93" text-anchor="middle" font-family="Arial" font-style="italic" font-size="38" fill="#142332">E</text></g><g id="homolog-abcde"><path d="M40 210 H845" stroke="#5d94c3" stroke-width="32" stroke-linecap="round"/><circle cx="155" cy="210" r="24" fill="#5d94c3" stroke="white" stroke-width="3"/><text x="235" y="223" text-anchor="middle" font-family="Arial" font-style="italic" font-size="38" fill="#142332">a</text><text x="365" y="223" text-anchor="middle" font-family="Arial" font-style="italic" font-size="38" fill="#142332">b</text><text x="495" y="223" text-anchor="middle" font-family="Arial" font-style="italic" font-size="38" fill="#142332">c</text><text x="625" y="223" text-anchor="middle" font-family="Arial" font-style="italic" font-size="38" fill="#142332">d</text><text x="755" y="223" text-anchor="middle" font-family="Arial" font-style="italic" font-size="38" fill="#142332">e</text></g></svg>
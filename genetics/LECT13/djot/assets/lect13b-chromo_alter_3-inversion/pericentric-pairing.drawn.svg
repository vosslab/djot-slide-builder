<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Pericentric inversion loop</title><desc id="description">Four physical chromatids pair in an inversion loop. The orange and ochre inverted homolog has c before b; the blue and green normal homolog has b before c. A single exchange involves the ochre and green nonsisters. Centromeres are inside the inverted interval. White gaps indicate overpasses.</desc>
<metadata>Original editable schematic, created 2026-11-10. Source facts: genetics/LECT13/djot/assets/lect13b-chromo_alter_3-inversion/image_010.png; original ODP slides 6, 10, 12, 14, 16. Geometry newly composed, not traced. Unmeasured. Source labels and stage/copy counts preserved.</metadata>

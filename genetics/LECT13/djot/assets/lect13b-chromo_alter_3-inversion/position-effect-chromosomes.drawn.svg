<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">position effect chromosomes</title><desc id="desc">Normal and inverted X chromosomes retain w+. Inversion moves the locus beside heterochromatin; a small heterochromatic segment moves into euchromatin. Break sites and centromere retained from source.</desc><rect width="1100" height="420" fill="white"/><g font-family="Atkinson Hyperlegible Next"><text x="35" y="55" font-size="29" text-anchor="start" fill="#172A3A">Normal X chromosome</text><path d="M65 110 H1000" fill="none" stroke="#338B7B" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M710 110 H1000" fill="none" stroke="#B15C12" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle cx="935" cy="110" r="11" fill="white" stroke="#172A3A" stroke-width="4"/><rect x="160" y="88" width="65" height="44" fill="#812F46" rx="4"/><text x="192" y="119" font-size="27" text-anchor="middle" fill="white">w+</text><path d="M150 68 V83" fill="none" stroke="#AC233F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="143,78 157,78 150,90" fill="#AC233F"/><path d="M700 68 V83" fill="none" stroke="#AC233F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="693,78 707,78 700,90" fill="#AC233F"/><text x="150" y="168" font-size="24" text-anchor="start" fill="#172A3A">Breakpoints bracket the inverted segment</text><text x="770" y="168" font-size="23" text-anchor="start" fill="#172A3A">Heterochromatin</text><text x="35" y="245" font-size="29" text-anchor="start" fill="#172A3A">Inverted X chromosome</text><path d="M65 300 H1000" fill="none" stroke="#338B7B" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M700 300 H1000" fill="none" stroke="#B15C12" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle cx="935" cy="300" r="11" fill="white" stroke="#172A3A" stroke-width="4"/><rect x="635" y="278" width="65" height="44" fill="#812F46" rx="4"/><text x="667" y="309" font-size="27" text-anchor="middle" fill="white">w+</text><path d="M100 300 H145" fill="none" stroke="#B15C12" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 258 V273" fill="none" stroke="#AC233F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="143,268 157,268 150,280" fill="#AC233F"/><path d="M700 258 V273" fill="none" stroke="#AC233F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="693,268 707,268 700,280" fill="#AC233F"/><text x="150" y="358" font-size="24" text-anchor="start" fill="#172A3A">w+ is now beside heterochromatin</text><text x="770" y="358" font-size="23" text-anchor="start" fill="#172A3A">Heterochromatin</text></g></svg>
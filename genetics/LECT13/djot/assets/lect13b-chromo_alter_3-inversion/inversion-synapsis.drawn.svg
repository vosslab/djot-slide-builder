<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090" role="img" aria-labelledby="title description">
<title id="title">Homologous chromosome pairing with an inversion</title><desc id="description">Two chromosome ribbons show reversed gene-for-gene attraction within an inverted interval, then a physical pairing loop. This overview does not depict four chromatids or crossing over.</desc>

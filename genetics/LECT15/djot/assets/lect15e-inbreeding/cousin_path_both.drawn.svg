<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1144" viewBox="0 0 1200 1144" role="img" aria-labelledby="title desc">
  <title id="title">Two closed paths through common ancestors A and B</title>
  <desc id="desc">Path 1 follows I-E-C-A-D-F-I; Path 2 follows I-E-C-B-D-F-I. The two panels show the same individual I and shared intermediate people twice to isolate the two closed paths, not two different families. Source LECT15E authored slides 46 and 48 (image_021.png). Circles A, C, D and E; squares B, F and I. Conventional schematic; paths are undirected and spacing is not quantitative.</desc>

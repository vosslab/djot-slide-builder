  <text x="270" y="80" font-family="Atkinson Hyperlegible Next" font-size="54" font-weight="700" text-anchor="middle" fill="#213547">Path 1</text>
  <text x="930" y="80" font-family="Atkinson Hyperlegible Next" font-size="54" font-weight="700" text-anchor="middle" fill="#213547">Path 2</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="816" viewBox="0 0 1200 816" role="img" aria-labelledby="title desc">
<title id="title">Inbreeding pedigree</title><desc id="desc">A partners B and C. D descends from A and B; E descends from A and C. D and E have a double partnership line and one descendant I. Six source-colored symbols retain their original shapes.</desc>
<rect width="1200" height="816" fill="white"/>
<text x="60" y="75" font-family="Atkinson Hyperlegible Next" font-size="54" font-weight="700" fill="#293638">(A) Inbreeding pedigree</text>
<g id="relationships" fill="none" stroke="#293638" stroke-width="7" stroke-linejoin="round"><path id="B-A" d="M 215 210 H 545"/><path id="A-C" d="M 655 210 H 985"/><path id="D-descent" d="M 380 210 V 485"/><path id="E-descent" d="M 820 210 V 485"/><path id="D-E-upper" d="M 435 531 H 765"/><path id="D-E-lower" d="M 435 549 H 765"/><path id="I-descent" d="M 600 549 V 685"/></g>
<g id="individual-B">
<rect class="individual" x="105" y="155" width="110" height="110" fill="#d6a4ab" stroke="#293638" stroke-width="7"/>
<text x="160" y="231" text-anchor="middle" font-family="Atkinson Hyperlegible Next" font-size="64" font-weight="650" fill="#25332e">B</text></g>
<g id="individual-A">
<circle class="individual" cx="600" cy="210" r="55" fill="#f3b589" stroke="#293638" stroke-width="7"/>
<text x="600" y="231" text-anchor="middle" font-family="Atkinson Hyperlegible Next" font-size="64" font-weight="650" fill="#25332e">A</text></g>
<g id="individual-C">
<rect class="individual" x="985" y="155" width="110" height="110" fill="#b7a6ce" stroke="#293638" stroke-width="7"/>
<text x="1040" y="231" text-anchor="middle" font-family="Atkinson Hyperlegible Next" font-size="64" font-weight="650" fill="#25332e">C</text></g>
<g id="individual-D">
<circle class="individual" cx="380" cy="540" r="55" fill="#f3df7e" stroke="#293638" stroke-width="7"/>
<text x="380" y="561" text-anchor="middle" font-family="Atkinson Hyperlegible Next" font-size="64" font-weight="650" fill="#25332e">D</text></g>
<g id="individual-E">

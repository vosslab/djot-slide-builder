<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1243" viewBox="0 0 1200 1243" role="img" aria-labelledby="title desc">
  <title id="title">First-cousin pedigree</title>
  <desc id="desc">Conventional representation of the LECT15E first-cousin pedigree, source authored slides 45-46 (image_020.png). A (circle) and B (square) are parents of C and D (circles). C and D each have an unnamed square partner. C has an unnamed circle child and E (circle); D has F (square) and an unnamed circle child. E and F have a double consanguineous union line and child I (square). All 11 people and source connections are preserved. Conventional schematic; spacing has no quantitative meaning.</desc>
  <rect id="background" width="1200" height="1243" fill="#FFFFFF"/>
  <text x="600" y="90" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="middle" fill="#213547">Conventional representation</text>
  <g id="family-connections">
    <path id="ancestor-union" d="M 450,245 H 750" fill="none" stroke="#213547" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path id="ancestor-children" d="M 600,245 V 380 H 440 M 600,380 H 760 M 440,380 V 510 M 760,380 V 510" fill="none" stroke="#213547" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path id="second-generation-unions" d="M 180,510 H 440 M 760,510 H 1020" fill="none" stroke="#213547" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path id="left-children" d="M 310,510 V 680 M 170,680 H 450 M 170,680 V 830 M 450,680 V 830" fill="none" stroke="#213547" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path id="right-children" d="M 890,510 V 680 M 750,680 H 1030 M 750,680 V 830 M 1030,680 V 830" fill="none" stroke="#213547" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path id="cousin-union-upper" d="M 450,824 H 750" fill="none" stroke="#213547" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path id="cousin-union-lower" d="M 450,838 H 750" fill="none" stroke="#213547" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path id="child-I-descent" d="M 600,838 V 1100" fill="none" stroke="#213547" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <g id="people">
    <g id="A">
      <circle cx="450" cy="245" r="43" fill="#FFFFFF" stroke="#213547" stroke-width="5"/>
      <text x="450" y="263" font-family="Arial, Helvetica, sans-serif" font-size="54" text-anchor="middle" fill="#213547">A</text>
    </g>
    <g id="B">
      <rect x="707" y="202" width="86" height="86" fill="#FFFFFF" stroke="#213547" stroke-width="5"/>
      <text x="750" y="263" font-family="Arial, Helvetica, sans-serif" font-size="54" text-anchor="middle" fill="#213547">B</text>
    </g>
    <g id="C">
      <circle cx="440" cy="510" r="43" fill="#FFFFFF" stroke="#213547" stroke-width="5"/>
      <text x="440" y="528" font-family="Arial, Helvetica, sans-serif" font-size="54" text-anchor="middle" fill="#213547">C</text>
    </g>
    <g id="D">
      <circle cx="760" cy="510" r="43" fill="#FFFFFF" stroke="#213547" stroke-width="5"/>
      <text x="760" y="528" font-family="Arial, Helvetica, sans-serif" font-size="54" text-anchor="middle" fill="#213547">D</text>
    </g>
    <g id="C-partner">
      <rect x="137" y="467" width="86" height="86" fill="#FFFFFF" stroke="#213547" stroke-width="5"/>
    </g>
    <g id="D-partner">
      <rect x="977" y="467" width="86" height="86" fill="#FFFFFF" stroke="#213547" stroke-width="5"/>
    </g>
    <g id="E-sibling">
      <circle cx="170" cy="830" r="43" fill="#FFFFFF" stroke="#213547" stroke-width="5"/>
    </g>
    <g id="E">
      <circle cx="450" cy="830" r="43" fill="#FFFFFF" stroke="#213547" stroke-width="5"/>
      <text x="450" y="848" font-family="Arial, Helvetica, sans-serif" font-size="54" text-anchor="middle" fill="#213547">E</text>
    </g>
    <g id="F">
      <rect x="707" y="787" width="86" height="86" fill="#FFFFFF" stroke="#213547" stroke-width="5"/>
      <text x="750" y="848" font-family="Arial, Helvetica, sans-serif" font-size="54" text-anchor="middle" fill="#213547">F</text>
    </g>
    <g id="F-sibling">
      <circle cx="1030" cy="830" r="43" fill="#FFFFFF" stroke="#213547" stroke-width="5"/>
    </g>
    <g id="I">
      <rect x="557" y="1057" width="86" height="86" fill="#FFFFFF" stroke="#213547" stroke-width="5"/>
      <text x="600" y="1118" font-family="Arial, Helvetica, sans-serif" font-size="54" text-anchor="middle" fill="#213547">I</text>
    </g>
  </g>
</svg>

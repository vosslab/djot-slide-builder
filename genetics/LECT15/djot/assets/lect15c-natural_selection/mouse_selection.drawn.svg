<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="ms-title ms-desc">
  <title id="ms-title">Three modes of natural selection in mouse fur color</title>
  <desc id="ms-desc">A shared original population has a black bell-shaped distribution and five mice from pale cream to dark charcoal. Three branches compare directional, disruptive and stabilizing selection, from left to right. Black curves show the original distribution and red curves show the evolved distribution. White downward arrows mark phenotypes selected against: pale mice, intermediate mice, or both extremes. The directional distribution shifts toward dark fur, the disruptive distribution has two extreme peaks, and the stabilizing distribution narrows around intermediate fur. Remaining example mice show three darker tones, the two extreme tones, and the intermediate tone respectively. Curves and mouse anatomy are qualitative and unmeasured. The lecture's labels and explanations remain native slide text.</desc>
  <!-- Original vector construction for Genetics LECT15C, authored slide 46.
       Source concept: assets/lect15c-natural_selection/image_013.png.
       Mouse counts depict phenotype examples, not numerical population sizes. -->
  <defs>
    <g id="ms-mouse" stroke="#394248" stroke-linecap="round" stroke-linejoin="round">
      <!-- Far limbs and ear sit behind the connected silhouette. -->
      <path d="M47 57 Q38 65 40 74 L51 75 Q57 73 52 70 L48 69 L55 61" fill="#bfa38d" stroke-width="1.7"/>
      <path d="M90 70 Q94 77 102 79 L108 82 Q109 85 103 85 L89 83 L82 77" fill="#bfa38d" stroke-width="1.7"/>
      <path d="M37 39 C28 34 29 22 36 19 C45 16 48 26 45 34 Z" stroke-width="1.8"/>
      <path d="M37 32 C33 29 34 24 37 23 C41 22 43 27 41 31" fill="#c79586" stroke="none"/>
      <!-- The tail emerges from the rump and curls below the hind foot. -->
      <path d="M103 66 C119 73 130 86 122 97 C114 108 87 109 73 104 C92 106 114 103 117 94 C121 84 108 77 100 75 Z" fill="#bba18e" stroke-width="1.8"/>
      <path d="M106 73 C124 85 126 97 106 103" fill="none" stroke="#f0d8c4" stroke-width="1.6"/>
      <!-- Pointed muzzle, arched back, large haunch and tucked belly form one animal. -->
      <path d="M13 48 L21 42 Q25 36 32 34 L35 31 L40 33 C48 27 58 25 69 27 C88 27 101 39 105 55 C108 65 108 76 99 81 Q87 85 76 78 C66 80 55 77 48 71 L42 67 Q34 67 29 62 L22 60 Q16 56 13 53 Z" stroke-width="2.4"/>
      <path d="M47 36 C60 27 78 29 89 40 C78 35 66 35 57 40 Q51 44 47 42 Z" fill="#ffffff" opacity="0.22" stroke="none"/>
      <path d="M22 52 Q31 56 40 54 C45 65 55 69 68 71 Q82 76 95 73 Q89 81 76 77 C62 78 52 73 46 67 Q33 64 26 59 Z" fill="#fff0d8" opacity="0.46" stroke="none"/>
      <!-- Foreground pinna overlaps the neck; its asymmetric rim stays ear-like. -->
      <path d="M43 45 C35 41 33 31 37 24 C41 17 49 17 54 23 C60 31 54 42 47 46 Z" stroke-width="2"/>
      <path d="M43 40 C38 36 38 28 42 25 C47 21 52 26 52 31 Q51 37 46 40 Z" fill="#ca9987" stroke="#876d63" stroke-width="1"/>
      <path d="M42 27 Q45 23 49 27" fill="none" stroke="#f8dac4" stroke-width="1.4"/>
      <!-- Near limbs show ankle direction and toes rather than oval paws. -->
      <path d="M43 59 Q39 65 40 71 L46 74 L43 77 L31 76 Q27 75 30 72 L34 71 L35 65" fill="#d6b3a0" stroke-width="1.7"/>
      <path d="M88 56 C78 52 71 61 74 69 Q76 76 87 78 L93 80 L85 83 L72 83 Q67 85 71 88 L91 88 Q101 87 100 82 L99 77" stroke-width="1.8"/>
      <path d="M88 79 L94 81 L85 84 L73 84 Q70 85 73 87 L91 87 Q98 86 98 82 L96 79" fill="#d6b3a0" stroke="none"/>
      <path d="M32 73 L34 75 M36 73 L38 76 M75 85 L77 87 M81 85 L82 87" fill="none" stroke="#88695d" stroke-width="1"/>
      <ellipse cx="28.5" cy="44" rx="3.2" ry="3.6" fill="#17232c" stroke="none"/>
      <circle cx="27.6" cy="42.9" r="1.05" fill="#ffffff" stroke="none"/>
      <path d="M12 49 Q15 47 17 50 L15 53 Q12 53 12 49 Z" fill="#a66e68" stroke-width="1.1"/>
      <path d="M17 55 Q21 57 25 55" fill="none" stroke-width="1.1"/>
      <path d="M20 50 L3 43 M20 52 L1 51 M21 54 L5 59" fill="none" stroke="#52616a" stroke-width="0.95"/>
      <path d="M58 46 L62 44 M65 42 L69 41 M96 52 L98 56" fill="none" stroke="#ffffff" opacity="0.28" stroke-width="1.2"/>
    </g>

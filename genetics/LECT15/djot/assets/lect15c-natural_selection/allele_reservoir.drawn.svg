<text x="351" y="75" fill="#237344">Gained via</text>
<text x="351" y="114" fill="#237344">Mutation</text>
<text x="494" y="437" fill="#ad3436">Lost via</text>
<text x="494" y="476" fill="#ad3436">Drift</text>
</g>
</svg>

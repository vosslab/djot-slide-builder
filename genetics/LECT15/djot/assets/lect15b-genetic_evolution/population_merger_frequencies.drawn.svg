<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1386" viewBox="0 0 1000 1386" role="img" aria-labelledby="title desc">
<title id="title">Population merger allele and genotype frequencies</title><desc id="desc">Separate orange A and yellow a population pies merge into a combined allele-frequency pie. Source genotype frequencies and Hardy-Weinberg prediction remain as printed.</desc>
<rect width="1000" height="1386" fill="white"/>
<g id="pie-charts" stroke="#293638" stroke-width="2.5">
<g id="population-I"><circle cx="245" cy="265" r="165" fill="#dc7c30"/><path class="yellow-sector" d="M 245 265 L 245.000000 100.000000 A 165 165 0 0 1 245.000000 430.000000 Z" fill="#f4d33d"/></g>
<g id="population-II"><circle cx="785" cy="265" r="165" fill="#dc7c30"/><path class="yellow-sector" d="M 785 265 L 943.608180 219.519836 A 165 165 0 0 1 877.266829 401.791199 Z" fill="#f4d33d"/></g>
<g id="merged"><circle cx="520" cy="925" r="225" fill="#dc7c30"/><path class="yellow-sector" d="M 520 925 L 520.000000 700.000000 A 225 225 0 0 1 702.028824 1057.251682 Z" fill="#f4d33d"/></g>
</g><g id="barrier" fill="none" stroke="#293638" stroke-width="3.5" stroke-dasharray="14 10"><path d="M 510 53 L 510 267"/><path d="M 510 365 L 510 528"/></g><g id="merging-connectors" fill="none" stroke="#293638" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M 430 550 L 510 625 L 590 550"/><path d="M 494 622 L 510 636 L 526 622"/></g>

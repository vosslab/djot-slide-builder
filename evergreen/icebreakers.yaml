- id: food-classification
  tags:
  - general
  - genetics
  - classification
  - debate
  source: Instructor food-classification questions, November 10, 2026; Genetics LECT10A
  title: Icebreaker
  body: |-
    @prompt

    Is a hot dog a sandwich?\
    Is ice cream a soup?

    @examples

    State your name, major, and post-grad plans.

    - Pick one and defend your rule: ingredients, shape, temperature, or how it is eaten.
    - Examples: "A sandwich needs two slices of bread." "Ice cream becomes soup when it melts!"
- id: look-alike-mixup
  tags:
  - general
  - karyotypes
  - recognition
  - personal-experience
  source: Newly authored, November 10, 2026; recognizing similar-looking chromosomes
  title: Icebreaker
  body: |-
    @prompt

    What two things do you keep mixing up because they look alike?

    @examples

    State your name, major, and post-grad plans.

    - Ideas: remote controls, look-alike actors, spice jars, or similar app icons.
    - Example: "I grab the TV remote when I want the fan remote."
- id: missing-half-a-pair
  tags:
  - general
  - chromosome-segregation
  - everyday-frustrations
  source: Newly authored, November 10, 2026; keeping paired objects together
  title: Icebreaker
  body: |-
    @prompt

    Which item is most annoying to lose one of a pair?

    @examples

    State your name, major, and post-grad plans.

    - Ideas: gloves, socks, earbuds, shoes, or chopsticks.
    - Example: "One missing earbud ruins my entire bus ride."
- id: unhelpful-directions
  tags:
  - general
  - chromosome-addresses
  - mapping
  - short-story
  source: Newly authored, November 10, 2026; precise addresses and useful landmarks
  title: Icebreaker
  body: |-
    @prompt

    What is the least helpful set of directions you have ever received?

    @examples

    State your name, major, and post-grad plans.

    - Ideas: "Turn at the big tree," "It's just over there," or a landmark that is gone.
    - Example: "Turn where the gas station used to be."
- id: group-traditions
  tags:

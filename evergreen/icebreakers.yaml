    - Dr. Voss\: Lasagne, Waffles, Teriyaki Chicken
- id: scientific-misconduct
  tags:
  - biotechnology
  - ethics
  - Theranos
  source: biotech/LECT05/djot/lect05a-2026_biotech_announcements.djot, authored slide 3
  title: Icebreaker
  body: |-
    @prompt

    You discover scientific misconduct at your company. What would you do?

    @examples

    State your name, major, and plans after graduation.

    - Consider falsified data, hidden negative results, or false product claims.
    - Gather evidence, confront leadership, consult an expert, or report outside the company?
    - If no one is talking, please be the first to speak.
- id: modify-an-animal
  tags:
  - biotechnology
  - genetics
  - genetic-engineering
  source: biotech/LECT06/djot/lect06a-2026_biotech_announcements.djot, authored slide 3
  title: Icebreaker
  body: |-
    @prompt

    You can genetically modify one animal. What would you change?

    @examples

    State your name, major, and plans after graduation.

    - Choose a farm animal, pet, or wild species.
    - Ideas: a glow-in-the-dark cat, a heat-tolerant cow, or a dog that sheds less.
    - Explain the useful trait and one possible tradeoff.
    - If no one is talking, please be the first to speak.

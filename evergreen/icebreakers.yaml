- id: movie-perspectives
  tags:
  - general
  - movie-night
  - perspective
  - storytelling
  source: Newly authored, November 10, 2026; movie-night discussion
  title: Icebreaker
  body: |-
    @prompt

    Which movie or story would you retell from another character's point of view?

    @examples

    State your name, major, and post-grad plans.

    - Ideas: Jaws from the shark's side, Jurassic Park from a dinosaur's side, or a fairy tale from the sidekick's.
    - Example: "Jurassic Park, narrated by a dinosaur defending its home."

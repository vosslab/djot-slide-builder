usage: Reusable prompt-layout Djot icebreakers. Choose a fun prompt tangentially related to the week's
  content, or write one for that topic. Compare the previous two lectures' prompts and examples,
  then choose a different premise and type of response. Start with layout prompt and the Icebreaker
  title, then copy the body fragment containing the required prompt and examples slots. The layout
  supplies dark red question text and dark gray supporting text automatically. Use popular-culture as
  a fallback for weeks without a topic idea.
  Source references identify the original prompts; examples and formatting may be adapted.
icebreakers:
- id: outdoor-activities
  tags:
  - general
  - fallback
  source: genetics/LECT03/djot/lect03a-2026_announcements.djot, authored slide 3
  title: Icebreaker
  body: |-
    @prompt

    We had great weather this weekend. What is your favorite outdoor activity?

    @examples

    State your name, major, and post-grad plans

    - Dr. Voss\: riding my bicycle, watching my kids play sports, go on a walk
- id: popular-culture
  tags:
  - general
  - fallback
  source: genetics/LECT03/djot/lect03a-2026_announcements.djot, authored slide 4
  title: Icebreaker
  body: |-
    @prompt

    What piece of popular culture are you looking forward to?

    @examples

    State your name, major, and post-grad plans

    - Ideas: a movie, album, book, concert, or video game.
    - Example: "I'm looking forward to the next season of my favorite show."
- id: soft-drink-names
  tags:
  - general
  - fallback
  source: biotech/LECT03/djot/lect03a-2026_announcements.djot, authored slide 5
  title: Icebreaker
  body: |-
    @prompt

    What do you usually call a carbonated soft drink, like Sprite or Mountain Dew?

    @examples

    State your name, major, and plans after graduation.

    - If no one is talking, please be the first to speak and get things started.
    - Examples: soda, pop, soft drink, or coke.
    - Does your family use the same word as your friends?
- id: cooking
  tags:
  - general
  - fallback
  source: biotech/LECT03/djot/lect03a-2026_announcements.djot, authored slide 7
  title: Icebreaker
  body: |-
    @prompt

    What is the best dish you can cook?


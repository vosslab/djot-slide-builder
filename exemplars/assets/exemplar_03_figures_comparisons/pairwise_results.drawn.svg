<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<title>Three Pairwise Recombination Frequencies</title>
<desc>Bars share a zero origin and scale: CD 30%, CH 20%, DH 40%. These are observed recombination percentages, not chromosome lengths.</desc>
<g font-family="Arial, sans-serif">
<text x="600" y="45" font-size="40" fill="#182033" text-anchor="middle" font-weight="normal">Observed Recombination (%)</text><text x="145" y="158" font-size="48" fill="#182033" text-anchor="middle" font-weight="bold">CD</text><rect x="240" y="100" width="570" height="70" fill="#D40000" stroke="none" stroke-width="2"/><text x="830" y="155" font-size="44" fill="#D40000" text-anchor="start" font-weight="bold">30%</text><text x="145" y="278" font-size="48" fill="#182033" text-anchor="middle" font-weight="bold">CH</text><rect x="240" y="220" width="380" height="70" fill="#003FFF" stroke="none" stroke-width="2"/><text x="640" y="275" font-size="44" fill="#003FFF" text-anchor="start" font-weight="bold">20%</text><text x="145" y="398" font-size="48" fill="#182033" text-anchor="middle" font-weight="bold">DH</text><rect x="240" y="340" width="760" height="70" fill="#A719DB" stroke="none" stroke-width="2"/><text x="1020" y="395" font-size="44" fill="#A719DB" text-anchor="start" font-weight="bold">40%</text><line x1="240" y1="445" x2="1000" y2="445" stroke="#182033" stroke-width="2"/><line x1="240" y1="445" x2="240" y2="456" stroke="#182033" stroke-width="2"/><text x="240" y="495" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">0</text><line x1="430" y1="445" x2="430" y2="456" stroke="#182033" stroke-width="2"/><text x="430" y="495" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">10</text><line x1="620" y1="445" x2="620" y2="456" stroke="#182033" stroke-width="2"/><text x="620" y="495" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">20</text><line x1="810" y1="445" x2="810" y2="456" stroke="#182033" stroke-width="2"/><text x="810" y="495" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">30</text><line x1="1000" y1="445" x2="1000" y2="456" stroke="#182033" stroke-width="2"/><text x="1000" y="495" font-size="30" fill="#182033" text-anchor="middle" font-weight="normal">40</text>
</g>
</svg>

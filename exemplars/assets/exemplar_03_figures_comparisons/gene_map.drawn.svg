<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510">
<title>Gene Order and Map Intervals</title>
<desc>D-C is 30 cM and C-H is 20 cM, drawn in a 30:20 ratio. The interval sum is 50 cM; D-H observed recombination remains 40%.</desc>
<g font-family="Arial, sans-serif">
<line x1="110" y1="225" x2="698.0" y2="225" stroke="#D40000" stroke-width="10"/><line x1="698.0" y1="225" x2="1090" y2="225" stroke="#003FFF" stroke-width="10"/><text x="404.0" y="167" font-size="52" fill="#D40000" text-anchor="middle" font-weight="bold">30 cM</text><text x="894.0" y="167" font-size="52" fill="#003FFF" text-anchor="middle" font-weight="bold">20 cM</text><line x1="110" y1="208" x2="110" y2="242" stroke="#182033" stroke-width="5"/><text x="110" y="301" font-size="60" fill="#182033" text-anchor="middle" font-weight="bold">D</text><line x1="1090" y1="208" x2="1090" y2="242" stroke="#182033" stroke-width="5"/><text x="1090" y="301" font-size="60" fill="#182033" text-anchor="middle" font-weight="bold">H</text><line x1="698.0" y1="208" x2="698.0" y2="242" stroke="#182033" stroke-width="5"/><text x="698.0" y="301" font-size="60" fill="#182033" text-anchor="middle" font-weight="bold">C</text><path d="M 110,323 V 338 H 1090 V 323" fill="none" stroke="#182033" stroke-width="3"/><text x="600.0" y="391" font-size="46" fill="#182033" text-anchor="middle" font-weight="normal">30 + 20 = 50 cM</text><text x="600.0" y="469" font-size="44" fill="#A719DB" text-anchor="middle" font-weight="normal">D-H observed: 40%</text>
</g>
</svg>

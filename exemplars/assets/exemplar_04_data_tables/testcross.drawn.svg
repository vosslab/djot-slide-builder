<svg xmlns="http://www.w3.org/2000/svg" width="620" height="390" viewBox="0 0 620 390">
<title>A Three-Locus Testcross</title>
<desc>Each locus is written separately: gene order and parental phase are not yet known. The recessive tester contributes c, d, and h to every offspring.</desc>
<g font-family="Arial, sans-serif">
<text x="145" y="45" font-size="32" fill="#182033" text-anchor="middle" font-weight="normal">Triple</text><text x="145" y="84" font-size="32" fill="#182033" text-anchor="middle" font-weight="normal">Heterozygote</text><text x="475" y="45" font-size="32" fill="#182033" text-anchor="middle" font-weight="normal">Recessive</text><text x="475" y="84" font-size="32" fill="#182033" text-anchor="middle" font-weight="normal">Tester</text><text x="310" y="160" font-size="50" fill="#182033" text-anchor="middle" font-weight="normal">×</text><text x="145" y="145" font-size="38" fill="#182033" text-anchor="middle" font-weight="normal">c/+</text><text x="475" y="145" font-size="38" fill="#182033" text-anchor="middle" font-weight="normal">c/c</text><text x="145" y="191" font-size="38" fill="#182033" text-anchor="middle" font-weight="normal">d/+</text><text x="475" y="191" font-size="38" fill="#182033" text-anchor="middle" font-weight="normal">d/d</text><text x="145" y="237" font-size="38" fill="#182033" text-anchor="middle" font-weight="normal">h/+</text><text x="475" y="237" font-size="38" fill="#182033" text-anchor="middle" font-weight="normal">h/h</text><line x1="310" y1="255" x2="310" y2="310" stroke="#182033" stroke-width="4"/><path d="M 298,295 L 310,313 L 322,295" fill="none" stroke="#182033" stroke-width="4"/><text x="310" y="365" font-size="42" fill="#182033" text-anchor="middle" font-weight="bold">Offspring</text>
</g>
</svg>
